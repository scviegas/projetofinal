<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto em Ação — A Jornada do Pesquisador</title>
<style>
:root {
  --bg-deep: #0f172a;
  --bg-card: #1e293b;
  --bg-soft: #f8fafc;
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #818cf8;
  --accent: #f59e0b;
  --accent-dark: #d97706;
  --success: #10b981;
  --success-light: #34d399;
  --danger: #ef4444;
  --warning: #fbbf24;
  --text-dark: #0f172a;
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  --border: #334155;
  --shadow-lg: 0 20px 50px -10px rgba(0,0,0,0.5);
  --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
  min-height: 100vh;
  color: var(--text-light);
  overflow-x: hidden;
  position: relative;
}

/* Decorative animated background */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-30px, 20px); }
}

.app {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 16px 24px;
  background: rgba(30, 41, 59, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(99, 102, 241, 0.2);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

.logo-text h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-text p {
  font-size: 12px;
  color: var(--text-muted);
}

.hud {
  display: flex;
  gap: 16px;
  align-items: center;
}

.hud-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
}

.hud-icon { font-size: 16px; }

.score-val { color: var(--accent); }
.stars-val { color: var(--warning); }
.phase-val { color: var(--primary-light); }

/* Progress bar */
.progress-bar {
  height: 6px;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 24px;
  border: 1px solid rgba(99, 102, 241, 0.2);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent), var(--success));
  background-size: 200% 100%;
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  animation: shimmer 3s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 0% 0%; }
  100% { background-position: 200% 0%; }
}

/* Main card */
.card {
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(99, 102, 241, 0.25);
  border-radius: 24px;
  padding: 36px;
  box-shadow: var(--shadow-lg);
  min-height: 500px;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent), var(--success));
}

/* Welcome screen */
.welcome {
  text-align: center;
  padding: 20px;
}

.welcome-emoji {
  font-size: 80px;
  margin-bottom: 20px;
  display: inline-block;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.welcome h2 {
  font-size: 36px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
}

.welcome p {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.7;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

.story-box {
  background: rgba(15, 23, 42, 0.5);
  border-left: 4px solid var(--accent);
  padding: 20px 24px;
  border-radius: 12px;
  margin: 24px auto;
  max-width: 700px;
  text-align: left;
  font-style: italic;
  color: #cbd5e1;
  line-height: 1.7;
}

.chapter-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 24px 0;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.chapter-card {
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(99, 102, 241, 0.2);
  border-radius: 12px;
  padding: 16px;
  text-align: left;
  transition: all 0.3s;
}

.chapter-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}

.chapter-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.chapter-card h4 {
  font-size: 14px;
  margin: 6px 0 4px 0;
  color: var(--text-light);
}

.chapter-card p {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 32px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(99, 102, 241, 0.55);
}

.btn-secondary {
  background: rgba(99, 102, 241, 0.15);
  color: var(--primary-light);
  border: 1px solid rgba(99, 102, 241, 0.4);
}

.btn-secondary:hover {
  background: rgba(99, 102, 241, 0.25);
}

.btn-accent {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
}

.btn-accent:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(245, 158, 11, 0.55);
}

.btn-success {
  background: linear-gradient(135deg, var(--success), #059669);
  color: white;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
}

.btn-success:hover {
  transform: translateY(-2px);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Chapter header */
.chapter-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(99, 102, 241, 0.2);
}

.chapter-badge {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
}

.chapter-info h3 {
  font-size: 22px;
  margin-bottom: 4px;
  color: var(--text-light);
}

.chapter-info .subtitle {
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Story narration */
.narration {
  background: rgba(15, 23, 42, 0.5);
  border-left: 4px solid var(--primary);
  padding: 20px 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  line-height: 1.8;
  color: #e2e8f0;
  font-size: 15px;
}

.narration .speaker {
  font-weight: 700;
  color: var(--primary-light);
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Question */
.question-box {
  background: rgba(15, 23, 42, 0.4);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(99, 102, 241, 0.15);
}

.question-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}

.question-text {
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-light);
  margin-bottom: 8px;
}

.question-hint {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

/* Options */
.options {
  display: grid;
  gap: 12px;
  margin-bottom: 24px;
}

.option {
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(99, 102, 241, 0.25);
  border-radius: 12px;
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 15px;
  color: var(--text-light);
  text-align: left;
  font-family: inherit;
}

.option:hover:not(.disabled) {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.1);
  transform: translateX(4px);
}

.option-letter {
  width: 32px;
  height: 32px;
  background: rgba(99, 102, 241, 0.2);
  border: 1px solid rgba(99, 102, 241, 0.4);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--primary-light);
  flex-shrink: 0;
}

.option.correct {
  background: rgba(16, 185, 129, 0.15);
  border-color: var(--success);
}

.option.correct .option-letter {
  background: var(--success);
  color: white;
}

.option.incorrect {
  background: rgba(239, 68, 68, 0.15);
  border-color: var(--danger);
}

.option.incorrect .option-letter {
  background: var(--danger);
  color: white;
}

.option.disabled {
  cursor: not-allowed;
  opacity: 0.7;
}

/* Feedback */
.feedback {
  border-radius: 12px;
  padding: 18px 22px;
  margin-top: 20px;
  display: none;
  border-left: 4px solid;
  animation: slideIn 0.4s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.feedback.show { display: block; }

.feedback.correct {
  background: rgba(16, 185, 129, 0.1);
  border-color: var(--success);
}

.feedback.incorrect {
  background: rgba(239, 68, 68, 0.1);
  border-color: var(--danger);
}

.feedback-title {
  font-weight: 700;
  margin-bottom: 8px;
  font-size: 15px;
}

.feedback.correct .feedback-title { color: var(--success-light); }
.feedback.incorrect .feedback-title { color: #fca5a5; }

.feedback-text {
  font-size: 14px;
  line-height: 1.6;
  color: #cbd5e1;
}

/* Action bar */
.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  gap: 12px;
}

/* Drag and drop */
.drag-zone {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.drag-item {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(245, 158, 11, 0.1));
  border: 2px solid rgba(99, 102, 241, 0.4);
  border-radius: 10px;
  padding: 14px;
  cursor: grab;
  text-align: center;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s;
  user-select: none;
}

.drag-item:hover {
  transform: scale(1.05);
  border-color: var(--accent);
}

.drag-item:active { cursor: grabbing; }

.drag-item.dragging {
  opacity: 0.5;
  transform: scale(0.95);
}

.drop-zones {
  display: grid;
  gap: 14px;
  margin: 20px 0;
}

.drop-zone {
  background: rgba(15, 23, 42, 0.5);
  border: 2px dashed rgba(99, 102, 241, 0.4);
  border-radius: 12px;
  padding: 16px;
  min-height: 80px;
  transition: all 0.2s;
}

.drop-zone.over {
  border-color: var(--accent);
  background: rgba(245, 158, 11, 0.1);
}

.drop-zone-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.drop-zone-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  min-height: 40px;
}

.dropped-item {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.dropped-item .remove-x {
  opacity: 0.7;
  font-size: 14px;
}

.dropped-item .remove-x:hover { opacity: 1; }

/* Matching game */
.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.match-item {
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(99, 102, 241, 0.25);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  text-align: center;
  font-size: 14px;
  transition: all 0.2s;
  font-weight: 500;
}

.match-item:hover {
  border-color: var(--primary);
}

.match-item.selected {
  background: rgba(99, 102, 241, 0.2);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
}

.match-item.matched {
  background: rgba(16, 185, 129, 0.15);
  border-color: var(--success);
  color: var(--success-light);
  cursor: default;
}

.match-item.wrong {
  background: rgba(239, 68, 68, 0.15);
  border-color: var(--danger);
  animation: shake 0.4s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* True/False */
.tf-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.tf-btn {
  padding: 24px;
  border-radius: 14px;
  border: 2px solid;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.tf-btn.true {
  background: rgba(16, 185, 129, 0.1);
  border-color: var(--success);
  color: var(--success-light);
}

.tf-btn.false {
  background: rgba(239, 68, 68, 0.1);
  border-color: var(--danger);
  color: #fca5a5;
}

.tf-btn:hover:not(.disabled) {
  transform: translateY(-3px);
}

.tf-btn.selected {
  transform: scale(1.02);
}

/* Fill in the blank */
.fill-blank {
  font-size: 18px;
  line-height: 1.8;
  margin: 16px 0;
  color: var(--text-light);
}

.fill-input {
  display: inline-block;
  width: 200px;
  padding: 6px 12px;
  margin: 0 4px;
  background: rgba(15, 23, 42, 0.8);
  border: 2px solid rgba(99, 102, 241, 0.4);
  border-radius: 8px;
  color: var(--text-light);
  font-size: 15px;
  font-family: inherit;
  text-align: center;
}

.fill-input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Chapter complete */
.complete-screen {
  text-align: center;
  padding: 20px;
}

.complete-icon {
  font-size: 70px;
  margin-bottom: 16px;
  display: inline-block;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% { transform: scale(0); }
  70% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.complete-screen h2 {
  font-size: 28px;
  margin-bottom: 12px;
  color: var(--success-light);
}

.complete-screen p {
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.7;
}

.stars-display {
  font-size: 36px;
  margin: 20px 0;
  letter-spacing: 8px;
}

.star { color: rgba(148, 163, 184, 0.3); }
.star.earned { color: var(--warning); animation: starPop 0.5s ease; }

@keyframes starPop {
  0% { transform: scale(0) rotate(-180deg); }
  100% { transform: scale(1) rotate(0); }
}

.summary-list {
  background: rgba(15, 23, 42, 0.5);
  border-radius: 12px;
  padding: 20px;
  margin: 20px auto;
  max-width: 600px;
  text-align: left;
}

.summary-list h4 {
  color: var(--accent);
  margin-bottom: 12px;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.summary-list ul {
  list-style: none;
}

.summary-list li {
  padding: 8px 0;
  padding-left: 24px;
  position: relative;
  color: #cbd5e1;
  font-size: 14px;
  line-height: 1.6;
}

.summary-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--success);
  font-weight: 700;
}

/* Certificate */
.certificate {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  color: #78350f;
  padding: 40px;
  border-radius: 20px;
  border: 8px double #92400e;
  margin: 20px 0;
  text-align: center;
  position: relative;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.certificate::before, .certificate::after {
  content: '🎓';
  position: absolute;
  font-size: 40px;
  top: 10px;
}

.certificate::before { left: 20px; }
.certificate::after { right: 20px; }

.cert-title {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 8px;
  color: #78350f;
}

.cert-subtitle {
  font-size: 14px;
  color: #92400e;
  margin-bottom: 24px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.cert-body {
  font-size: 16px;
  line-height: 1.8;
  color: #78350f;
  margin: 20px 0;
}

.cert-name {
  font-size: 28px;
  font-weight: 700;
  margin: 16px 0;
  border-bottom: 2px solid #92400e;
  display: inline-block;
  padding: 0 20px 4px;
}

.cert-score {
  font-size: 18px;
  margin: 16px 0;
}

.cert-footer {
  display: flex;
  justify-content: space-around;
  margin-top: 30px;
  font-size: 12px;
  color: #92400e;
}

.cert-sig {
  border-top: 1px solid #92400e;
  padding-top: 6px;
  margin-top: 30px;
}

.name-input {
  padding: 10px 16px;
  border: 2px solid #92400e;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  background: rgba(255,255,255,0.5);
  color: #78350f;
  text-align: center;
  margin: 10px;
}

/* Toast */
.toast {
  position: fixed;
  top: 24px;
  right: 24px;
  background: rgba(30, 41, 59, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(99, 102, 241, 0.4);
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  z-index: 1000;
  transform: translateX(400px);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 350px;
}

.toast.show { transform: translateX(0); }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.info { border-color: var(--primary); }

/* Map / Chapter selection */
.map-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-top: 24px;
}

.map-card {
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(99, 102, 241, 0.25);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.map-card:hover:not(.locked) {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
}

.map-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}

.map-card.completed {
  border-color: var(--success);
}

.map-card-icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.map-card h4 {
  font-size: 16px;
  margin-bottom: 6px;
  color: var(--text-light);
}

.map-card p {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}

.map-card-status {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 18px;
}

.map-card-stars {
  margin-top: 10px;
  font-size: 14px;
  color: var(--warning);
  letter-spacing: 2px;
}

/* Final results */
.final-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
  margin: 24px 0;
}

.stat-box {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(99, 102, 241, 0.3);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.stat-value {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  .app { padding: 12px; }
  .card { padding: 20px; }
  .header { flex-direction: column; gap: 12px; }
  .welcome h2 { font-size: 26px; }
  .chapter-overview { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr; }
  .tf-buttons { grid-template-columns: 1fr; }
  .question-text { font-size: 16px; }
  .cert-title { font-size: 22px; }
}

/* Custom scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

.hidden { display: none !important; }
</style>

// ===================== UTILITIES =====================
function $(sel) { return document.querySelector(sel); }
function el(tag, className, content) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (content !== undefined) e.innerHTML = content;
  return e;
}

function showToast(message, type = 'info', duration = 3000) {
  const toast = $('#toast');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> <span>${message}</span>`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

function updateHUD() {
  $('#scoreVal').textContent = state.score;
  $('#starsVal').textContent = state.stars;
  $('#phaseVal').textContent = state.currentChapter || 0;
  const totalSteps = chapters.reduce((sum, c) => sum + c.steps.length, 0);
  const completedSteps = chapters.reduce((sum, c, i) => 
    sum + (state.chapterCompleted[i] ? c.steps.length : 0), 0);
  const progress = (completedSteps / totalSteps) * 100;
  $('#progressFill').style.width = progress + '%';
}

function render(html) {
  $('#mainCard').innerHTML = html;
  $('#mainCard').scrollTop = 0;
}

// ===================== START =====================
function startGame() {
  state.screen = 'map';
  state.currentChapter = 0;
  renderMap();
}

function startChapter(idx) {
  state.currentChapter = idx;
  state.currentStep = 0;
  state.screen = 'chapter';
  renderChapterStep();
}

// ===================== CHAPTER STEP RENDERER =====================
function renderChapterStep() {
  const chapter = chapters[state.currentChapter];
  const step = chapter.steps[state.currentStep];
  const totalSteps = chapter.steps.length;
  const progress = ((state.currentStep) / totalSteps) * 100;

  let content = `
    <div class="chapter-header">
      <div class="chapter-badge">${chapter.icon}</div>
      <div class="chapter-info">
        <div class="subtitle">Capítulo ${chapter.id} · Passo ${state.currentStep + 1} de ${totalSteps}</div>
        <h3>${chapter.title}</h3>
      </div>
    </div>
    <div class="progress-bar" style="margin-bottom: 20px;">
      <div class="progress-fill" style="width: ${progress}%;"></div>
    </div>
  `;

  if (step.type === 'narration') {
    content += `
      <div class="narration">
        <span class="speaker">${step.speaker}</span>
        ${step.text}
      </div>
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="renderMap()">← Voltar ao Mapa</button>
        <button class="btn btn-primary" onclick="nextStep()">${step.cta}</button>
      </div>
    `;
  } else if (step.type === 'quiz') {
    content += renderQuiz(step);
  } else if (step.type === 'match') {
    content += renderMatch(step);
  } else if (step.type === 'sort') {
    content += renderSort(step);
  }

  render(content);

  // Initialize interactive features
  if (step.type === 'match') initMatch(step);
  if (step.type === 'sort') initSort(step);
}

function renderQuiz(step) {
  const options = step.options.map((opt, i) => `
    <button class="option" data-idx="${i}" onclick="answerQuiz(${i})">
      <div class="option-letter">${String.fromCharCode(65 + i)}</div>
      <div>${opt.text}</div>
    </button>
  `).join('');

  return `
    <div class="question-box">
      <div class="question-label">📝 Desafio</div>
      <div class="question-text">${step.question}</div>
      ${step.hint ? `<div class="question-hint">💡 ${step.hint}</div>` : ''}
    </div>
    <div class="options" id="optionsList">${options}</div>
    <div class="feedback" id="feedback"></div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="renderMap()">← Voltar ao Mapa</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>Próximo →</button>
    </div>
  `;
}

function answerQuiz(idx) {
  const chapter = chapters[state.currentChapter];
  const step = chapter.steps[state.currentStep];
  const opt = step.options[idx];
  const options = document.querySelectorAll('.option');
  
  options.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === idx) {
      o.classList.add(opt.correct ? 'correct' : 'incorrect');
    }
    // Show correct one if user got it wrong
    if (!opt.correct && step.options[i].correct) {
      o.classList.add('correct');
    }
  });

  const fb = $('#feedback');
  fb.className = `feedback show ${opt.correct ? 'correct' : 'incorrect'}`;
  fb.innerHTML = `
    <div class="feedback-title">${opt.correct ? '✅ Muito bem!' : '❌ Quase lá!'}</div>
    <div class="feedback-text">${opt.feedback}</div>
  `;

  if (opt.correct) {
    state.score += 100;
    showToast('+100 pontos!', 'success');
  } else {
    state.score += 30;
    showToast('+30 pontos pela tentativa', 'info');
  }
  updateHUD();
  $('#nextBtn').disabled = false;
}

// ===================== MATCH GAME =====================
let matchState = { selected: null, matched: 0, total: 0 };

function renderMatch(step) {
  const leftItems = step.pairs.map((p, i) => 
    `<div class="match-item" data-side="left" data-idx="${i}" onclick="selectMatch('left', ${i})">${p.left}</div>`
  ).join('');
  
  const rightItems = step.pairs.map((p, i) => 
    `<div class="match-item" data-side="right" data-idx="${i}" onclick="selectMatch('right', ${i})">${p.right}</div>`
  ).join('');

  // Shuffle right column
  const shuffled = step.pairs.map((p, i) => i).sort(() => Math.random() - 0.5);
  const rightShuffled = shuffled.map(i => 
    `<div class="match-item" data-side="right" data-idx="${i}" onclick="selectMatch('right', ${i})">${step.pairs[i].right}</div>`
  ).join('');

  return `
    <div class="question-box">
      <div class="question-label">🔗 Associação</div>
      <div class="question-text">${step.title}</div>
      ${step.hint ? `<div class="question-hint">💡 ${step.hint}</div>` : ''}
    </div>
    <div class="match-grid">
      <div class="match-col" id="leftCol">${leftItems}</div>
      <div class="match-col" id="rightCol">${rightShuffled}</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="renderMap()">← Voltar ao Mapa</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled>Próximo →</button>
    </div>
  `;
}

function initMatch(step) {
  matchState = { selected: null, matched: 0, total: step.pairs.length };
}

function selectMatch(side, idx) {
  const items = document.querySelectorAll('.match-item');
  items.forEach(i => { if (!i.classList.contains('matched')) i.classList.remove('selected'); });
  
  const item = document.querySelector(`.match-item[data-side="${side}"][data-idx="${idx}"]`);
  if (item.classList.contains('matched')) return;
  
  item.classList.add('selected');

  if (!matchState.selected) {
    matchState.selected = { side, idx };
  } else {
    if (matchState.selected.side === side) {
      // Same side - just change selection
      matchState.selected = { side, idx };
      return;
    }
    
    // Different sides - check if match
    const leftIdx = side === 'left' ? idx : matchState.selected.idx;
    const rightIdx = side === 'right' ? idx : matchState.selected.idx;
    
    const leftItem = document.querySelector(`.match-item[data-side="left"][data-idx="${leftIdx}"]`);
    const rightItem = document.querySelector(`.match-item[data-side="right"][data-idx="${rightIdx}"]`);
    
    if (leftIdx === rightIdx) {
      // Correct match
      leftItem.classList.remove('selected');
      rightItem.classList.remove('selected');
      leftItem.classList.add('matched');
      rightItem.classList.add('matched');
      matchState.matched++;
      state.score += 50;
      showToast('Par correto! +50 pontos', 'success');
      updateHUD();
      
      if (matchState.matched === matchState.total) {
        const fb = $('#feedback');
        fb.className = 'feedback show correct';
        fb.innerHTML = `
          <div class="feedback-title">✅ Todos os pares corretos!</div>
          <div class="feedback-text">Você conectou todas as informações com sucesso. Avance para o próximo desafio!</div>
        `;
        $('#nextBtn').disabled = false;
      }
    } else {
      // Wrong match
      leftItem.classList.add('wrong');
      rightItem.classList.add('wrong');
      setTimeout(() => {
        leftItem.classList.remove('wrong', 'selected');
        rightItem.classList.remove('wrong', 'selected');
      }, 600);
      showToast('Tente novamente!', 'error', 1500);
    }
    matchState.selected = null;
  }
}

// ===================== SORT GAME =====================
let sortState = { items: [], placed: [] };

function renderSort(step) {
  const shuffled = [...step.items].sort(() => Math.random() - 0.5);
  sortState = { items: step.items, placed: [], shuffled };

  const items = shuffled.map((item, i) => `
    <div class="drag-item" draggable="true" data-id="${item.id}" id="drag-${item.id}">
      ${item.text}
    </div>
  `).join('');

  return `
    <div class="question-box">
      <div class="question-label">🔄 Ordenação</div>
      <div class="question-text">${step.title}</div>
      ${step.hint ? `<div class="question-hint">💡 ${step.hint}</div>` : ''}
    </div>
    <h4 style="color: var(--accent); margin: 16px 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">📋 Itens para ordenar:</h4>
    <div class="drag-zone" id="dragZone">${items}</div>
    <h4 style="color: var(--accent); margin: 16px 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">✅ Ordem correta:</h4>
    <div class="drop-zones" id="dropZones">
      ${step.items.map((_, i) => `
        <div class="drop-zone" data-pos="${i}" ondrop="dropSort(event, ${i})" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
          <div class="drop-zone-title">Posição ${i + 1}</div>
          <div class="drop-zone-items" id="drop-items-${i}"></div>
        </div>
      `).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="renderMap()">← Voltar ao Mapa</button>
      <button class="btn btn-primary" id="checkBtn" onclick="checkSort()">Verificar Ordem</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextStep()" disabled style="display: none;">Próximo →</button>
    </div>
  `;
}

function initSort(step) {
  const draggables = document.querySelectorAll('.drag-item');
  draggables.forEach(d => {
    d.addEventListener('dragstart', (e) => {
      d.classList.add('dragging');
      e.dataTransfer.setData('text/plain', d.dataset.id);
    });
    d.addEventListener('dragend', () => d.classList.remove('dragging'));
  });
}

function allowDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.add('over');
}

function leaveDrop(e) {
  e.currentTarget.classList.remove('over');
}

function dropSort(e, pos) {
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain');
  const dragged = document.getElementById(`drag-${id}`);
  if (!dragged) return;
  
  // Remove from previous position if any
  const oldContainer = dragged.parentElement;
  if (oldContainer.classList.contains('drop-zone-items')) {
    oldContainer.innerHTML = '';
  }
  
  // Check if position already has an item
  const target = document.getElementById(`drop-items-${pos}`);
  if (target.children.length > 0) {
    // Move existing item back to drag zone
    const existing = target.children[0];
    document.getElementById('dragZone').appendChild(existing);
  }
  
  target.appendChild(dragged);
}

function checkSort() {
  const chapter = chapters[state.currentChapter];
  const step = chapter.steps[state.currentStep];
  let allCorrect = true;
  let allPlaced = true;
  
  step.items.forEach((item, i) => {
    const dropZone = document.getElementById(`drop-items-${i}`);
    if (dropZone.children.length === 0) {
      allPlaced = false;
      return;
    }
    const placed = dropZone.children[0];
    if (placed.dataset.id !== item.id) {
      allCorrect = false;
    }
  });
  
  const fb = $('#feedback');
  
  if (!allPlaced) {
    fb.className = 'feedback show incorrect';
    fb.innerHTML = `
      <div class="feedback-title">⚠️ Incompleto</div>
      <div class="feedback-text">Preencha todas as posições antes de verificar.</div>
    `;
    return;
  }
  
  if (allCorrect) {
    fb.className = 'feedback show correct';
    fb.innerHTML = `
      <div class="feedback-title">✅ Ordem correta!</div>
      <div class="feedback-text">Você organizou os elementos na sequência ideal. Continue assim!</div>
    `;
    state.score += 150;
    showToast('+150 pontos!', 'success');
    updateHUD();
    $('#checkBtn').style.display = 'none';
    $('#nextBtn').style.display = 'inline-flex';
    $('#nextBtn').disabled = false;
  } else {
    fb.className = 'feedback show incorrect';
    fb.innerHTML = `
      <div class="feedback-title">❌ Ordem incorreta</div>
      <div class="feedback-text">Revise a sequência. Tente novamente!</div>
    `;
    state.score += 30;
    updateHUD();
    showToast('Tente novamente!', 'error');
  }
}

// ===================== NEXT STEP / CHAPTER COMPLETE =====================
function nextStep() {
  state.currentStep++;
  const chapter = chapters[state.currentChapter];
  
  if (state.currentStep >= chapter.steps.length) {
    completeChapter();
  } else {
    renderChapterStep();
  }
}

function completeChapter() {
  const chapter = chapters[state.currentChapter];
  state.chapterCompleted[state.currentChapter] = true;
  
  // Calculate stars based on chapter performance
  // Each chapter has between 1-3 stars
  // For simplicity: 3 stars if completed (we can refine later)
  const earnedStars = 3;
  state.chapterStars[state.currentChapter] = earnedStars;
  state.stars += earnedStars;
  
  const summaryItems = chapter.summary.map(s => `<li>${s}</li>`).join('');
  const allDone = state.chapterCompleted.every(v => v);
  
  render(`
    <div class="complete-screen">
      <div class="complete-icon">🎉</div>
      <h2>Capítulo ${chapter.id} Concluído!</h2>
      <p>${chapter.title}</p>
      
      <div class="stars-display">
        ${[1,2,3].map(i => `<span class="star earned">★</span>`).join('')}
      </div>
      
      <div class="summary-list">
        <h4>📚 O que você aprendeu:</h4>
        <ul>${summaryItems}</ul>
      </div>

      <div class="action-bar" style="justify-content: center; max-width: 600px; margin: 24px auto 0;">
        <button class="btn btn-secondary" onclick="renderMap()">🗺️ Voltar ao Mapa</button>
        ${allDone ? 
          `<button class="btn btn-accent" onclick="renderFinal()">🏆 Ver Resultado Final</button>` : 
          `<button class="btn btn-primary" onclick="nextChapter()">➡️ Próximo Capítulo</button>`
        }
      </div>
    </div>
  `);
  
  updateHUD();
  showToast(`Capítulo concluído! +3 estrelas ⭐`, 'success');
}

function nextChapter() {
  state.currentChapter++;
  state.currentStep = 0;
  renderChapterStep();
}

// ===================== FINAL SCREEN =====================
function renderFinal() {
  const maxScore = 5 * 3 * 100 + 5 * 50 + 2 * 150 + 5 * 30; // approximate
  const totalStars = state.stars;
  const maxStars = 15;
  const percentage = Math.round((state.stars / maxStars) * 100);
  
  let medal = '🥉';
  let title = 'Bronze';
  let msg = 'Você completou a jornada! Continue praticando para alcançar o nível Ouro.';
  if (percentage >= 90) { medal = '🥇'; title = 'Ouro'; msg = 'Desempenho excepcional! Você dominou todos os conceitos da construção de um projeto tecnológico.'; }
  else if (percentage >= 70) { medal = '🥈'; title = 'Prata'; msg = 'Excelente trabalho! Você está pronto para construir um projeto sólido e ético.'; }

  render(`
    <div class="complete-screen">
      <div class="complete-icon">${medal}</div>
      <h2 style="color: var(--accent);">Jornada Completa!</h2>
      <p>${msg}</p>
      
      <div class="final-stats">
        <div class="stat-box">
          <div class="stat-value">${state.score}</div>
          <div class="stat-label">Pontos</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${totalStars}/${maxStars}</div>
          <div class="stat-label">Estrelas</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">5/5</div>
          <div class="stat-label">Capítulos</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${percentage}%</div>
          <div class="stat-label">Aproveitamento</div>
        </div>
      </div>

      <h3 style="margin: 32px 0 16px 0; color: var(--accent); font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">🎓 Emitir Certificado</h3>
      <p style="color: var(--text-muted); margin-bottom: 16px;">Digite seu nome para gerar seu certificado de conclusão:</p>
      <input type="text" class="name-input" id="studentName" placeholder="Seu nome completo" style="display: block; margin: 0 auto 16px auto; width: 100%; max-width: 400px;">
      <button class="btn btn-accent" onclick="generateCertificate()">📜 Gerar Certificado</button>
      
      <div id="certificateContainer" style="margin-top: 32px;"></div>

      <div style="margin-top: 32px;">
        <button class="btn btn-secondary" onclick="restartGame()">🔄 Jogar Novamente</button>
      </div>
    </div>
  `);
}

function generateCertificate() {
  const name = $('#studentName').value.trim() || 'Pesquisador(a)';
  state.studentName = name;
  const date = new Date().toLocaleDateString('pt-BR');
  
  $('#certificateContainer').innerHTML = `
    <div class="certificate">
      <div class="cert-title">Certificado de Conclusão</div>
      <div class="cert-subtitle">Projeto em Ação · A Jornada do Pesquisador</div>
      <div class="cert-body">
        Certificamos que<br>
        <span class="cert-name">${name}</span><br>
        concluiu com êxito a jornada de construção do Projeto Tecnológico,<br>
        dominando os conceitos de Referencial Teórico, Trabalhos Relacionados,<br>
        Ética Científica e Normas ABNT.
      </div>
      <div class="cert-score">
        ⭐ ${state.stars}/15 estrelas · 🏆 ${state.score} pontos
      </div>
      <div class="cert-footer">
        <div>
          <div class="cert-sig">Profª Orientadora</div>
        </div>
        <div>
          <div class="cert-sig">${date}</div>
        </div>
      </div>
    </div>
    <div style="text-align: center; margin-top: 16px;">
      <p style="color: var(--text-muted); font-size: 13px;">💡 Dica: Para salvar, use Ctrl+P e escolha "Salvar como PDF"</p>
    </div>
  `;
  
  showToast('Certificado gerado! 🎉', 'success');
}

function restartGame() {
  state.score = 0;
  state.stars = 0;
  state.currentChapter = 0;
  state.currentStep = 0;
  state.chapterStars = [0, 0, 0, 0, 0];
  state.chapterCompleted = [false, false, false, false, false];
  state.studentName = '';
  updateHUD();
  renderWelcome();
}

// ===================== INIT =====================
renderWelcome();
updateHUD();
</script>
</body>
</html>

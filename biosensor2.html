<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioSensor Quest 2.0 — Bioimpedance & Vital Signs Lab</title>
<style>
:root{--bg:#060b14;--panel:#0d1626;--panel2:#132038;--line:#22345c;--txt:#e9f1ff;--mut:#8aa2c9;
--teal:#2dd4bf;--cyan:#38bdf8;--mag:#e879f9;--lime:#a3e635;--red:#f87171;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);min-height:100vh;
background:radial-gradient(1000px 600px at 80% -10%,#123043 0%,var(--bg) 60%)}
button{font-family:inherit;cursor:pointer}
#hud{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
padding:10px 16px;background:rgba(6,11,20,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;background:linear-gradient(90deg,var(--teal),var(--cyan),var(--mag));
-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--mut)}
.chip b{color:var(--txt)}
.spacer{flex:1}
.langs{display:flex;gap:4px}
.langs button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.langs button.on{color:#031318;background:linear-gradient(90deg,var(--teal),var(--cyan));border-color:transparent}
.mini{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 9px;font-size:12px}
.mini:hover{color:var(--txt);border-color:var(--teal)}
main{max-width:1080px;margin:0 auto;padding:22px 16px 70px}
.screen{display:none}.screen.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1.title{font-size:clamp(26px,4.5vw,40px);font-weight:900;line-height:1.1;
background:linear-gradient(90deg,var(--teal),var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:8px 0 18px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:14.5px;transition:.2s}
.btn-p{background:linear-gradient(90deg,#0d9488,#0369a1);color:#fff}
.btn-p:hover{filter:brightness(1.25);transform:translateY(-1px)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn-g:hover{color:var(--txt);border-color:var(--teal)}
.field{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.field input{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
border-radius:12px;padding:13px 15px;font-size:15px;outline:none}
.field input:focus{border-color:var(--teal)}
.flags{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.flag{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;
padding:14px 20px;font-size:15px;font-weight:700}
.flag.on{border-color:var(--teal);box-shadow:0 0 0 2px rgba(45,212,191,.35)}
.hub-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:16px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;
flex-direction:column;gap:8px;transition:.2s}
.mod:hover{transform:translateY(-3px);border-color:var(--teal)}
.mod .ic{font-size:32px}
.mod .nm{font-weight:800;font-size:16.5px}
.mod .d{font-size:13px;color:var(--mut);line-height:1.45}
.mod .xp{font-size:12px;color:var(--gold)}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
.flip{perspective:900px;height:200px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;
border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:6px}
.face .ic{font-size:30px}
.face .t{font-weight:800;font-size:15px;color:var(--teal)}
.face.back{transform:rotateY(180deg);background:var(--panel2);font-size:13px;color:#c9d8f2;overflow:auto;line-height:1.5}
.flip-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:14px 0 22px}
.qnum{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.qtext{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.4}
.ops{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;
padding:12px 15px;font-size:14.5px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);transform:translateX(3px)}
.opt.ok{background:rgba(163,230,53,.15);border-color:var(--lime);color:var(--lime);font-weight:700}
.opt.bad{background:rgba(248,113,113,.12);border-color:var(--red);color:var(--red)}
.fb{min-height:26px;margin-top:14px;font-weight:700;font-size:14.5px}
.fb.ok{color:var(--lime)}.fb.bad{color:var(--red)}
.nx{margin-top:12px}
.lab-grid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.lab-grid{grid-template-columns:1fr}}
#bodySvg{width:100%;background:#0a1220;border:1px solid var(--line);border-radius:14px;touch-action:none}
.elec{cursor:grab;touch-action:none}
.sq{margin-top:8px;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.sq.good{color:var(--lime);border-color:var(--lime)}
.sq.mid{color:var(--gold);border-color:#7c6417}
.sq.bad{color:var(--red);border-color:#7c2d2d}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:560px){.ctr{grid-template-columns:1fr}}
.ctr label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.ctr label b{color:var(--txt)}
input[type=range]{width:100%;accent-color:var(--teal)}
select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 10px;font-size:13.5px;outline:none}
.h-title{font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700}
.ro-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:14px}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.ro .l{font-size:10.5px;color:var(--mut);line-height:1.3;min-height:26px}
.ro .v{font-size:19px;font-weight:800;margin-top:4px}
.ro .v small{font-size:11px;color:var(--mut)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.chart-grid{grid-template-columns:1fr}}
canvas.chart{width:100%;height:200px;background:#0a1220;border:1px solid var(--line);border-radius:12px;display:block}
.fi{font-size:12.5px;color:#c9d8f2;line-height:1.5;margin-top:8px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pre{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600}
.pre:hover{border-color:var(--cyan)}
.pre.on{border-color:var(--teal);color:var(--teal)}
.mi{list-style:none}
.mi li{font-size:13.5px;color:var(--mut);padding:6px 0;border-bottom:1px dashed var(--line)}
.mi li:last-child{border:none}
.mi li.done{color:var(--lime)}
.case-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.note{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#0a1220;border:1px solid var(--line);
border-radius:10px;padding:10px 12px;color:var(--cyan);margin:12px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#0d2b28;
border:1px solid var(--teal);color:#c8fff6;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
transition:.35s;z-index:99;opacity:0;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%);opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:98}
#confetti span{position:absolute;top:-40px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.15}}
.final-box{background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:40px 22px;text-align:center}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.bdg{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--gold)}
.bdg.off{opacity:.3;filter:grayscale(1);color:var(--mut)}
.disc{font-size:11px;color:var(--mut);margin-top:22px;text-align:center}
/* ---- vitals ---- */
.vgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.vgrid{grid-template-columns:1fr}}
.monwrap{position:relative;height:250px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#050b10}
.monwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.monlabel{position:absolute;font-size:10.5px;color:#8aa2c9;letter-spacing:1px}
.ecglbl{top:6px;left:8px;color:#a3e635}
.plbl{top:58%;left:8px;color:#38bdf8}
.bigs{display:flex;gap:12px;margin-top:10px}
.bigval{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.bigval span{font-size:26px;font-weight:900}
.bigval small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:1px;margin-top:2px}
.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.chk label{font-size:13px;color:var(--mut);cursor:pointer}
/* ---- ranking ---- */
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rk-table{width:100%;border-collapse:collapse}
.rk-table th,.rk-table td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:left}
.rk-table th{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.rk-table tr.me td{color:var(--lime);font-weight:700}
/* ---- relatório ---- */
#repOverlay{position:fixed;inset:0;display:none;overflow:auto;z-index:120;background:#dde4ef}
#repDoc{width:840px;max-width:96%;margin:20px auto;background:#fff;color:#1a2233;padding:30px 34px;border-radius:10px;font-size:13px;line-height:1.55}
#repDoc h1{font-size:20px;color:#0f766e;margin-bottom:4px}
#repDoc h3{font-size:14px;color:#0f766e;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px}
#repDoc table{width:100%;border-collapse:collapse;margin:8px 0}
#repDoc td,#repDoc th{border:1px solid #cbd5e1;padding:6px 9px;font-size:12px;text-align:left}
#repDoc th{background:#f1f5f9}
#repDoc img{width:100%;border:1px solid #cbd5e1;border-radius:6px;margin:6px 0}
#repDoc ul{margin:6px 0 6px 20px}
#repDoc li{margin:4px 0}
#repDoc .rmeta{color:#64748b;font-size:12px;margin-bottom:12px}
@media print{
 body *{visibility:hidden}
 #repOverlay,#repOverlay *{visibility:visible}
 #repOverlay{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff}
 #repDoc{margin:0;border-radius:0;width:100%;max-width:100%}
 .noprint{display:none!important}
}
</style>
</head>
<body>

<header id="hud">
  <span class="logo">🧬 BioSensor Quest 2.0</span>
  <span class="chip">👤 <b id="hName">—</b></span>
  <span class="chip">⭐ <b id="hXp">0/100</b></span>
  <span class="chip">🎖️ <b id="hRank">—</b></span>
  <span class="chip">🏅 <b id="hBdg">0</b>/11</span>
  <span class="spacer"></span>
  <span class="langs"><button data-l="pt">🇧🇷 PT</button><button data-l="en">🇺🇸 EN</button><button data-l="es">🇪🇸 ES</button></span>
  <button class="mini" id="bMap">🗺️</button>
  <button class="mini" id="bRank">🏆</button>
  <button class="mini" id="bReset">🔄</button>
</header>

<main>
  <!-- INTRO -->
  <section id="scr-intro" class="screen active">
    <h1 class="title" id="iTitle"></h1>
    <p class="sub" id="iTag"></p>
    <div class="card">
      <div class="h-title" id="iLangT"></div>
      <div class="flags" id="iFlags">
        <button class="flag" data-l="pt">🇧🇷 Português</button>
        <button class="flag" data-l="en">🇺🇸 English</button>
        <button class="flag" data-l="es">🇪🇸 Español</button>
      </div>
      <div class="h-title" id="iHowT"></div>
      <ul class="mi" id="iHow"></ul>
      <div class="field">
        <input id="iName" maxlength="22">
        <button class="btn btn-p" id="iStart">▶</button>
      </div>
    </div>
  </section>

  <!-- HUB -->
  <section id="scr-hub" class="screen">
    <h1 class="title" id="hubT" style="font-size:26px"></h1>
    <p class="sub" id="hubSub"></p>
    <div class="bar" style="max-width:420px"><i id="hubBar" style="width:0%"></i></div>
    <div class="grid hub-grid" id="hubCards"></div>
    <div id="hubExtra" style="margin-top:16px"></div>
  </section>

  <!-- ACADEMIA -->
  <section id="scr-acad" class="screen">
    <div class="case-head"><h1 class="title" id="acT" style="font-size:24px"></h1><button class="btn btn-g" id="acBack"></button></div>
    <p class="sub" id="acSub"></p>
    <div class="grid flip-grid" id="acCards"></div>
    <div class="card" id="acQuizBox"></div>
  </section>

  <!-- LAB -->
  <section id="scr-lab" class="screen">
    <div class="case-head"><h1 class="title" id="lbT" style="font-size:24px"></h1><button class="btn btn-g" id="lbBack"></button></div>
    <p class="sub" id="lbSub"></p>
    <div class="lab-grid">
      <div class="card">
        <div class="h-title" id="lbBodyT"></div>
        <svg id="bodySvg" viewBox="0 0 300 520"></svg>
        <div class="sq" id="sqChip">—</div>
      </div>
      <div class="card">
        <div class="h-title" id="lbCtrlT"></div>
        <div class="ctr" id="lbCtrls"></div>
        <div class="fi" id="lbFi" style="margin-top:14px"></div>
        <div class="h-title" style="margin-top:16px" id="lbPreT"></div>
        <div class="presets" id="lbPresets"></div>
        <button class="btn btn-p" id="lbReport"></button>
      </div>
    </div>
    <div class="grid ro-grid" id="lbRos"></div>
    <div class="chart-grid">
      <div class="card"><div class="h-title" id="chNyT"></div><canvas id="cvNyq" class="chart"></canvas></div>
      <div class="card"><div class="h-title" id="chBoT"></div><canvas id="cvBode" class="chart"></canvas></div>
      <div class="card">
        <div class="h-title" id="chCellT"></div>
        <svg viewBox="0 0 260 120" style="width:100%;background:#0a1220;border:1px solid var(--line);border-radius:12px">
          <circle cx="130" cy="60" r="38" fill="rgba(45,212,191,.06)" stroke="#2dd4bf" stroke-width="3"/>
          <circle cx="130" cy="60" r="33" fill="none" stroke="#2dd4bf" stroke-width="1" opacity=".5"/>
          <circle cx="130" cy="60" r="10" fill="#132038" stroke="#38bdf8"/>
          <path id="cellAround" d="M15,60 Q130,-25 245,60" fill="none" stroke="#e879f9" stroke-width="3" stroke-dasharray="6 6"/>
          <path id="cellThrough" d="M15,60 L245,60" fill="none" stroke="#a3e635" stroke-width="3" stroke-dasharray="6 6"/>
          <text id="cellLbl" x="130" y="112" text-anchor="middle" fill="#8aa2c9" font-size="11"></text>
        </svg>
        <canvas id="cvGauge" class="chart" style="height:70px;margin-top:8px"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="h-title" id="lbMiT"></div>
      <ul class="mi" id="lbMis"></ul>
    </div>
  </section>

  <!-- VITAIS -->
  <section id="scr-vitals" class="screen">
    <div class="case-head"><h1 class="title" id="vtT" style="font-size:24px"></h1><button class="btn btn-g" id="vtBack"></button></div>
    <p class="sub" id="vtSub"></p>
    <div class="vgrid">
      <div class="card">
        <div class="h-title" id="vtMonT"></div>
        <div class="monwrap">
          <canvas id="cvGrid"></canvas>
          <canvas id="cvTrace"></canvas>
          <div class="monlabel ecglbl" id="lblEcg">ECG · II</div>
          <div class="monlabel plbl" id="lblPleth">PLETH</div>
        </div>
        <div class="bigs">
          <div class="bigval"><span id="vHR">--</span><small id="lHR"></small></div>
          <div class="bigval"><span id="vSpo">--</span><small id="lSpo"></small></div>
          <div class="bigval"><span id="vPi">--</span><small id="lPi"></small></div>
        </div>
      </div>
      <div class="card">
        <div class="h-title" id="vtCtrlT"></div>
        <div class="ctr" id="vtCtrls"></div>
        <div class="h-title" style="margin-top:16px" id="vtPreT"></div>
        <div class="presets" id="vtPresets"></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="card"><div class="h-title" id="vtHbT"></div><canvas id="cvHb" class="chart"></canvas><p class="fi" id="vtHbNote"></p></div>
      <div class="card"><div class="h-title" id="vtDiagT"></div><ul class="mi" id="vtDiag"></ul></div>
      <div class="card">
        <div class="h-title" id="vtMiT"></div>
        <ul class="mi" id="vtMis"></ul>
        <div id="vtQuizBox" style="margin-top:12px"></div>
      </div>
    </div>
  </section>

  <!-- CASOS -->
  <section id="scr-cases" class="screen">
    <div class="case-head"><h1 class="title" id="csT" style="font-size:24px"></h1><button class="btn btn-g" id="csBack"></button></div>
    <div class="card" id="csBox"></div>
  </section>

  <!-- BOSS -->
  <section id="scr-boss" class="screen">
    <div class="case-head"><h1 class="title" id="bsT" style="font-size:24px"></h1><button class="btn btn-g" id="bsBack"></button></div>
    <div class="card" id="bsBox"></div>
  </section>

  <!-- RANKING -->
  <section id="scr-rank" class="screen">
    <div class="case-head"><h1 class="title" id="rkT" style="font-size:24px"></h1><button class="btn btn-g" id="rkBack"></button></div>
    <p class="sub" id="rkSub"></p>
    <div class="card">
      <table class="rk-table">
        <thead><tr id="rkHead"></tr></thead>
        <tbody id="rkBody"></tbody>
      </table>
      <div class="btnrow">
        <button class="btn btn-p" id="rkReg"></button>
        <button class="btn btn-g" id="rkExp"></button>
        <button class="btn btn-g" id="rkImp"></button>
        <button class="btn btn-g" id="rkClr"></button>
        <input type="file" id="rkFile" accept=".json" hidden>
      </div>
    </div>
  </section>

  <!-- FINAL -->
  <section id="scr-final" class="screen">
    <div class="final-box">
      <div style="font-size:54px">🏅</div>
      <h2 id="fnT" style="font-size:24px;margin:8px 0"></h2>
      <div id="fnRank" style="font-size:clamp(22px,4vw,34px);font-weight:900;color:var(--gold);margin:6px 0"></div>
      <div id="fnXp" style="color:var(--cyan);font-weight:800"></div>
      <div class="badge-row" id="fnBdgs"></div>
      <p id="fnMsg" style="color:var(--mut);max-width:520px;margin:0 auto 22px;line-height:1.5"></p>
      <div class="btnrow" style="justify-content:center">
        <button class="btn btn-p" id="fnAgain"></button>
        <button class="btn btn-g" id="fnReg"></button>
        <button class="btn btn-g" id="fnMap"></button>
      </div>
    </div>
  </section>
  <p class="disc" id="disc"></p>
</main>

<div id="repOverlay"><div id="repDoc"></div></div>
<div id="toast"></div>
<div id="confetti"></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtF=f=>f>=1e6?(f/1e6).toFixed(2)+' MHz':(f/1e3).toFixed(1)+' kHz';

/* ================= TRADUÇÕES ================= */
const I18N={

/* ================= MODELO BIA ================= */
function model(){
 const p=lab.p,tf=1-(p.temp-36.5)*0.018;
 const R0=560*Math.pow(p.h/170,2)*(70/p.w)*(1+(0.5-p.hyd/100)*1.2)*(1+(0.45-p.mus/100)*0.5)
  *(1+(p.fat/100-0.25)*1.6)*(1-p.edm/100*0.35)*tf;
 const ratio=0.62+p.edm/100*0.18,Rinf=R0*ratio,fc=45000*(1-p.edm/100*0.3);
 return{R0,Rinf,ratio,tau:1/(2*Math.PI*fc),alpha:0.66+p.mus/100*0.18,
  xcK:(0.75+p.mus/100*0.9)*(1-p.fat/100*0.35)*(1-p.edm/100*0.35)};
}
function zAt(f,m){
 const w=Math.pow(f*m.tau,m.alpha),c=Math.cos(m.alpha*Math.PI/2),s=Math.sin(m.alpha*Math.PI/2);
 const den=(1+w*c)**2+(w*s)**2,d=m.R0-m.Rinf;
 return{R:m.Rinf+d*(1+w*c)/den,X:d*w*s/den*m.xcK};
}

/* ================= GRÁFICOS (tema duplo) ================= */
function renderNyq(x,W,H,light){
 const m=lab.m;if(!m)return;
 const C=light?{ax:'#94a3b8',tx:'#334155',cv:'#7c3aed',dt:'#b45309'}:{ax:'#22345c',tx:'#8aa2c9',cv:'#e879f9',dt:'#fbbf24'};
 x.clearRect(0,0,W,H);const pad=30;
 const xMax=m.R0*1.03,yMax=Math.max(15,(m.R0-m.Rinf)*0.32*m.xcK+8);
 const X=r=>pad+(r/xMax)*(W-pad-8),Y=v=>H-pad-(v/yMax)*(H-pad-10);
 x.strokeStyle=C.ax;x.beginPath();x.moveTo(pad,10);x.lineTo(pad,H-pad);x.lineTo(W-8,H-pad);x.stroke();
 x.fillStyle=C.tx;x.font='10px sans-serif';
 x.fillText(T.lab.axR0,X(m.R0)-26,H-pad+14);x.fillText(T.lab.axRinf,X(m.Rinf)-24,H-pad+14);
 x.fillText('Xc (Ω)',pad+4,14);
 x.strokeStyle=C.cv;x.lineWidth=2;x.beginPath();
 for(let k=0;k<=80;k++){const f=1000*Math.pow(10,3*k/80),z=zAt(f,m);
  k?x.lineTo(X(z.R),Y(z.X)):x.moveTo(X(z.R),Y(z.X));}
 x.stroke();x.lineWidth=1;
 const z=zAt(lab.f,m);x.fillStyle=C.dt;x.beginPath();x.arc(X(z.R),Y(z.X),5,0,7);x.fill();
}
function renderBode(x,W,H,light){
 const m=lab.m;if(!m)return;
 const C=light?{ax:'#94a3b8',tx:'#334155',cv:'#0369a1',dt:'#b45309'}:{ax:'#22345c',tx:'#8aa2c9',cv:'#38bdf8',dt:'#fbbf24'};
 x.clearRect(0,0,W,H);const pad=30,zMax=m.R0*1.05;
 const X=f=>pad+(Math.log10(f)-3)/3*(W-pad-8),Y=v=>H-pad-(v/zMax)*(H-pad-10);
 x.strokeStyle=C.ax;x.beginPath();x.moveTo(pad,10);x.lineTo(pad,H-pad);x.lineTo(W-8,H-pad);x.stroke();
 x.fillStyle=C.tx;x.font='10px sans-serif';
 [[1e3,'1k'],[1e4,'10k'],[1e5,'100k'],[1e6,'1M']].forEach(p=>x.fillText(p[1],X(p[0])-6,H-pad+14));
 x.fillText('|Z| (Ω)',pad+4,14);
 x.strokeStyle=C.cv;x.lineWidth=2;x.beginPath();
 for(let k=0;k<=80;k++){const f=1000*Math.pow(10,3*k/80),z=zAt(f,m);
  k?x.lineTo(X(f),Y(Math.hypot(z.R,z.X))):x.moveTo(X(f),Y(Math.hypot(z.R,z.X)));}
 x.stroke();x.lineWidth=1;
 const z=zAt(lab.f,m);
 x.fillStyle=C.dt;x.beginPath();x.arc(X(lab.f),Y(Math.hypot(z.R,z.X)),5,0,7);x.fill();
 x.strokeStyle='rgba(180,83,9,.45)';x.setLineDash([3,4]);x.beginPath();
 x.moveTo(X(lab.f),H-pad);x.lineTo(X(lab.f),Y(Math.hypot(z.R,z.X)));x.stroke();x.setLineDash([]);
}
function renderGauge(x,W,H,light,phi){
 x.clearRect(0,0,W,H);
 const cx=W/2,cy=H-6,r=Math.min(W/2-14,H-18);
 const a=v=>Math.PI+(clamp(v,0,15)/15)*Math.PI;
 const z=(v1,v2,c)=>{x.strokeStyle=c;x.lineWidth=8;x.beginPath();x.arc(cx,cy,r,a(v1)+.02,a(v2)-.02);x.stroke();};
 z(0,4,light?'#dc2626':'#7c2d2d');z(4,7,light?'#d97706':'#7c6417');z(7,15,light?'#16a34a':'#14532d');
 x.strokeStyle=light?'#111':'#e9f1ff';x.lineWidth=3;
 const av=a(phi);x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(av)*r*.9,cy+Math.sin(av)*r*.9);x.stroke();
 x.fillStyle=light?'#111':'#e9f1ff';x.font='bold 12px sans-serif';x.textAlign='center';
 x.fillText('φ '+phi.toFixed(1)+'°',cx,cy-4);x.textAlign='left';
}
function paintLabCharts(){

  const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;

 paint('#cvNyq',renderNyq);paint('#cvBode',renderBode);
 paint('#cvGauge',(x,W,H,l)=>renderGauge(x,W,H,l,lab.last?lab.last.phi:5));
}

function updateSim(checkMissions=true){
 lab.m=model();const m=lab.m;
 const z=zAt(lab.f,m),R=Math.hypot(z.R,z.X),phi=Math.atan2(z.X,z.R)*180/Math.PI;
 const R50=zAt(5e4,m).R;
 let tbw=clamp(0.655*(lab.p.h*lab.p.h)/R50,0.35*lab.p.w,0.68*lab.p.w);
 let ffm=clamp(tbw/0.732,lab.p.w*0.35,lab.p.w*0.92);
 const fatPct=Math.max(0,(lab.p.w-ffm)/lab.p.w*100);

/* ================= VITAIS — ECG ENGINE ================= */
const G=(u,c,w)=>Math.exp(-((u-c)*(u-c))/(2*w*w));
function ecgWave(u,tt){
 let v=0;const af=vit.rhythm==='afib';
 if(!af)v+=0.13*G(u,0.12,0.028);
 v+=-0.14*G(u,0.235,0.010)+1.0*G(u,0.253,0.011)-0.26*G(u,0.272,0.012);
 if(vit.st)v+=0.20*(1/(1+Math.exp(-(u-0.30)*60))-1/(1+Math.exp(-(u-0.42)*60)));
 v+=(vit.st?0.42:0.28)*G(u,0.40,0.05);
 if(af)v+=0.035*Math.sin(2*Math.PI*6.2*tt)+0.02*Math.sin(2*Math.PI*9.3*tt+1);
 return v;
}
function plethWave(u){
 const rise=u<0.18?u/0.18:Math.exp(-(u-0.18)*3.2);
 return Math.max(0,rise+0.25*G(u,0.42,0.06));
}
let lastTs=0;
function vitalLoop(ts){
 if(!vit.running)return;
 requestAnimationFrame(vitalLoop);
 if(!lastTs)lastTs=ts;
 const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;
 vit.t+=dt;
 if(vit.t>=vit.nextBeat){
  const base=60/vit.hr;
  let rr=base*(vit.rhythm==='afib'?0.55+Math.random()*0.95:0.97+Math.random()*0.06);
  if(vit.rhythm==='afib'&&Math.random()<.1)rr*=0.5;
  vit.lastRR=rr;vit.lastBeat=vit.nextBeat;vit.nextBeat=vit.lastBeat+rr;
  if(vit.nextBeat<vit.t){vit.lastBeat=vit.t;vit.nextBeat=vit.t+rr;}
  vit.dispHR=Math.round(60/rr);
  vit.dispSpo2=clamp(Math.round(vit.spo2+(Math.random()*2-1)),60,100);
  updateBigs();updateVitDiag();checkVitMissions();
 }
 drawTrace(dt);
}
function drawTrace(dt){
 const cv=$('#cvTrace');if(!cv)return;
 const ctx=cv.getContext('2d'),W=cv.clientWidth,H=cv.clientHeight;
 const adv=vit.pxs*dt,nx=(vit.sweepX+adv)%W;
 ctx.clearRect(nx,0,26,H);
 const seg=x=>{
  const dist=x>=vit.sweepX?x-vit.sweepX:W-vit.sweepX+x;
  const tt=vit.t-(adv-dist)/vit.pxs;
  const u=clamp((tt-vit.lastBeat)/vit.lastRR,-0.05,1.05);
  let v=ecgWave(u,tt);
  if(vit.noise)v+=(Math.random()-.5)*.07+.04*Math.sin(2*Math.PI*0.35*tt);
  let p=plethWave(clamp(u,0,1))*vit.perf;
  if(vit.noise)p*=1+(Math.random()-.5)*.3;
  return[H*0.30-v*H*0.16,H*0.80-Math.max(0,p)*H*0.14];
 };
 const sweep=(a,b)=>{
  ctx.lineWidth=2;
  ctx.strokeStyle='#a3e635';ctx.beginPath();
  let px=null,py=null;
  for(let x=a;x<=b;x+=2){const[y1]= [seg(x)[0]];const s2=seg(x);
   if(px!==null){ctx.moveTo(px,py);ctx.lineTo(x,s2[0]);}px=x;py=s2[0];}
  ctx.stroke();
  ctx.strokeStyle='#38bdf8';ctx.beginPath();px=null;py=null;
  for(let x=a;x<=b;x+=2){const s2=seg(x);
   if(px!==null){ctx.moveTo(px,py);ctx.lineTo(x,s2[1]);}px=x;py=s2[1];}
  ctx.stroke();
 };
 if(nx>=vit.sweepX)sweep(vit.sweepX,nx);else{sweep(vit.sweepX,W);sweep(0,nx);}
 vit.sweepX=nx;
}
function sizeMon(){
 const wrap=$('.monwrap');if(!wrap)return;
 const W=wrap.clientWidth,H=wrap.clientHeight,d=devicePixelRatio||1;
 [$('#cvGrid'),$('#cvTrace')].forEach(c=>{c.width=W*d;c.height=H*d;
  c.style.width=W+'px';c.style.height=H+'px';
  c.getContext('2d').setTransform(d,0,0,d,0,0);});
 const x=$('#cvGrid').getContext('2d');x.clearRect(0,0,W,H);
 x.strokeStyle='rgba(51,110,110,.16)';x.lineWidth=1;x.beginPath();
 for(let i=0;i<W;i+=20){x.moveTo(i+.5,0);x.lineTo(i+.5,H);}
 for(let j=0;j<H;j+=20){x.moveTo(0,j+.5);x.lineTo(W,j+.5);}
 x.stroke();x.strokeStyle='rgba(51,190,190,.28)';x.beginPath();
 for(let i=0;i<W;i+=100){x.moveTo(i+.5,0);x.lineTo(i+.5,H);}
 for(let j=0;j<H;j+=100){x.moveTo(0,j+.5);x.lineTo(W,j+.5);}
 x.stroke();

}
function mkSlider(box,label,min,max,step,val,cb){
 const w=el('div');w.innerHTML='<label>'+label+': <b></b></label>';
 const b=w.querySelector('b');b.textContent=step<1?val.toFixed(2):val;
 const r=el('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;
 r.oninput=()=>{b.textContent=step<1?(+r.value).toFixed(2):r.value;cb(+r.value);};
 w.appendChild(r);box.appendChild(w);return{r,b};
}
function drawHb(){
 const cv=$('#cvHb');if(!cv)return;
 const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.scale(d,d);
 x.clearRect(0,0,W,H);
 const P50=26.6,n=2.7,pad=30;
 const so2=p=>100/(1+Math.pow(P50/p,n));
 const X=p=>pad+(p/100)*(W-pad-10),Y=s=>H-pad-(s/100)*(H-pad-14);
 x.strokeStyle='#22345c';x.beginPath();x.moveTo(pad,8);x.lineTo(pad,H-pad);x.lineTo(W-8,H-pad);x.stroke();
 // linha 90%
 x.strokeStyle='rgba(163,230,53,.35)';x.setLineDash([3,4]);x.beginPath();
 x.moveTo(pad,Y(90));x.lineTo(W-8,Y(90));x.stroke();x.setLineDash([]);
 x.strokeStyle='#e879f9';x.lineWidth=2.5;x.beginPath();
 for(let k=0;k<=100;k++){k?x.lineTo(X(k),Y(so2(k))):x.moveTo(X(k),Y(so2(k)));}
 x.stroke();x.lineWidth=1;
 const p50x=X(P50),p50y=Y(50);
 x.strokeStyle='rgba(251,191,36,.5)';x.setLineDash([3,4]);x.beginPath();
 x.moveTo(p50x,H-pad);x.lineTo(p50x,p50y);x.lineTo(pad,p50y);x.stroke();x.setLineDash([]);
 const sP=clamp(vit.spo2,50,99.5);
 const pO2=P50/Math.pow(100/sP-1,1/n);
 x.fillStyle='#fbbf24';x.beginPath();x.arc(X(clamp(pO2,0,100)),Y(sP),5,0,7);x.fill();
 x.fillStyle='#8aa2c9';x.font='10px sans-serif';
 x.fillText('SaO₂ (%)',pad+2,14);x.fillText('pO₂ (mmHg)',W-78,H-pad+12);
 x.fillText('90%',pad+2,Y(90)-4);x.fillText('P50',p50x+4,p50y-4);
}

   const nm=String(e.name).slice(0,24),xp=+e.xp||0;
   const i=cur.findIndex(x=>x.name.toLowerCase()===nm.toLowerCase());
   if(i<0)cur.push({name:nm,xp,rank:e.rank||'',date:e.date||''});
   else if(xp>cur[i].xp)cur[i]={...cur[i],xp,rank:e.rank||cur[i].rank,date:e.date||cur[i].date};});
  saveRankList(cur);toast(T.rank.impOk.replace('{n}',arr.length));rRank();
 }catch(err){toast(T.rank.fileErr);}};
 rd.readAsText(f);ev.target.value='';
}
function rRank(){
 $('#rkT').textContent=T.rank.t;$('#rkSub').textContent=T.rank.sub;
 $('#rkBack').textContent=T.ui.back;$('#rkBack').onclick=()=>showScreen('hub');
 $('#rkReg').textContent=T.rank.reg;$('#rkExp').textContent=T.rank.exp;
 $('#rkImp').textContent=T.rank.imp;$('#rkClr').textContent=T.rank.clr;
 $('#rkHead').innerHTML=T.rank.th.map(h=>'<th>'+h+'</th>').join('');
 const list=getRankList().sort((a,b)=>b.xp-a.xp);
 $('#rkBody').innerHTML=list.length?list.map((e,i)=>
  '<tr class="'+(e.name.toLowerCase()===S.name.toLowerCase()?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(e.name)+
  '</td><td>'+e.xp+'</td><td>'+esc(e.rank||'')+'</td><td>'+esc(e.date||'')+'</td></tr>').join('')
 :'<tr><td colspan="5" style="color:var(--mut)">'+T.rank.empty+'</td></tr>';
}

/* ================= FINAL ================= */
function rFinal(){
 $('#fnT').textContent=T.ui.finT;
 $('#fnRank').textContent=T.ui.ranks[rankIdx()];
 $('#fnXp').textContent='⭐ '+S.xp+' / '+MAXXP+' XP';
 const names=['acad','m1','m2','m3','m4','v1','v2','v3','v4','cases','boss'];
 $('#fnBdgs').innerHTML=names.map(n=>'<span class="bdg'+(S.badges[n]?'':' off')+'">'+T.ui.badges[n]+'</span>').join('');
 $('#fnMsg').textContent=T.ui.finMsg[rankIdx()];
 $('#fnAgain').textContent='🔁 '+T.ui.finAgain;
 $('#fnReg').textContent=T.rank.reg;
 $('#fnMap').textContent='🗺️ '+T.ui.finMap;
 confetti();
}

/* ================= HUD / INIT ================= */
 $('#bMap').onclick=()=>showScreen(S.name?'hub':'intro');
 $('#bRank').onclick=()=>showScreen(S.name?'rank':'intro');
 $('#bReset').onclick=()=>{
 if(!confirm('🔄 '+T.ui.finAgain+'?'))return;
 const lang=S.lang,name=S.name;
 S=defS(lang);S.name=name;S.screen='hub';save();
 toast(T.ui.reset);showScreen('hub');};
 $$('.langs button').forEach(b=>b.onclick=()=>{
 S.lang=b.dataset.l;T=I18N[S.lang];save();
 if(vit.running)vit.running=false;
 showScreen(S.screen==='intro'?'intro':S.screen);});
 $('#rkReg').onclick=()=>{rankRegister();rRank();};
 $('#rkExp').onclick=exportRank;
 $('#rkImp').onclick=()=>$('#rkFile').click();
 $('#rkFile').onchange=importRank;
 $('#rkClr').onclick=()=>{if(confirm(T.rank.clrC)){saveRankList([]);rRank();toast(T.rank.clrOk);}};
 $('#fnAgain').onclick=()=>$('#bReset').onclick();
 $('#fnReg').onclick=()=>{rankRegister();showScreen('rank');};
 $('#fnMap').onclick=()=>showScreen('hub');

(function init(){
 const sv=load();
 if(sv&&sv.name){S=Object.assign(defS(sv.lang||'pt'),sv);
  if(!S.p)S.p={...PRESETS[0]};}
 T=I18N[S.lang]||I18N.pt;
 $('#disc').textContent=T.ui.disc;
 renderHUD();
 showScreen(S.name?(S.screen&&S.screen!=='intro'?S.screen:'hub'):'intro');
})();
</script>
</body>

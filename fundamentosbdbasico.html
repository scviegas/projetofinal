{num:5,tab:"SQL Consultas",title:"SQL Básico 2 — SELECT, Agregações e GROUP BY",week:"Semana 5",
goals:["Praticar consultas com SELECT, WHERE, LIKE, BETWEEN, IN, ORDER BY","Usar funções de agregação: COUNT, SUM, AVG, MAX, MIN","Agrupar resultados com GROUP BY e filtrar grupos com HAVING"],
summary:["<code>SELECT colunas FROM tabela WHERE condição ORDER BY coluna ASC|DESC LIMIT n;</code>",
"Operadores: <code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>&gt;</code>, <code>BETWEEN a AND b</code>, <code>IN (lista)</code>, <code>LIKE</code>, <code>AND/OR</code>.",
"<code>LIKE 'S%'</code> = começa com S • <code>'%a'</code> = termina com a • <code>'_a%'</code> = segunda letra 'a'.",
"<code>DISTINCT</code> elimina duplicatas.",
"<b>Agregações</b>: <code>COUNT(*)</code> (conta linhas), <code>SUM</code> (soma), <code>AVG</code> (média), <code>MAX</code>/<code>MIN</code> (maior/menor).",
"<b>GROUP BY</b>: agrupa linhas com o mesmo valor para agregar por grupo (ex.: clientes por cidade).",
"<b>HAVING</b>: filtra GRUPOS depois do GROUP BY (WHERE filtra linhas antes)."],

activities:[
{type:"sql",q:"Selecione TODAS as colunas de todos os clientes.",ph:"SELECT ...;",
must:[{re:/select\s+\*/i,label:"SELECT * (todas as colunas)"},{re:/from\s+clientes/i,label:"FROM clientes"}],
hint:"O asterisco (*) representa todas as colunas.",
ok:"5 rows in set (0.00 sec)",table:T_CLIENTES,sol:"SELECT * FROM clientes;"},
{type:"sql",q:"Selecione apenas <code>nome</code> e <code>email</code> dos clientes que moram em <code>São Paulo</code>.",
ph:"SELECT ... WHERE ...;",
must:[{re:/select/i,label:"Usa SELECT"},{re:/nome/i,label:"Coluna nome"},{re:/email/i,label:"Coluna email"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/where/i,label:"Filtro WHERE"},{re:/cidade\s*=\s*['\"]s[aã]o\s*paulo['\"]/i,label:"cidade = 'São Paulo'"}],
hint:"Strings usam aspas simples: WHERE cidade = 'São Paulo'",

sol:"SELECT nome, email FROM clientes WHERE cidade = 'São Paulo';"},
{type:"sql",q:"Selecione <code>nome</code> e <code>idade</code> dos clientes com idade <b>maior que 30</b>, ordenados da idade mais alta para a mais baixa.",
ph:"SELECT ... ORDER BY ...;",
must:[{re:/select/i,label:"Usa SELECT"},{re:/nome/i,label:"Coluna nome"},{re:/idade/i,label:"Coluna idade"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/where/i,label:"Filtro WHERE"},{re:/idade\s*>\s*30/i,label:"idade > 30"},{re:/order\s+by/i,label:"ORDER BY"},{re:/desc/i,label:"Ordenação DESC"}],

{type:"sql",q:"Liste todos os produtos com preço <b>menor que 200</b>.",ph:"SELECT ...;",

{type:"sql",q:"Selecione <code>nome</code> e <code>idade</code> dos clientes com idade ENTRE 25 e 35 (use BETWEEN).",

must:[{re:/select/i,label:"Usa SELECT"},{re:/nome/i,label:"Coluna nome"},{re:/idade/i,label:"Coluna idade"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/between\s+25\s+and\s+35/i,label:"BETWEEN 25 AND 35"}],

ok:"2 rows in set (0.00 sec)",table:{cols:["nome","idade"],rows:[["Ana Souza",29],["Bruno Lima",34]]},

{type:"sql",q:"Selecione os nomes dos clientes cujo <code>id_cliente</code> está na lista (1, 3) usando <b>IN</b>.",
ph:"SELECT ... IN ...;",
must:[{re:/select/i,label:"Usa SELECT"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/in\s*\(\s*1\s*,\s*3\s*\)/i,label:"IN (1, 3)"}],

ok:"2 rows in set (0.00 sec)",table:{cols:["nome"],rows:[["Ana Souza"],["Carla Dias"]]},

{type:"sql",q:"Conte quantos pedidos existem na tabela <code>pedidos</code> (use COUNT).",ph:"SELECT ...;",
must:[{re:/select/i,label:"Usa SELECT"},{re:/count\s*\(/i,label:"Função COUNT"},{re:/from\s+pedidos/i,label:"FROM pedidos"}],
hint:"SELECT COUNT(*) FROM ...",
ok:"1 row in set (0.00 sec)",table:{cols:["COUNT(*)"],rows:[[5]]},
sol:"SELECT COUNT(*) FROM pedidos;"},
{type:"sql",q:"Conte quantos clientes são da cidade de <b>São Paulo</b> (COUNT + WHERE).",ph:"SELECT ...;",
must:[{re:/count\s*\(/i,label:"Função COUNT"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/where/i,label:"Filtro WHERE"},{re:/s[aã]o\s*paulo/i,label:"Filtro cidade = 'São Paulo'"}],
hint:"SELECT COUNT(*) FROM clientes WHERE ...",
ok:"1 row in set (0.00 sec)",table:{cols:["COUNT(*)"],rows:[[2]]},
sol:"SELECT COUNT(*) FROM clientes WHERE cidade = 'São Paulo';"},
{type:"sql",q:"Calcule a <b>soma total</b> das quantidades vendidas na tabela <code>pedidos</code> (use SUM).",ph:"SELECT ...;",
must:[{re:/sum\s*\(/i,label:"Função SUM"},{re:/quantidade/i,label:"Coluna quantidade"},{re:/from\s+pedidos/i,label:"FROM pedidos"}],
hint:"SELECT SUM(quantidade) FROM ...",
ok:"1 row in set (0.00 sec)",table:{cols:["SUM(quantidade)"],rows:[[9]]},

{type:"sql",q:"Mostre o <b>maior</b> e o <b>menor</b> preço dos produtos (use MAX e MIN).",ph:"SELECT ...;",
must:[{re:/max\s*\(/i,label:"Função MAX"},{re:/min\s*\(/i,label:"Função MIN"},{re:/preco/i,label:"Coluna preco"},{re:/from\s+produtos/i,label:"FROM produtos"}],
hint:"SELECT MAX(preco), MIN(preco) FROM ...",
ok:"1 row in set (0.00 sec)",table:{cols:["MAX(preco)","MIN(preco)"],rows:[["890.00","120.00"]]},

{type:"sql",q:"📊 <b>GROUP BY</b> — conte quantos clientes existem em <b>cada cidade</b>.",ph:"SELECT ... GROUP BY ...;",
must:[{re:/select/i,label:"Usa SELECT"},{re:/count\s*\(/i,label:"Função COUNT"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/group\s+by/i,label:"GROUP BY"},{re:/cidade/i,label:"Agrupando por cidade"}],

{num:6,tab:"Álgebra + DML",title:"Álgebra Relacional e Atualização/Exclusão (UPDATE, DELETE)",week:"Semana 6",
goals:["Relacionar operações da álgebra relacional ao SQL","Praticar consultas de atualização e exclusão","Evitar comandos perigosos sem WHERE"],
summary:["<b>σ (seleção)</b>: filtra <b>linhas</b> → cláusula <code>WHERE</code>.",
"<b>π (projeção)</b>: escolhe <b>colunas</b> → lista após o <code>SELECT</code>.",
"<b>⋈ (junção)</b>: combina tabelas → <code>JOIN ... ON</code>. Também existem ∪ (união), ∩ (interseção), − (diferença), × (produto cartesiano) e ρ (renomeação).",
"<code>UPDATE tabela SET coluna = valor WHERE condição;</code>",
"<code>DELETE FROM tabela WHERE condição;</code>",
"⚠️ <b>UPDATE ou DELETE sem WHERE</b> afeta TODAS as linhas da tabela!"],
schema:[["clientes",T_CLIENTES],["produtos",T_PRODUTOS],["pedidos",T_PEDIDOS]],
activities:[
{type:"quiz",q:"A operação σ (sigma) da álgebra relacional...",options:["Seleciona colunas","Seleciona LINHAS (tuplas) que atendem a uma condição","Junta duas tabelas","Ordena os dados"],answer:1,explain:"σ condição (Relação) equivale ao WHERE do SQL."},
{type:"quiz",q:"A operação π (pi) da álgebra relacional...",options:["Seleciona COLUNAS (atributos) da relação","Filtra linhas","Remove duplicatas do disco","Cria índices"],answer:0,explain:"π nome, cidade (CLIENTES) equivale a SELECT nome, cidade FROM clientes."},
{type:"quiz",q:"O operador ⋈ representa...",options:["União","Diferença","Junção (combine relações por um atributo comum)","Renomeação"],answer:2,explain:"Junção natural equivale ao INNER JOIN ... ON do SQL."},
{type:"quiz",q:"σ cidade = 'São Paulo' (CLIENTES) corresponde a qual cláusula SQL?",options:["SELECT","FROM","WHERE","ORDER BY"],answer:2,explain:"A seleção (σ) vira o filtro WHERE."},
{type:"sql",q:"Traduza para SQL: <code>π nome, cidade (σ idade &gt; 30 (CLIENTES))</code>",
ph:"SELECT ...;",
must:[{re:/select/i,label:"Usa SELECT (projeção π)"},{re:/nome/i,label:"Coluna nome"},{re:/cidade/i,label:"Coluna cidade"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/where/i,label:"WHERE (seleção σ)"},{re:/idade\s*>\s*30/i,label:"idade > 30"}],
hint:"π vira a lista de colunas; σ vira o WHERE.",
ok:"3 rows in set (0.00 sec)",table:{cols:["nome","cidade"],rows:[["Bruno Lima","Rio de Janeiro"],["Carla Dias","São Paulo"],["Elisa Rocha","Curitiba"]]},
sol:"SELECT nome, cidade FROM clientes WHERE idade > 30;"},
{type:"sql",q:"O monitor (id_produto = 3) entrou em promoção. Atualize o <code>preco</code> dele para <code>199.90</code>.",
ph:"UPDATE ...;",
must:[{re:/update\s+produtos/i,label:"UPDATE produtos"},{re:/set\s+preco/i,label:"SET preco"},{re:/199\s*[.,]\s*90/i,label:"Novo preço 199.90"},{re:/where/i,label:"WHERE (linha específica)"},{re:/id_produto\s*=\s*3/i,label:"id_produto = 3"}],
hint:"UPDATE tabela SET coluna = valor WHERE ...",
ok:"Query OK, 1 row affected (0.01 sec)\nRows matched: 1  Changed: 1",
sol:"UPDATE produtos SET preco = 199.90 WHERE id_produto = 3;"},
{type:"sql",q:"O pedido 5 foi cancelado. Remova-o da tabela <code>pedidos</code>.",ph:"DELETE ...;",
must:[{re:/delete\s+from\s+pedidos/i,label:"DELETE FROM pedidos"},{re:/where/i,label:"WHERE (linha específica)"},{re:/id_pedido\s*=\s*5/i,label:"id_pedido = 5"}],
hint:"DELETE FROM tabela WHERE condição;",
ok:"Query OK, 1 row affected (0.01 sec)",sol:"DELETE FROM pedidos WHERE id_pedido = 5;"},
{type:"quiz",q:"O que acontece ao executar UPDATE produtos SET preco = 0; SEM WHERE?",options:["Nada, o MySQL bloqueia","Todos os produtos terão preço 0","Apenas o primeiro produto é alterado","O comando dá erro de sintaxe"],answer:1,explain:"Sem WHERE, o UPDATE afeta todas as linhas — cuidado redobrado!"}]},

{num:7,tab:"NoSQL",title:"Bancos de Dados NoSQL (MongoDB) — CRUD",week:"Semana 7",
goals:["Classificar os tipos de bancos NoSQL","Executar operações CRUD no MongoDB","Comparar NoSQL x Relacional"],
summary:["NoSQL surgiu para grandes volumes, alta escala e <b>schema flexível</b>. Tipos: <b>Documento</b> (MongoDB), <b>Chave-valor</b> (Redis), <b>Colunas</b> (Cassandra), <b>Grafo</b> (Neo4j).",
"MongoDB guarda <b>documentos BSON/JSON</b> dentro de <b>coleções</b>; cada documento tem um <code>_id</code> padrão.",
"CRUD Mongo: <code>insertOne()</code> • <code>find()</code> • <code>updateOne({filtro}, {$set:{...}})</code> • <code>deleteOne({filtro})</code>.",
"<b>Relacional</b>: schema rígido, JOINs, ACID, escala vertical. <b>NoSQL</b>: schema flexível, escala horizontal, consistência eventual."],
activities:[
{type:"quiz",q:"O MongoDB é um banco NoSQL orientado a...",options:["Grafos","Documentos (JSON/BSON)","Colunas largas","Chave-valor"],answer:1,explain:"Dados ficam em documentos JSON dentro de coleções."},
{type:"quiz",q:"O Redis é um banco NoSQL do tipo...",options:["Documento","Grafo","Chave-valor (extremamente rápido)","Colunas"],answer:2,explain:"Redis guarda pares chave→valor em memória (cache, sessões)."},
{type:"quiz",q:"Qual banco NoSQL é baseado em GRAFOS (nós e arestas)?",options:["Neo4j","MongoDB","Cassandra","MySQL"],answer:0,explain:"Neo4j é ideal para relacionamentos complexos: redes sociais, recomendações."},
{type:"quiz",q:"Em MongoDB, todo documento recebe por padrão um identificador chamado...",options:["id","_id","pk","uid"],answer:1,explain:"_id é gerado automaticamente (ObjectId) se não for informado."},
{type:"quiz",q:"Uma vantagem típica dos bancos NoSQL sobre os relacionais é...",options:["Schema rígido e fixo","Schema flexível e escalabilidade horizontal","JOINs mais rápidos","Garantia ACID em tudo"],answer:1,explain:"Documentos da mesma coleção podem ter estruturas diferentes."},
{type:"match",q:"Ligue cada comando SQL ao seu equivalente no MongoDB:",pairs:[{l:"INSERT INTO clientes VALUES (...)",r:"db.clientes.insertOne({...})"},{l:"SELECT * FROM clientes",r:"db.clientes.find()"},{l:"UPDATE clientes SET ... WHERE ...",r:"db.clientes.updateOne({...}, {$set:{...}})"},{l:"DELETE FROM clientes WHERE ...",r:"db.clientes.deleteOne({...})"}],explain:"CRUD: Create→insertOne, Read→find, Update→updateOne, Delete→deleteOne."},
{type:"sql",q:"Complete o comando MongoDB que busca clientes da cidade 'São Paulo':<br><code>db.clientes.__________({ cidade: 'São Paulo' })</code>",
ph:"db.clientes....( ... );",
must:[{re:/find\s*\(/i,label:"Método find()"}],
hint:"O 'SELECT' do MongoDB chama-se find.",
ok:"MongoDB Shell result:\n{ _id: ObjectId('a1'), nome: 'Ana Souza', cidade: 'São Paulo' }\n{ _id: ObjectId('a3'), nome: 'Carla Dias', cidade: 'São Paulo' }",
sol:"db.clientes.find({ cidade: 'São Paulo' })"},
{type:"quiz",q:"Qual comando MongoDB atualiza UM documento existente?",options:["find()","updateOne({filtro}, {$set:{...}})","insertOne()","drop()"],answer:1,explain:"updateMany atualizaria todos que casarem com o filtro."}]},

/* ================= ESTADO ================= */
const XP_PER_ACT=10;
let done={};
try{done=JSON.parse(lsGet('bdSimDone','{}'))}catch(e){done={}}
let examBest=parseInt(lsGet('bdSimExam','-1'),10);
if(isNaN(examBest))examBest=-1;
let current=0;
let examState=null, examTimer=null;

function save(){lsSet('bdSimDone',JSON.stringify(done))}
function resetAll(){if(confirm('Apagar todo o progresso?')){lsSet('bdSimDone','');lsSet('bdSimExam','');try{localStorage.removeItem('bdSimDone');localStorage.removeItem('bdSimExam')}catch(e){}location.reload();}}
function totalActs(){return MODULES.reduce(function(a,m){return a+m.activities.length},0)}
function countDone(){return Object.keys(done).length}
function isDone(k){return !!done[k]}
function award(k,card){
  if(!done[k]){
    done[k]=1; save();
    if(card) card.classList.add('done');
    updateScore();
    renderTabs();
    showNextStep(k);
  }
}
function showNextStep(key){
  var parts=key.split('-'), mi=parseInt(parts[0],10), ai=parseInt(parts[1],10);
  var card=document.getElementById('c-'+key); if(!card)return;
  var old=document.getElementById('next-'+key); if(old)old.remove();
  var box=document.createElement('div'); box.id='next-'+key; box.className='btnrow';
  if(ai < MODULES[mi].activities.length-1){
    box.innerHTML='<button class="btn primary" onclick="nextActivity('+mi+','+(ai+1)+')">Próxima atividade →</button>';
  } else if(mi < MODULES.length-1){
    box.innerHTML='<button class="btn primary" onclick="go('+(mi+1)+')">Próxima etapa: '+MODULES[mi+1].tab+' →</button>';
  } else {
    box.innerHTML='<button class="btn danger" onclick="goExam()">Ir para a Prova Final →</button>';
  }
  card.appendChild(box);
}
function nextActivity(mi,ai){
  var el=document.getElementById('c-'+mi+'-'+ai);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}

function updateScore(){
  var t=totalActs(),d=countDone(),xp=d*XP_PER_ACT;
  var st=document.getElementById('scoreTxt');
  if(st)st.textContent=d+"/"+t+" atividades • "+xp+" XP";
  var bar=document.getElementById('bar');
  if(bar)bar.style.width=(t?d/t*100:0)+"%";
}

/* ================= HELPERS ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tblHTML(t){
  if(!t)return"";
  return '<table class="rt"><tr>'+t.cols.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr>"+
    t.rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+esc(c)+"</td>"}).join("")+"</tr>"}).join("")+"</table>";
}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=b[i];b[i]=b[j];b[j]=tmp}return b}

/* ================= NAVEGAÇÃO ================= */
function modDoneCount(i){var n=0;Object.keys(done).forEach(function(k){if(k.indexOf(i+"-")===0)n++});return n}
function renderTabs(){
  var nav=document.getElementById('tabs');if(!nav)return;
  var h="";
  MODULES.forEach(function(m,i){
    h+='<button class="tab'+(i===current?' active':'')+'" onclick="go('+i+')">'+m.tab+(modDoneCount(i)===m.activities.length?' ✔':'')+'</button>';
  });
  h+='<button class="tab exam'+(current==="exam"?' active':'')+'" onclick="goExam()">🏁 Prova Final</button>';
  nav.innerHTML=h;
}
function go(i){current=i;renderTabs();render()}
function goExam(){current="exam";renderTabs();render()}

function render(){
  var c=document.getElementById('content');if(!c)return;
  if(current==="exam"){c.innerHTML=renderExam();if(examState&&!examState.finished)paintTimer();return}
  c.innerHTML=renderModule(current);
}

/* ================= MÓDULOS ================= */
function renderModule(i){
  var m=MODULES[i];if(!m)return"";
  var h='<section class="module"><h2>Módulo '+m.num+' — '+m.title+'</h2><div class="week">'+m.week+'</div>';
  h+='<div class="summary"><b>🎯 Objetivos</b><ul>'+m.goals.map(function(g){return "<li>"+g+"</li>"}).join("")+'</ul></div>';
  h+='<div class="summary"><b>📌 Resumo</b><ul>'+m.summary.map(function(s){return "<li>"+s+"</li>"}).join("")+'</ul></div>';
  if(m.schema){h+='<div class="schema"><h4>📋 Tabelas de exemplo</h4>'+m.schema.map(function(p){return "<h4>"+esc(p[0])+"</h4>"+tblHTML(p[1])}).join("")+"</div>"}
  m.activities.forEach(function(a,j){h+=renderActivity(i,j,a)});
  return h+"</section>";
}

function renderActivity(mi,ai,a){
  var key=mi+"-"+ai, dn=isDone(key);
  var tag=a.type==="sql"?"Editor SQL":(a.type==="match"?"Ligar colunas":"Quiz");
  var cls=a.type==="sql"?" sql":(a.type==="match"?" match":"");
  var h='<div class="card'+(dn?' done':'')+'" id="c-'+key+'"><div class="qhead">';
  h+='<span class="tag'+cls+'">'+tag+'</span>';
  h+='<span class="pts">'+(dn?"✔ Concluída • ":"")+XP_PER_ACT+' XP</span></div>';
  h+='<div class="q">'+a.q+'</div>';

  if(a.type==="quiz"){
    a.options.forEach(function(o,oi){
      h+='<button class="opt" id="o-'+key+'-'+oi+'" onclick="pick(\''+key+'\','+oi+')">'+String.fromCharCode(65+oi)+') '+o+'</button>';
    });
    h+='<div class="fb" id="fb-'+key+'"></div>';
  }
  else if(a.type==="sql"){
    h+='<textarea class="sql" id="ta-'+key+'" placeholder="'+esc(a.ph||"")+'" spellcheck="false"></textarea>';
    h+='<div class="btnrow"><button class="btn primary" onclick="runSQL(\''+key+'\')">▶ Executar</button><button class="btn" onclick="showSol(\''+key+'\')">💡 Ver solução</button></div>';
    h+='<div class="fb" id="fb-'+key+'"></div><div id="out-'+key+'"></div>';
    h+='<details id="det-'+key+'" style="display:none"><summary>📖 Solução</summary><pre>'+esc(a.sol||"")+'</pre></details>';
  }
  else if(a.type==="match"){
    var rights=shuffle(a.pairs.map(function(p,ri){return {txt:p.r,ri:ri}}));
    a.pairs.forEach(function(p,li){
      h+='<div class="pair"><div>'+p.l+'</div><select class="m" id="sel-'+key+'-'+li+'"><option value="">— escolha —</option>';
      rights.forEach(function(r){h+='<option value="'+r.ri+'">'+esc(r.txt)+'</option>'});
      h+='</select></div>';
    });
    h+='<div class="btnrow"><button class="btn primary" onclick="checkMatch(\''+key+'\')">✔ Verificar</button></div>';
    h+='<div class="fb" id="fb-'+key+'"></div>';
  }
  return h+"</div>";
}

/* ===== QUIZ ===== */
function pick(key,oi){
  if(isDone(key))return;
  var parts=key.split("-");
  var mi=parseInt(parts[0],10),ai=parseInt(parts[1],10);
  var a=MODULES[mi].activities[ai];
  a.options.forEach(function(_,i){
    var b=document.getElementById('o-'+key+'-'+i);
    if(b)b.classList.remove('sel','ok','bad');
  });
  var fb=document.getElementById('fb-'+key);
  if(oi===a.answer){
    var bok=document.getElementById('o-'+key+'-'+oi);
    if(bok){bok.classList.remove('sel');bok.classList.add('ok');}
    a.options.forEach(function(_,i){var b=document.getElementById('o-'+key+'-'+i);if(b)b.disabled=true});
    fb.innerHTML='<span class="check">✔ Correto!</span><ul><li>'+a.explain+'</li></ul>';
    award(key,document.getElementById('c-'+key));
  }else{
    var bbad=document.getElementById('o-'+key+'-'+oi);
    if(bbad){bbad.classList.remove('sel');bbad.classList.add('bad');}
    fb.innerHTML='<span class="cross">✖ Não é essa. Tente novamente!</span>';
  }
}

/* ===== SQL ===== */
function runSQL(key){
  var parts=key.split("-");
  var mi=parseInt(parts[0],10),ai=parseInt(parts[1],10);
  var a=MODULES[mi].activities[ai];
  var ta=document.getElementById('ta-'+key);
  var fb=document.getElementById('fb-'+key),out=document.getElementById('out-'+key);
  var card=document.getElementById('c-'+key);
  var val=ta?ta.value:"";
  if(out)out.innerHTML="";
  if(card)card.classList.remove('exOk','exBad');
  if(!val.trim()){fb.innerHTML='<span class="cross">✖ Escreva o comando antes de executar.</span>';return}
  var allOk=true,rows="";
  a.must.forEach(function(m){
    var ok=m.re.test(val);
    if(!ok)allOk=false;
    rows+='<li><span class="'+(ok?'check':'cross')+'">'+(ok?'✔':'✖')+'</span> '+m.label+'</li>';
  });
  fb.innerHTML=(allOk?'<b class="check">✔ Comando correto!</b>':'<b class="cross">✖ Ainda faltam requisitos:</b>')+'<ul>'+rows+'</ul>';
  if(allOk){
    if(card)card.classList.add('exOk');
    out.innerHTML='<div class="console">'+esc(a.ok||"Query OK")+'</div>'+(a.table?tblHTML(a.table):"");
    award(key,card);
  }else{
    if(card)card.classList.add('exBad');
  }
}
function showSol(key){
  var det=document.getElementById('det-'+key);
  if(det){det.style.display="block";det.open=true;}
}

/* ===== MATCH ===== */
function checkMatch(key){
  var parts=key.split("-");
  var mi=parseInt(parts[0],10),ai=parseInt(parts[1],10);
  var a=MODULES[mi].activities[ai];
  var allOk=true;
  a.pairs.forEach(function(p,li){
    var sel=document.getElementById('sel-'+key+'-'+li);
    if(!sel){allOk=false;return}
    var ok=sel.value!==""&&parseInt(sel.value,10)===li;
    if(!ok)allOk=false;
    sel.style.borderColor=ok?"#34d399":(sel.value===""?"#22304d":"#f87171");
  });
  var fb=document.getElementById('fb-'+key);
  if(allOk){
    fb.innerHTML='<b class="check">✔ Todos os pares corretos!</b><ul><li>'+a.explain+'</li></ul>';
    award(key,document.getElementById('c-'+key));
  }else{
    fb.innerHTML='<span class="cross">✖ Alguns pares estão errados. Ajuste e verifique de novo.</span>';
  }
}

    h+='<div class="card"><div class="qhead"><span class="tag">Q'+(qi+1)+'</span><span class="pts">1 pt</span></div><div class="q">'+q.q+'</div>';
    q.options.forEach(function(o,oi){
      h+='<button class="opt'+(examState.answers[qi]===oi?' sel':'')+'" id="eq-'+qi+'-'+oi+'" onclick="chooseExam('+qi+','+oi+')">'+String.fromCharCode(65+oi)+') '+o+'</button>';
    });
    h+="</div>";
  });
  return h;
}

function startExam(){
  examState={answers:[],left:EXAM_TIME,finished:false,result:null};
  for(var i=0;i<EXAM_QS.length;i++)examState.answers.push(null);
  if(examTimer)clearInterval(examTimer);
  examTimer=setInterval(tickExam,1000);
  render();
}
function tickExam(){
  if(!examState||examState.finished)return;
  examState.left--;
  if(examState.left<=0){finishExam(true);return}
  paintTimer();
}
function paintTimer(){
  var el=document.getElementById('timer'),bar=document.getElementById('tbarfill');
  if(!el||!examState)return;
  var t=Math.max(0,examState.left);
  var mm=String(Math.floor(t/60)),ss=String(t%60);
  if(mm.length<2)mm="0"+mm;if(ss.length<2)ss="0"+ss;
  el.textContent=mm+":"+ss;
  el.className="timer"+(t<=60?" danger":(t<=180?" warn":""));
  if(bar)bar.style.width=(t/EXAM_TIME*100)+"%";
}
function chooseExam(qi,oi){
  if(!examState||examState.finished)return;
  examState.answers[qi]=oi;
  for(var i=0;i<EXAM_QS[qi].options.length;i++){
    var b=document.getElementById('eq-'+qi+'-'+i);
    if(b)b.classList.toggle('sel',i===oi);
  }
}
function finishExam(auto){
  if(!examState||examState.finished)return;
  if(!auto&&!confirm("Finalizar a prova agora?"))return;
  if(examTimer)clearInterval(examTimer);
  var score=0;
  EXAM_QS.forEach(function(q,i){if(examState.answers[i]===q.answer)score++});
  var pct=Math.round(score/EXAM_QS.length*100);
  var letter,msg;
  if(pct>=90){letter="A";msg="Excelente! Você domina Banco de Dados! 🏆"}
  else if(pct>=75){letter="B";msg="Muito bom! Revise os poucos pontos que faltaram."}
  else if(pct>=60){letter="C";msg="Bom resultado! Reforce os tópicos que errou."}
  else if(pct>=40){letter="D";msg="Estude os módulos novamente e tente outra vez."}
  else{letter="F";msg="Reveja o material com calma e refaça a prova. Você consegue! 💪"}
  if(score>examBest){examBest=score;lsSet('bdSimExam',String(score))}
  examState.finished=true;
  examState.result={score:score,pct:pct,letter:letter,msg:msg};
  render();
}
function retakeExam(){examState=null;render()}

/* ================= INICIALIZAÇÃO ================= */
renderTabs();
updateScore();
render();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operação Sentinela — Firewall & Serviços · Packet Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d09; --panel:#12150e; --panel2:#171b12; --inset:#0d100a;
  --line:#282e1f; --line2:#3a4230;
  --ink:#ece9db; --dim:#a8ad97; --faint:#6d7460;
  --acc:#ffb454; --acc2:#ff8a3d;
  --netA:#ffb454; --netB:#5fd4d0; --netF:#57d97a;
  --ok:#57d97a; --bad:#ff6b5e; --warn:#ffd166;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Chakra Petch',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:14px; line-height:1.55;
  background-image:
    linear-gradient(rgba(255,180,84,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,180,84,.025) 1px, transparent 1px);
  background-size:34px 34px;
  overflow:hidden;
}
::selection{background:var(--acc);color:#141005}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c331f;border:2px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.brief code,.hint code,.steps code{background:var(--inset);border:1px solid var(--line);padding:1px 6px;font-size:11.5px;color:var(--netB)}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column}
#bootInner{width:min(680px,92vw)}
#bootLines{font-size:14px;color:var(--dim);min-height:230px;white-space:pre-wrap}
#bootLines .bl{display:block;opacity:0;animation:blin .25s forwards}
@keyframes blin{to{opacity:1}}
#bootLines .em{color:var(--acc)} #bootLines .gd{color:var(--ok)}
#bootTitle{font-family:var(--disp);font-weight:700;font-size:clamp(30px,5vw,52px);letter-spacing:.04em;color:var(--ink);margin:6px 0 2px}
#bootTitle span{color:var(--acc)}
#bootSub{color:var(--faint);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:26px}
#bootForm{display:none;gap:12px;align-items:stretch;flex-wrap:wrap}
#bootForm.on{display:flex}
#techName{flex:1;min-width:240px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:15px;padding:13px 14px;outline:none}
#techName:focus{border-color:var(--acc)}
.btn-acc{background:var(--acc);color:#171004;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.08em;padding:13px 22px;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-acc:hover{background:var(--acc2)}
#bootSkip{margin-top:26px;color:var(--faint);font-size:12px;text-decoration:underline dotted}
#bootSkip:hover{color:var(--dim)}

/* ============ APP GRID ============ */
#app{display:grid;grid-template-columns:252px minmax(0,1fr) 392px;grid-template-rows:56px minmax(0,1fr);height:100vh;gap:1px;background:var(--line);opacity:0;transition:opacity .5s}
#app.on{opacity:1}
header,nav,main,#rightCol{background:var(--bg)}

#topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.05em}
.brand b::before{content:"";display:inline-block;width:10px;height:10px;background:var(--acc);margin-right:9px;vertical-align:0}
.brand small{color:var(--faint);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#hudName{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#hudName b{color:var(--ink)}
#hudRank{font-size:11px;color:var(--acc);border:1px solid var(--line2);padding:2px 8px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
.xpwrap{display:flex;align-items:center;gap:8px;min-width:130px}
.xpbar{flex:1;height:6px;background:var(--inset);border:1px solid var(--line2)}
.xpbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .6s}
#xpTxt{font-size:11px;color:var(--dim);white-space:nowrap}
#hudClock{font-size:13px;color:var(--ink);letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.tbtns{margin-left:auto;display:flex;gap:6px}
.tbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--dim)}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}

nav{overflow-y:auto;padding:14px 10px 30px}
.navprog{height:4px;background:var(--inset);border:1px solid var(--line2);margin:2px 4px 16px}
.navprog i{display:block;height:100%;background:var(--acc);transition:width .6s}
.ph{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.mnav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-left:2px solid var(--line);color:var(--dim);font-size:12.5px;margin-bottom:2px}
.mnav .num{font-size:10px;color:var(--faint);width:32px;flex:none;letter-spacing:.05em}
.mnav .ti{flex:1;min-width:0}
.mnav .ti b{display:block;font-weight:500;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav .ti small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.mnav .st{color:var(--faint)}
.mnav:hover{border-color:var(--line2);color:var(--ink)}
.mnav.active{background:var(--panel2);border-color:var(--line2);border-left-color:var(--acc);color:var(--ink)}
.mnav.done .st{color:var(--ok)} .mnav.done .num{color:var(--ok)}
.mnav.locked{opacity:.42;cursor:not-allowed}

main{overflow-y:auto;padding:26px 34px 60px;scroll-behavior:smooth}
.mwrap{max-width:760px}
.m-head{display:flex;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.m-code{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--acc);letter-spacing:.04em;line-height:1;border:1px solid var(--line2);padding:10px 12px 8px;background:var(--panel)}
.m-tt{flex:1;min-width:0}
.m-tt h2{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.02em}
.m-sub{color:var(--faint);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.m-xp{font-family:var(--disp);font-weight:600;color:var(--ok);border:1px solid var(--line2);padding:8px 12px;font-size:14px;white-space:nowrap}
.done-badge{display:inline-flex;gap:7px;align-items:center;color:var(--ok);border:1px solid var(--ok);padding:7px 12px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.1em}

.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.brief{background:var(--panel);border:1px solid var(--line);padding:16px 18px;color:var(--dim)}
.brief p+p{margin-top:9px}
.brief b,.steps b{color:var(--ink)}
.steps{counter-reset:st;list-style:none}
.steps li{counter-increment:st;position:relative;padding:9px 0 9px 44px;color:var(--dim);border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(st,decimal-leading-zero);position:absolute;left:0;top:10px;font-family:var(--disp);font-weight:700;color:var(--acc);font-size:15px}
.steps .cli pre{white-space:pre}
.hint{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:13px 15px;color:var(--dim);font-size:13px}
.hint .ic{color:var(--acc);margin-top:2px}
.hint b{color:var(--ink)}
.hint.red{border-left-color:var(--bad)} .hint.red .ic{color:var(--bad)}

.iptab{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.iptab th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2)}
.iptab td{padding:7px 10px;border-bottom:1px dashed var(--line);color:var(--dim)}
.iptab td:first-child{color:var(--ink);font-weight:500}
.iptab td.num{color:var(--netA)}
.iptab tr.hr td{color:var(--netB)}

.cli{background:var(--inset);border:1px solid var(--line2);margin:10px 0}
.cli-h{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.cli-h span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.copy{font-size:10px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);padding:3px 9px;display:flex;gap:5px;align-items:center;text-transform:uppercase}
.copy:hover{color:var(--acc);border-color:var(--acc)}
.cli pre{padding:13px 15px;font-size:12.5px;line-height:1.65;color:#d8dcc8;overflow-x:auto;white-space:pre}

.q{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.q-q{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink)}
.q-q::before{content:"? ";color:var(--acc);font-weight:600}
.opts{padding:10px;display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--panel2);padding:9px 13px;color:var(--dim);font-size:13px;display:flex;gap:10px;align-items:center;transition:border-color .15s}
.opt::before{content:"";width:8px;height:8px;border:1px solid var(--faint);flex:none}
.opt:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.opt:disabled{cursor:default;opacity:.55}
.opt.ok{border-color:var(--ok);color:var(--ok);opacity:1}
.opt.ok::before{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad);animation:shake .4s}
.opt.bad::before{background:var(--bad);border-color:var(--bad)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.q-ex{display:none;padding:11px 16px;border-top:1px solid var(--line);color:var(--ok);font-size:12.5px;background:var(--panel2)}
.q.solved .q-ex{display:block}

.pair{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.pair:last-child{border-bottom:none}
.pair .term{width:110px;font-family:var(--disp);font-weight:600;color:var(--netB);font-size:14px}
.pair select{flex:1;min-width:220px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:8px 10px;outline:none}
.pair select:focus{border-color:var(--acc)}
.pair.right select{border-color:var(--ok)}

.tsk{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);background:var(--panel);margin-bottom:7px;text-align:left;color:var(--dim);font-size:13px;width:100%}
.tsk:hover{border-color:var(--line2)}
.tsk .bx{width:18px;height:18px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent}
.tsk.on{color:var(--ink)} .tsk.on .bx{background:var(--ok);border-color:var(--ok);color:#0c1409}

.valbar{display:flex;gap:14px;align-items:center;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
#valBtn{display:flex;gap:10px;align-items:center;background:var(--acc);color:#171004;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;padding:14px 26px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#valBtn:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
#valHint{color:var(--faint);font-size:12px}
textarea#diagText{width:100%;min-height:90px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:13px;padding:12px;outline:none;resize:vertical}
textarea#diagText:focus{border-color:var(--acc)}

/* simulador */
.sim{border:1px solid var(--line2);background:var(--panel)}
.sim-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
.sim-top .sab{color:var(--warn);font-size:12.5px;display:flex;gap:8px;align-items:center}
.sim-top button{margin-left:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:5px 10px;display:flex;gap:6px;align-items:center}
.sim-top button:hover{color:var(--acc);border-color:var(--acc)}
.sim-grid{display:grid;grid-template-columns:218px minmax(0,1fr);gap:1px;background:var(--line2)}
.sim-l{background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.sim-l label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sim-l select,.sim-l input{background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:8px;outline:none}
.sim-l input:focus,.sim-l select:focus{border-color:var(--acc)}
.scmd{text-align:left;border:1px solid var(--line2);background:var(--inset);padding:8px 10px;color:var(--dim);font-size:12px}
.scmd:hover{border-color:var(--acc);color:var(--acc)}
.sim-c{background:#080a06;min-height:250px;max-height:290px;overflow-y:auto;padding:12px 14px;font-size:12.5px;line-height:1.6}
.sim-c .ln{white-space:pre-wrap;word-break:break-word}
.sim-c .cmd{color:var(--acc)} .sim-c .ok{color:var(--ok)} .sim-c .err{color:var(--bad)} .sim-c .wrn{color:var(--warn)} .sim-c .dim{color:var(--faint)}
.sim-acc{padding:14px;border-top:1px solid var(--line2)}
.sim-acc h5{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bad);margin-bottom:10px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px;margin-bottom:12px}
.acc-opt{border:1px solid var(--line2);background:var(--panel2);padding:9px 11px;text-align:left;color:var(--dim);font-size:12.5px;display:flex;gap:9px;align-items:center}
.acc-opt::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--faint);flex:none}
.acc-opt:hover{border-color:var(--bad)}
.acc-opt.sel{border-color:var(--bad);color:var(--ink)} .acc-opt.sel::before{background:var(--bad);border-color:var(--bad)}
.acc-opt.wrong{border-color:var(--bad);color:var(--bad);animation:shake .4s}
#closeCase{display:flex;gap:8px;align-items:center;border:1px solid var(--bad);color:var(--bad);font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:10px 18px}
#closeCase:hover{background:var(--bad);color:#160806}
.verdict{border:1px solid var(--ok);background:var(--panel2);padding:16px}
.verdict h5{color:var(--ok);font-family:var(--disp);font-size:16px;letter-spacing:.06em;display:flex;gap:9px;align-items:center;margin-bottom:8px}
.verdict p{color:var(--dim);font-size:13px}
.verdict .rk{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);color:var(--warn);font-size:12.5px}
.verdict .rk b{color:var(--ink)}

/* coluna direita */
#rightCol{display:flex;flex-direction:column;min-height:0}
#topoWrap{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
#topoWrap::before,#topoWrap::after,#rightCol .corner::before,#rightCol .corner::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--acc);border-style:solid}
#topoWrap::before{top:6px;left:6px;border-width:1px 0 0 1px}
#topoWrap::after{top:6px;right:6px;border-width:1px 1px 0 0}
#rightCol .corner::before{bottom:6px;left:6px;border-width:0 0 1px 1px}
#rightCol .corner::after{bottom:6px;right:6px;border-width:0 1px 1px 0}
.panel-t{display:flex;gap:8px;align-items:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.panel-t .ic{color:var(--acc)}
#topoSvg{width:100%;display:block;background:var(--inset);border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--faint);letter-spacing:.05em}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
#logWrap{flex:1;min-height:110px;display:flex;flex-direction:column;padding:12px 16px 14px;position:relative}
#logList{flex:1;overflow-y:auto;font-size:11.5px;line-height:1.7;color:var(--dim)}
#logList .t{color:var(--faint);margin-right:8px}
#logList .g{color:var(--ok)} #logList .a{color:var(--acc)} #logList .r{color:var(--bad)}

/* topo svg */
.dev{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.dev.show{opacity:1;transform:none}
.tlink{stroke:#3a4230;stroke-width:1.6;fill:none;transition:stroke .5s}
.tlink.up{stroke-width:2;opacity:.8}
.tlink.netA{stroke:var(--netA)} .tlink.netB{stroke:var(--netB)} .tlink.netF{stroke:var(--netF)}
.tlink.tr{stroke-dasharray:5 5;animation:dashmove 1.2s linear infinite;stroke:var(--ink)}
@keyframes dashmove{to{stroke-dashoffset:-20}}
.dlbl{font-family:var(--mono);font-size:10.5px;fill:var(--ink)}
.dip{font-family:var(--mono);font-size:8.5px}
.led{animation:ledpulse 1.6s infinite}
@keyframes ledpulse{50%{opacity:.25}}

/* stamp */
#stamp{position:fixed;inset:0;display:none;place-items:center;z-index:120;pointer-events:none}
#stamp.on{display:grid}
#stampIn{font-family:var(--disp);font-weight:700;font-size:clamp(28px,4vw,46px);letter-spacing:.14em;color:var(--ok);border:4px solid var(--ok);padding:16px 34px;transform:rotate(-7deg) scale(2.6);opacity:0;background:rgba(11,13,9,.85);animation:stampin .55s cubic-bezier(.2,1.6,.4,1) forwards;text-transform:uppercase}
@keyframes stampin{to{transform:rotate(-7deg) scale(1);opacity:1}}

/* toast */
#toastHost{position:fixed;top:66px;right:16px;z-index:150;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:11px 14px;font-size:12.5px;color:var(--ink);max-width:330px;animation:tin .3s}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--bad)}
.toast .ic{margin-top:1px;color:var(--acc)} .toast.ok .ic{color:var(--ok)} .toast.err .ic{color:var(--bad)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.toast.out{transition:.3s;opacity:0;transform:translateX(30px)}

/* modal */
#modalHost{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;background:rgba(5,6,4,.78)}
#modalHost.on{display:flex}
.modal{width:min(720px,92vw);max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);padding:24px 26px}
.modal h3{font-family:var(--disp);font-size:19px;letter-spacing:.05em;color:var(--acc);display:flex;gap:10px;align-items:center;margin-bottom:14px}
.modal h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:18px 0 8px}
.modal p,.modal li{color:var(--dim);font-size:13px}
.modal ul{padding-left:18px} .modal li{margin:4px 0}
.modal b{color:var(--ink)}
.modal .mclose{margin-top:20px;border:1px solid var(--line2);color:var(--dim);padding:9px 18px;font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.modal .mclose:hover{border-color:var(--acc);color:var(--acc)}
.modal table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.modal td{padding:6px 8px;border-bottom:1px dashed var(--line);color:var(--dim)}
.modal td:first-child{color:var(--ink);white-space:nowrap}

/* certificado */
#certWrap{position:fixed;inset:0;z-index:190;display:none;align-items:center;justify-content:center;background:rgba(5,6,4,.9);overflow-y:auto;padding:30px 14px}
#certWrap.on{display:flex}
.cert{width:min(760px,94vw);background:var(--panel);border:1px solid var(--acc);position:relative;padding:6px}
.cert-in{border:1px dashed var(--line2);padding:44px 46px;text-align:center}
.cert .top{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.cert h1{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:.1em;margin:14px 0 4px;color:var(--acc)}
.cert .rl{color:var(--dim);font-size:13px;max-width:520px;margin:10px auto 0}
.cert .nm{font-family:var(--disp);font-weight:700;font-size:26px;margin:22px 0 2px;border-bottom:1px solid var(--line2);display:inline-block;padding:0 26px 8px}
.cert .meta{display:flex;justify-content:center;gap:34px;margin:26px 0;flex-wrap:wrap}
.cert .meta div{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em}
.cert .meta b{display:block;font-family:var(--disp);font-size:16px;color:var(--ink);letter-spacing:.05em;margin-top:3px}
.cert .sign{display:flex;justify-content:space-between;margin-top:40px;color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.cert .sign span{border-top:1px solid var(--line2);padding-top:8px;width:200px}
.certbtns{display:flex;gap:10px;justify-content:center;margin-top:18px}
@media print{
  body>*:not(#certWrap){display:none!important}
  body{overflow:visible;background:#fff}
  #certWrap{display:flex!important;position:static;background:#fff;padding:0}
  .cert{border-color:#000} .cert-in{border-color:#999}
  .certbtns{display:none}
}
@media (max-width:1240px){#app{grid-template-columns:220px minmax(0,1fr) 330px}}
@media (max-width:1000px){
  body{overflow:auto}

  .ph,.navprog{display:none}
  .mnav{width:auto;white-space:nowrap;border:1px solid var(--line)}
  main{overflow:visible}
  #rightCol{flex:none}

}

<script>
/* ============================================================
   OPERAÇÃO SENTINELA — jogo-guia: 5 PCs · 2 roteadores · ASA ·
   servidores Web/DNS/FTP/E-mail no Packet Tracer
   ============================================================ */
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;

/* ---------- estado ---------- */
const DEF={name:'',xp:0,done:[],cur:'m1',qs:{},tk:{},pr:{},diag:'',
  sim:{sc:null,cmds:0,acc:null,solved:false,bonus:false,hist:[]},t0:null,tEnd:null,muted:false};
let save;
try{save=Object.assign({},DEF,JSON.parse(localStorage.getItem('sentinela-save')||'{}'));}catch(e){save=Object.assign({},DEF);}
save.sim=Object.assign({},DEF.sim,save.sim||{});
if(!Array.isArray(save.sim.hist))save.sim.hist=[];
const persist=()=>localStorage.setItem('sentinela-save',JSON.stringify(save));

/* ---------- áudio ---------- */
let AC=null;
function tone(f,d,type='square',v=.05,delay=0){
  if(save.muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const snd={
  click:()=>tone(660,.05,'square',.03),
  type:()=>tone(1100+Math.random()*300,.02,'square',.012),
  ok:()=>{tone(740,.09);tone(1108,.14,'square',.05,.09);},
  err:()=>tone(160,.22,'sawtooth',.06),
  done:()=>{tone(660,.1);tone(880,.1,'square',.05,.1);tone(1320,.2,'square',.05,.2);},
  stamp:()=>tone(140,.18,'sawtooth',.08)
};

/* ---------- log / toast / tempo ---------- */
function logAdd(msg,cls=''){
  const box=$('#logList');const t=fmtTime(Date.now()-(save.t0||Date.now()));
  const d=document.createElement('div');
  d.innerHTML=`<span class="t">[${t}]</span><span class="${cls}">${esc(msg)}</span>`;
  box.appendChild(d);
  while(box.children.length>60)box.removeChild(box.firstChild);
  box.scrollTop=box.scrollHeight;
}
function toast(msg,type=''){
  const d=document.createElement('div');d.className='toast '+type;
  d.innerHTML=`${ic(type==='err'?'alert':type==='ok'?'check':'zap')}<span>${msg}</span>`;
  $('#toastHost').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),350);},3800);
}
function fmtTime(ms){
  const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,'0');
  return h?`${p(h)}:${p(m)}:${p(ss)}`:`${p(m)}:${p(ss)}`;
}
const RANKS=[[0,'Estagiário'],[250,'Técnico Aprendiz'],[500,'Técnico Júnior'],[750,'Técnico Pleno'],[1150,'Analista de Redes'],[1700,'Especialista em Perímetro'],[2370,'Arquiteto de Redes']];
const rankFor=n=>{let r=RANKS[0][1];for(const[k,v]of RANKS)if(n>=k)r=v;return r;};

/* ============================================================
   MISSÕES
   ============================================================ */
const PHASES={
  p1:'Fase I · Cablagem',p2:'Fase II · Endereçamento',p3:'Fase III · Roteadores',
  p4:'Fase IV · Firewall',p5:'Fase V · Serviços',p6:'Fase VI · Diagnóstico',p7:'Contrato final'
};
const MISSIONS=[
/* ---------- M1 ---------- */
{ id:'m1',code:'M-01',phase:'p1',title:'A fortaleza sem muros',sub:'Topologia física · ~20 min',xp:100,
  brief:`<p>A <b>Orion Distribuidora S.A.</b> contratou você para erguer a rede da matriz. O projeto prevê: uma <b>rede de usuários</b>, dois roteadores formando o núcleo e uma <b>DMZ</b> — área blindada onde ficarão os servidores <b>Web, DNS, FTP e E-mail</b>, protegidos por um <b>firewall ASA</b>.</p>
  <p>Primeira entrega: a infraestrutura física no <b>Cisco Packet Tracer</b>. O diagrama ao lado acompanha seu progresso.</p>`,
  steps:[
    `No Packet Tracer, posicione: <b>2 roteadores 2911</b>, <b>1 firewall ASA 5505</b> (categoria Security), <b>2 switches 2960</b>, <b>5 PCs</b> e <b>4 Servers</b>.`,
    `Distribua conforme o diagrama: <b>PC0 a PC4</b> no <b>Switch1</b>; <b>R1</b> liga o Switch1 à WAN; <b>R2</b> segue para o <b>ASA</b>; o ASA desce para o <b>Switch2</b>, onde moram os <b>4 servidores</b>.`,

  hint:{ic:'zap',t:`<b>Regra de bolso do cabo:</b> dispositivos <b>SEMELHANTES</b> (PC–PC, switch–switch, PC–router, ASA–switch) pedem cabo <b>cruzado</b>; dispositivos <b>DIFERENTES</b> (PC–switch, switch–router) pedem cabo <b>direto</b>. O ASA 5505 tem switch embutido — trate-o "como um switch" ao escolher o cabo.`},
  quiz:[
    {q:'Qual cabo liga o PC0 ao Switch1?',o:['Cabo direto (straight-through)','Cabo cruzado (crossover)','Cabo console','Fibra óptica'],a:0,ex:'Dispositivos diferentes (PC e switch) usam pares de pinos complementares: o cabo direto resolve.'},
    {q:'Qual cabo liga o R1 ao R2 (a WAN)?',o:['Cabo direto','Cabo cruzado (crossover)','Cabo console','Serial DCE'],a:1,ex:'Roteador com roteador: dispositivos semelhantes, ambos transmitem nos mesmos pinos — o cruzado troca TX↔RX.'},

  tasks:['Todos os cabos com LED verde nos dois lados.'],
  log:'M-01 CONCLUÍDA — Infraestrutura física da Orion no ar.'
},
/* ---------- M2 ---------- */
{ id:'m2',code:'M-02',phase:'p2',title:'Identidade dos usuários',sub:'Endereçamento estático · Rede dos usuários · ~15 min',xp:120,
  brief:`<p>Cablagem aprovada. Agora as cinco estações ganham identidade na rede <b>192.168.1.0/24</b>.</p>
  <p>Antes de responder, discuta em grupo: <b>qual máscara</b> combina com essa rede? <b>quem</b> é o gateway dos PCs? <b>que DNS</b> eles devem apontar?</p>`,
  table:[
    ['Dispositivo','Endereço IP','Papel','A'],
    ['R1 (G0/0)','192.168.1.1','Gateway da rede dos usuários','A'],
    ['PC0','192.168.1.10','Estação de trabalho','A'],

    ['PC2','192.168.1.12','Estação de trabalho','A'],
    ['PC3','192.168.1.13','Estação de trabalho','A'],
    ['PC4','192.168.1.14','Estação de trabalho','A']
  ],
  steps:[
    `Em cada PC: <b>Desktop → IP Configuration</b>. Preencha IP, máscara <b>255.255.255.0</b>, gateway <b>192.168.1.1</b> e DNS <b>192.168.2.11</b> (o DNS da DMZ — ainda não responde, mas já deixamos apontado).`,

  quiz:[
    {q:'Qual máscara corresponde à rede 192.168.1.0/24?',o:['255.0.0.0','255.255.0.0','255.255.255.0','255.255.255.255'],a:2,ex:'/24 = 24 bits ligados = 255.255.255.0. É ela quem diz ao PC: "meu vizinho de rede termina no terceiro octeto".'},

  tasks:['PC0 pinga o PC4 (192.168.1.14).','Todos os PCs pingam o gateway 192.168.1.1.'],

/* ---------- M3 ---------- */
{ id:'m3',code:'M-03',phase:'p3',title:'A estrada entre roteadores',sub:'CLI · interfaces + rotas estáticas · ~25 min',xp:150,
  brief:`<p>Os PCs conversam entre si, mas o mundo vai além do R1. Configure as <b>interfaces</b> dos dois roteadores e ensine a cada um <b>para onde encaminhar</b> o que não é dele: as rotas estáticas.</p>`,

    {t:'R1 · interfaces + rotas',c:`enable
configure terminal
hostname R1

 description LAN DOS USUARIOS
 ip address 192.168.1.1 255.255.255.0

exit

 description WAN PARA R2

ip route 192.168.2.0 255.255.255.0 10.0.0.2
end
write memory`},

 description LINK PARA O FIREWALL
 ip address 10.0.1.1 255.255.255.252

exit
ip route 192.168.1.0 255.255.255.0 10.0.0.1
ip route 192.168.2.0 255.255.255.0 10.0.1.2
end
write memory`}
  ],
  steps:[

  quiz:[

  ],
  tasks:['show ip interface brief com up/up nas interfaces de R1 e R2.','PC0 pinga 10.0.0.2 (R2) com sucesso.'],

{ id:'m4',code:'M-04',phase:'p3',title:'O muro invisível',sub:'Investigação · ~10 min',xp:150,

  hint:{ic:'alert',t:`Siga o rastro: <b>PC0</b> → gateway <b>192.168.1.1</b> → <b>R1</b> → rota estática → <b>R2</b> → rota estática → <b>10.0.1.2</b>… e aqui o pacote encontra o <b>ASA</b>. Entrando pela <b>outside (nível 0)</b> rumo à <b>inside (nível 100)</b>. O que o ASA faz com tráfego "de fora para dentro", por padrão?`},
  quiz:[
    {q:'As rotas estáticas estão corretas e mesmo assim o ping morre. Quem descarta o pacote?',o:['O Switch1, por segurança','O ASA: por padrão ele nega TODO tráfego vindo da outside (0) para a inside (100)','O PC4, porque a rede está congestionada','O R1, porque falta rota de retorno'],a:1,ex:'Roteamento ≠ permissão. O pacote CHEGA ao ASA — e o firewall, sem regra que o autorize, descarta. É o muro fazendo o trabalho dele.'},
    {q:'Num firewall ASA, o que representam "security-level 100" e "security-level 0"?',o:['Velocidade da porta em Mbps','Nível de confiança: 100 = interna confiável, 0 = externa hostil','Número de usuários suportados','Prioridade do roteamento'],a:1,ex:'O nível é o grau de confiança da zona. Regra de ouro do ASA: tráfego flui do mais confiável para o menos confiável — e é NEGADO no sentido contrário, salvo liberação explícita.'}
  ],
  tasks:[],
  log:'M-04 CONCLUÍDA — Diagnóstico conceitual: o ASA bloqueia outside→inside por padrão.'

/* ---------- M5 ---------- */
{ id:'m5',code:'M-05',phase:'p4',title:'Erguendo as muralhas',sub:'CLI do ASA 5505 · zonas inside/outside · ~25 min',xp:200,
  brief:`<p>O firewall está ligado mas "mudo": sem zonas, sem IP, sem rota. Vamos erguer as muralhas: <b>Vlan1 = inside</b> (a DMZ dos servidores, nível 100) e <b>Vlan2 = outside</b> (o link para o R2, nível 0).</p>

  cli:[{t:'ASA 5505 · zonas e rota',c:`enable

exit

exit

exit

exit

const byId=id=>MISSIONS.find(m=>m.id===id);
const idxOf=id=>MISSIONS.findIndex(m=>m.id===id);
const TOTAL_XP=MISSIONS.reduce((a,m)=>a+m.xp,0);

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function unlocked(i){return i===0||save.done.includes(MISSIONS[i-1].id);}
function renderNav(){
  let h='',lastPhase='';
  MISSIONS.forEach((m,i)=>{
    const un=unlocked(i),done=save.done.includes(m.id),active=save.cur===m.id;
    if(m.phase!==lastPhase){h+=`<div class="ph">${PHASES[m.phase]}</div>`;lastPhase=m.phase;}
    h+=`<button class="mnav${active?' active':''}${done?' done':''}${un?'':' locked'}" data-id="${m.id}" ${un?'':'disabled'}>
      <span class="num">${done?'✓':m.code}</span>
      <span class="ti"><b>${m.title}</b><small>${done?'concluída':un?m.sub:'bloqueada'}</small></span>
      <span class="st">${done?ic('check'):un?ic('chev'):ic('lock')}</span>
    </button>`;
  });
  $('#navList').innerHTML=h;
  $('#navFill').style.width=Math.round(save.done.length/MISSIONS.length*100)+'%';
  document.querySelectorAll('.mnav').forEach(b=>b.onclick=()=>{save.cur=b.dataset.id;persist();snd.click();renderNav();renderMission();updateTopo();$('#main').scrollTop=0;});
}
function goTo(id){save.cur=id;persist();snd.click();renderNav();renderMission();updateTopo();$('#main').scrollTop=0;}
function nextId(id){return MISSIONS[Math.min(idxOf(id)+1,MISSIONS.length-1)].id;}

/* ---------- requisitos ---------- */
const quizSolved=m=>!(m.quiz||[]).length||(m.quiz.every((q,i)=>save.qs[m.id]&&save.qs[m.id][i]===q.a));
const pairsSolved=m=>!(m.pairs||[]).length||(m.pairs.every((p,i)=>save.pr[m.id]&&save.pr[m.id][i]===p[2]));
const tasksDone=m=>!(m.tasks||[]).length||((save.tk[m.id]||[]).filter(Boolean).length===m.tasks.length);
const simSolved=m=>!m.sim||save.sim.solved;
const canValidate=m=>quizSolved(m)&&pairsSolved(m)&&tasksDone(m)&&simSolved(m);

/* ============================================================
   RENDER DA MISSÃO
   ============================================================ */
function tableHTML(m){
  const rows=m.table.slice(1).map(r=>`<tr class="${r[3]==='B'?'hr':''}"><td>${r[0]}</td><td class="num">${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  return `<div class="sec"><div class="sec-h">${ic('net')} Plano de endereçamento</div>
    <table class="iptab"><tr><th>${m.table[0][0]}</th><th>${m.table[0][1]}</th><th>${m.table[0][2]}</th></tr>${rows}</table></div>`;
}
function cliHTML(c){
  return `<div class="cli"><div class="cli-h"><span>${c.t}</span><button class="copy">${ic('copy')} copiar</button></div><pre>${esc(c.c)}</pre></div>`;
}
function quizHTML(m){
  const st=save.qs[m.id]||{};
  return `<div class="sec"><div class="sec-h">${ic('award')} Verificação de conhecimento</div>`+
    m.quiz.map((q,qi)=>{
      const solved=st[qi]===q.a;
      const opts=q.o.map((o,oi)=>{
        let cls='opt';
        if(solved){if(oi===q.a)cls+=' ok';}
        return `<button class="${cls}" data-q="${qi}" data-o="${oi}" ${solved?'disabled':''}>${esc(o)}</button>`;
      }).join('');
      return `<div class="q${solved?' solved':''}"><div class="q-q">${esc(q.q)}</div><div class="opts">${opts}</div><div class="q-ex">${esc(q.ex)}</div></div>`;
    }).join('')+`</div>`;
}
function pairsHTML(m){
  const st=save.pr[m.id]||{};
  const opts=m.pairs[0][1];
  return `<div class="sec"><div class="sec-h">${ic('net')} Quadro de conceitos</div>
  <p style="color:var(--faint);font-size:12px;margin-bottom:10px">Relacione cada protocolo à sua função:</p>`+
  m.pairs.map((p,pi)=>{
    const right=st[pi]===p[2];
    return `<div class="pair${right?' right':''}"><span class="term">${esc(p[0])}</span>
      <select data-p="${pi}" ${right?'disabled':''}>
        <option value="">— selecione —</option>
        ${opts.map((o,oi)=>`<option value="${oi}" ${st[pi]===oi?'selected':''}>${esc(o)}</option>`).join('')}
      </select>${right?`<span style="color:var(--ok)">${ic('check')}</span>`:''}</div>`;
  }).join('')+`</div>`;
}
function tasksHTML(m){
  const st=save.tk[m.id]||[];
  return `<div class="sec"><div class="sec-h">${ic('check')} Checklist de entrega</div>`+
    m.tasks.map((t,ti)=>`<button class="tsk${st[ti]?' on':''}" data-t="${ti}"><span class="bx">${ic('check')}</span><span>${t}</span></button>`).join('')+`</div>`;
}

function renderMission(){
  const m=byId(save.cur)||MISSIONS[0];
  const done=save.done.includes(m.id);
  const i=idxOf(m.id);
  const main=$('#main'),sy=main.scrollTop;
  let h=`<div class="m-head">
    <div class="m-code">${m.code}</div>
    <div class="m-tt"><h2>${m.title}</h2><div class="m-sub">${m.sub}</div></div>
    ${done?`<span class="done-badge">${ic('check')} MISSÃO CUMPRIDA</span>`:`<div class="m-xp">+${m.xp} XP</div>`}
  </div>
  <div class="sec"><div class="sec-h">${ic('term')} Briefing</div><div class="brief">${m.brief}</div></div>`;
  if(m.table)h+=tableHTML(m);
  if(m.cli)h+=m.cli.map(cliHTML).join('');
  if(m.hint)h+=`<div class="sec"><div class="hint ${m.hint.red?'red':''}">${ic(m.hint.ic||'zap')}<div>${m.hint.t}</div></div></div>`;
  if(m.steps)h+=`<div class="sec"><div class="sec-h">${ic('chev')} Execução</div><ol class="steps">${m.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
  if(m.quiz)h+=quizHTML(m);
  if(m.pairs)h+=pairsHTML(m);
  if(m.sim)h+=simHTML();
  if(m.tasks&&m.tasks.length)h+=tasksHTML(m);
  if(m.diag)h+=`<div class="sec"><div class="sec-h">${ic('term')} Relatório de campo</div>
    <p style="color:var(--dim);font-size:13px;margin-bottom:8px">Descreva, com suas palavras, qual era o problema proposital e como você o encontrou:</p>
    <textarea id="diagText" placeholder="Sintoma → hipótese → teste → causa raiz → correção…">${esc(save.diag||'')}</textarea></div>`;
  h+=`<div class="valbar">
    <button id="valBtn" ${done?'disabled':''}>${ic('flag')} ${done?'Missão concluída':'Validar entrega'}</button>
    <span id="valHint">${done?'Entrega registrada no log da operação.':'Complete perguntas, tarefas'+(m.sim?' e o caso do simulador':'')+' para validar.'}</span>
  </div>
  ${done&&i<MISSIONS.length-1?`<div style="margin-top:18px;text-align:right"><button class="btn-acc" onclick="goTo(nextId('${m.id}'))">Próxima missão ${ic('chev')}</button></div>`:''}`;
  $('#mwrap').innerHTML=h;
  main.scrollTop=sy;
  wireMission(m);
}

function wireMission(m){
  document.querySelectorAll('#mwrap .copy').forEach(b=>b.onclick=()=>{
    const pre=b.closest('.cli').querySelector('pre');
    try{navigator.clipboard.writeText(pre.textContent);}catch(e){}
    b.innerHTML=ic('check')+' copiado';snd.ok();setTimeout(()=>b.innerHTML=ic('copy')+' copiar',1600);
  });
  document.querySelectorAll('#mwrap .opt').forEach(btn=>{
    btn.onclick=()=>{
      const qi=+btn.dataset.q,oi=+btn.dataset.o,q=m.quiz[qi];
      const st=save.qs[m.id]=save.qs[m.id]||{};
      if(st[qi]===q.a)return;
      if(oi===q.a){st[qi]=oi;snd.ok();toast('Resposta correta','ok');persist();renderMission();}
      else{btn.classList.add('bad');snd.err();setTimeout(()=>btn.classList.remove('bad'),500);}
    };
  });
  document.querySelectorAll('#mwrap .pair select').forEach(sel=>{
    sel.onchange=()=>{
      const pi=+sel.dataset.p,v=sel.value===''?null:+sel.value,p=m.pairs[pi];
      const st=save.pr[m.id]=save.pr[m.id]||{};
      if(v===p[2]){st[pi]=v;snd.ok();persist();renderMission();}
      else{sel.style.borderColor='var(--bad)';snd.err();setTimeout(()=>sel.style.borderColor='',600);}
    };
  });
  document.querySelectorAll('#mwrap .tsk').forEach(btn=>{
    btn.onclick=()=>{
      const ti=+btn.dataset.t;const st=save.tk[m.id]=save.tk[m.id]||[];
      st[ti]=!st[ti];snd.click();persist();renderMission();
    };
  });
  const dt=$('#diagText');if(dt)dt.oninput=()=>{save.diag=dt.value;persist();};
  if(m.sim)wireSim(m);
  $('#valBtn').onclick=()=>validate(m);
}

/* ---------- validação ---------- */
function validate(m){
  if(save.done.includes(m.id))return;
  const miss=[];
  if(m.quiz&&!quizSolved(m))miss.push('perguntas respondidas corretamente');
  if(m.pairs&&!pairsSolved(m))miss.push('quadro de conceitos completo');
  if(m.sim&&!save.sim.solved)miss.push('caso fechado no simulador');
  if(m.tasks&&m.tasks.length&&!tasksDone(m))miss.push('checklist completo');
  if(miss.length){snd.err();toast('Falta: '+miss.join(' · '),'err');return;}
  save.done.push(m.id);save.xp+=m.xp;
  if(!save.tEnd)save.tEnd=Date.now();
  logAdd(m.log,'g');toast(`+${m.xp} XP — ${m.code} validada`,'ok');snd.done();
  if(m.cp){stamp(m.cp);setTimeout(()=>toast(m.cp+' alcançado','ok'),700);}
  persist();updateHud();renderNav();updateTopo();renderMission();
  if(m.id==='fin')setTimeout(showCert,1600);
}
function stamp(txt){$('#stampIn').textContent=txt;$('#stamp').classList.add('on');snd.stamp();setTimeout(()=>$('#stamp').classList.remove('on'),1500);}

/* ============================================================
   SIMULADOR DE SABOTAGEM (M-11)

const IP={web:'192.168.2.10',dns:'192.168.2.11',ftp:'192.168.2.12',mail:'192.168.2.13'};
const FAULTS={
  dns:{acc:0,short:'registro DNS do www corrompido',verdict:'O registro A do www apontava para 192.168.2.99 — um endereço que não existe. Quem sabia o caminho por IP achava a página; quem confiava no nome caía no fosso. Correção: editar o registro no servidor DNS.'},
  http:{acc:1,short:'serviço HTTP desligado no servidor web',verdict:'O serviço HTTP estava OFF no servidor web — o IP respondia ao ping (camada 3 OK), mas ninguém atendia a porta 80 (aplicação). Correção: Services → HTTP → On.'},
  acl:{acc:2,short:'ACL do ASA sem as linhas do FTP',verdict:'As duas linhas do FTP haviam sido removidas da ACL do ASA. Sem as portas 21/20 liberadas, o firewall descartava a conexão. Correção: reinserir as linhas e confirmar o access-group.'},
  gw:{acc:3,short:'gateway errado no servidor FTP',verdict:'O servidor FTP estava com gateway 192.168.2.99. Ele ouvia — mas nunca conseguia responder além da própria rede. Correção: Desktop → IP Configuration → gateway 192.168.2.1.'}
};
const ACCS=['Registro DNS do www apontando para o IP errado','Serviço HTTP desligado no servidor web','ACL do ASA sem as linhas do FTP (21/20)','Gateway do servidor FTP apontando para 192.168.2.99','Cabo do servidor DNS desconectado','Alarme falso — nada foi sabotado'];
function dnsResolve(name,f){
  const map={'www.empresa.local':IP.web,'ftp.empresa.local':IP.ftp,'mail.empresa.local':IP.mail,'dns.empresa.local':IP.dns};
  let ip=map[name];
  if(f==='dns'&&name==='www.empresa.local')ip='192.168.2.99';
  return ip;
}
const reach=(ip,f)=>!(f==='gw'&&ip===IP.ftp);

function simHTML(){
  if(!save.sim.sc){
    return `<div class="sec"><div class="sec-h">${ic('alert')} Laboratório de sabotagem</div>
    <div class="sim"><div class="sim-top"><span class="sab">${ic('alert')} ALERTA · usuários relatam que "a internet da empresa não funciona" — sintoma vago, como sempre.</span></div>
    <div class="sim-acc"><button id="simStart" class="btn-acc">Assumir o plantão</button></div></div></div>`;
  }
  const f=save.sim.sc;
  return `<div class="sec"><div class="sec-h">${ic('alert')} Laboratório de sabotagem</div><div class="sim">
  <div class="sim-top"><span class="sab">${ic('alert')} Falha plantada — interrogue a rede antes de acusar.</span>
    <button id="simReset">${ic('rot')} reiniciar caso</button></div>
  <div class="sim-grid">
    <div class="sim-l">
      <label>Comandos rápidos</label>
      ${['ping 192.168.2.11','ping 192.168.2.10','nslookup www.empresa.local','browser www.empresa.local','ftp ftp.empresa.local','show acl','svc web','svc dns','svc ftp','svc mail','ipconfig','help'].map(c=>`<button class="scmd" data-cmd="${c}">${c}</button>`).join('')}
      <label>Terminal</label>
      <input id="simIn" placeholder="digite um comando…">
      <button id="simRunBtn" class="scmd">executar</button>
    </div>
    <div class="sim-c" id="simOut"></div>
  </div>
  <div class="sim-acc">${save.sim.solved?
    `<div class="verdict"><h5>CASO ENCERRADO ${ic('check')}</h5><p>${FAULTS[f].verdict}</p>
     <div class="rk">Bônus de perícia: <b>${save.sim.bonus?'+50 XP':'já concedido'}</b> · Comandos usados: <b>${save.sim.cmds}</b>${save.sim.cmds<=5?' — investigação enxuta, parabéns!':''}</div></div>`:
    `<h5>Acusação — qual foi a sabotagem?</h5>
     <div class="acc-grid">${ACCS.map((a,i)=>`<button class="acc-opt${save.sim.acc===i?' sel':''}" data-acc="${i}">${esc(a)}</button>`).join('')}</div>
     <button id="closeCase">${ic('flag')} Fechar o caso</button>`}

function simPrint(lines){
  lines.forEach((l,i)=>setTimeout(()=>{
    const box=$('#simOut');if(!box)return;
    const d=document.createElement('div');d.className='ln '+(l[1]||'');d.textContent=l[0];
    box.appendChild(d);box.scrollTop=box.scrollHeight;if(i%3===0)snd.type();
  },i*110));
}
function simRun(raw){
  const box=$('#simOut');if(!box)return;
  const f=save.sim.sc;if(!f)return;
  const cmd=raw.trim();if(!cmd)return;
  const out=[];const P=(t,c)=>out.push([t,c]);
  P('PC0> '+cmd,'cmd');
  const parts=cmd.split(/\s+/);const c=parts[0].toLowerCase();const a=(parts.slice(1).join(' ')||'').toLowerCase();
  const isIp=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s);
  const resolve=s=>isIp(s)?s:dnsResolve(s,f);
  if(c==='help'){P('Comandos: ping <ip|nome> · nslookup <nome> · browser <url> · ftp <ip|nome> · show acl · svc web|dns|ftp|mail · ipconfig · clear','dim');}
  else if(c==='clear'){box.innerHTML='';save.sim.hist=[];save.sim.cmds++;persist();return;}
  else if(c==='ipconfig'){P('Configuração IP do PC0:','dim');P('   IPv4 . . . . . . . : 192.168.1.10');P('   Máscara  . . . . . : 255.255.255.0');P('   Gateway  . . . . . : 192.168.1.1');P('   DNS  . . . . . . . : 192.168.2.11','dim');}
  else if(c==='ping'){
    if(!a)P('Uso: ping <ip|nome>','wrn');
    else{const ip=resolve(a);
      if(!ip)P('Falha ao resolver "'+a+'" (DNS não conhece o nome).','err');
      else if(!reach(ip,f))P('Esgotado o tempo limite do pedido para '+ip+'.','err');
      else P('Resposta de '+ip+': bytes=32 tempo=1ms TTL=125','ok');}
  }
  else if(c==='nslookup'){
    if(!a)P('Uso: nslookup <nome>','wrn');
    else{P('Servidor: dns.empresa.local   Address: 192.168.2.11','dim');
      const ip=dnsResolve(a,f);
      if(ip){P('Nome:    '+a);P('Address: '+ip);}
      else P('*** Não existe registro para "'+a+'"','err');}
  }
  else if(c==='browser'){
    const host=a.replace(/^https?:\/\//,'').split('/')[0];
    const byName=!isIp(host);
    const ip=resolve(host);
    if(byName&&!ip)P('Erro DNS: '+host+' não resolve.','err');
    else if(byName&&ip!==IP.web&&host.startsWith('www'))P('Timeout: '+host+' resolveu para '+ip+', que não responde.','err');
    else{
      const target=isIp(host)?host:ip;
      if(target===IP.web){
        if(f==='http')P('Não foi possível exibir — conexão recusada em '+host+' (porta 80 fechada).','err');
        else P('Página carregada: Orion Distribuidora S.A. — intranet oficial.','ok');
      }else if(target===IP.ftp)P('Este é o servidor de ARQUIVOS. Use o comando ftp.','wrn');
      else if(target===IP.dns)P('192.168.2.11 responde, mas não publica páginas (é o DNS).','wrn');
      else P('Host respondeu com uma página padrão.','ok');
    }
  }
  else if(c==='ftp'){
    const ip=resolve(a);
    if(!a)P('Uso: ftp <ip|nome>','wrn');
    else if(!ip)P('Falha ao resolver '+a,'err');
    else if(!reach(ip,f))P('> ftp: connect — tempo esgotado, o host não responde.','err');
    else if(f==='acl')P('> conexão recusada pelo firewall (portas 21/20 descartadas na ACL).','err');
    else{P('Conectado a '+ip,'ok');P('220 FTP Server (Packet Tracer) pronto.');P('Usuário: cisco · Senha: ***  →  230 login OK','ok');P('ftp> dir  →  arquivo-projeto.txt · inventario.csv  (2 arquivos)','ok');}
  }
  else if(c==='show'&&a==='acl'){
    P('access-list LIBERA; elementos:','dim');
    P('access-list LIBERA extended permit icmp any any');
    P('access-list LIBERA extended permit tcp any host 192.168.2.10 eq www');
    P('access-list LIBERA extended permit udp any host 192.168.2.11 eq domain');
    if(f!=='acl'){P('access-list LIBERA extended permit tcp any host 192.168.2.12 eq ftp');P('access-list LIBERA extended permit tcp any host 192.168.2.12 eq ftp-data');}
    P('access-list LIBERA extended permit tcp any host 192.168.2.13 eq smtp');
    P('access-list LIBERA extended permit tcp any host 192.168.2.13 eq pop3');
    P('access-group LIBERA in interface outside','dim');
  }
  else if(c==='svc'){
    if(a==='web'){P('SERVIDOR WEB (192.168.2.10):','dim');P('  HTTP: '+(f==='http'?'OFF (serviço desligado)':'ON · porta 80'));P('  Gateway: 192.168.2.1');}
    else if(a==='dns'){P('SERVIDOR DNS (192.168.2.11) — registros A:','dim');P('  www.empresa.local  →  '+(f==='dns'?'192.168.2.99':'192.168.2.10'));P('  ftp.empresa.local  →  192.168.2.12');P('  mail.empresa.local →  192.168.2.13');}
    else if(a==='ftp'){P('SERVIDOR FTP (192.168.2.12):','dim');P('  FTP: ON · portas 21/20');P('  Gateway: '+(f==='gw'?'192.168.2.99':'192.168.2.1'));}
    else if(a==='mail'){P('SERVIDOR E-MAIL (192.168.2.13):','dim');P('  Domínio: empresa.local · SMTP: ON (25) · POP3: ON (110)');P('  Gateway: 192.168.2.1');}
    else P('Uso: svc web|dns|ftp|mail','wrn');
  }
  else P('Comando desconhecido: '+c+' (digite help)','err');
  save.sim.cmds++;
  out.forEach(l=>save.sim.hist.push(l));
  if(save.sim.hist.length>80)save.sim.hist=save.sim.hist.slice(-80);
  persist();simPrint(out);
}
function wireSim(m){
  const st=$('#simStart');
  if(st)st.onclick=()=>{
    const keys=Object.keys(FAULTS);
    save.sim={sc:keys[Math.floor(Math.random()*keys.length)],cmds:0,acc:null,solved:false,bonus:save.sim.bonus,hist:[]};
    persist();snd.ok();renderMission();logAdd('Plantão assumido: uma falha foi plantada no laboratório.','a');
  };
  const rs=$('#simReset');
  if(rs)rs.onclick=()=>{
    const keys=Object.keys(FAULTS);
    let k=keys[Math.floor(Math.random()*keys.length)];
    if(keys.length>1&&k===save.sim.sc)k=keys[(keys.indexOf(k)+1)%keys.length];
    save.sim={sc:k,cmds:0,acc:null,solved:false,bonus:save.sim.bonus,hist:[]};
    persist();snd.click();renderMission();
  };
  document.querySelectorAll('#mwrap .scmd[data-cmd]').forEach(b=>b.onclick=()=>simRun(b.dataset.cmd));
  const inp=$('#simIn');
  if(inp){
    inp.onkeydown=e=>{if(e.key==='Enter'){simRun(inp.value);inp.value='';}};
    const rb=$('#simRunBtn');if(rb)rb.onclick=()=>{simRun(inp.value);inp.value='';};
  }
  const box=$('#simOut');
  if(box&&save.sim.hist.length){
    box.innerHTML=save.sim.hist.map(l=>`<div class="ln ${l[1]||''}">${esc(l[0])}</div>`).join('');
    box.scrollTop=box.scrollHeight;
  }
  document.querySelectorAll('#mwrap .acc-opt').forEach(b=>b.onclick=()=>{
    if(save.sim.solved)return;
    save.sim.acc=+b.dataset.acc;persist();snd.click();
    document.querySelectorAll('#mwrap .acc-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
  const cc=$('#closeCase');
  if(cc)cc.onclick=()=>{
    const f=save.sim.sc;
    if(save.sim.acc==null){toast('Selecione uma acusação antes de fechar o caso','err');snd.err();return;}
    if(save.sim.cmds<3){toast('Interrogue mais a rede — pelo menos 3 comandos antes de acusar','err');return;}
    if(save.sim.acc===FAULTS[f].acc){
      const first=!save.sim.solved;
      save.sim.solved=true;
      if(first&&!save.sim.bonus){save.xp+=50;save.sim.bonus=true;}
      persist();snd.done();updateHud();renderMission();
      logAdd('Caso de sabotagem encerrado: '+FAULTS[f].short+'.','g');
      toast('Caso encerrado — acusação correta'+(first?' (+50 XP)':''),'ok');
    }else{
      snd.err();toast('Acusação refutada. Volte ao terminal e colete mais evidências.','err');
      const sel=document.querySelector('#mwrap .acc-opt.sel');
      if(sel){sel.classList.add('wrong');setTimeout(()=>sel.classList.remove('wrong'),500);}
    }
  };
}

function buildTopo(){

}

function updateHud(){
  $('#hudName').innerHTML=save.name?`técnico <b>${esc(save.name)}</b>`:'';
  $('#hudRank').textContent=rankFor(save.xp);
  $('#xpFill').style.width=Math.min(100,Math.round(save.xp/TOTAL_XP*100))+'%';
  $('#xpTxt').textContent=save.xp+' XP';
}
function clockTick(){$('#clock').textContent=fmtTime((save.tEnd||Date.now())-(save.t0||Date.now()));}
function renderAll(){renderNav();renderMission();updateTopo();updateHud();}

let started=false;
function startApp(){
  if(started)return;started=true;
  $('#boot').style.display='none';
  $('#app').classList.add('on');
  if(!save.t0)save.t0=Date.now();
  persist();renderAll();
  logAdd('Contrato assinado por '+save.name+'. Operação Sentinela iniciada.','a');
  logAdd('Ordem de serviço #0047 carregada. Boa sorte, técnico.','');
  setInterval(clockTick,1000);clockTick();
}
const BOOT=[
  'CISCO PACKET TRACER · MÓDULO DE INSTRUÇÃO v8.2',
  '> montando ambiente de laboratório .......... <span class="gd">OK</span>',
  '> ordem de serviço #0047 .................... <span class="gd">ABERTA</span>',
  '> cliente: ORION DISTRIBUIDORA S.A. ......... <span class="gd">CADASTRADO</span>',
  '> perímetro: DMZ + FIREWALL ASA ............. <span class="em">CLASSIFICADO</span>',
  '> aguardando técnico responsável…'
];
function boot(){
  let i=0,aborted=false;
  const lines=$('#bootLines');
  const next=()=>{
    if(aborted)return;
    if(i<BOOT.length){
      const d=document.createElement('span');d.className='bl';d.innerHTML=BOOT[i];
      lines.appendChild(d);snd.type();i++;
      setTimeout(next,i===BOOT.length?500:240+Math.random()*220);
    }else{
      $('#bootTitle').style.display='block';$('#bootSub').style.display='block';
      if(save.name)startApp();
      else{$('#bootForm').classList.add('on');$('#techName').focus();}
      $('#bootSkip').style.display='block';
    }
  };
  next();
  $('#bootForm').onsubmit=e=>{
    e.preventDefault();
    const v=$('#techName').value.trim();
    if(!v){toast('Identifique-se para assinar o contrato','err');return;}
    save.name=v;save.t0=save.t0||Date.now();persist();snd.ok();startApp();
  };
  $('#bootSkip').onclick=()=>{
    aborted=true;
    if(!save.name){save.name='Técnico';save.t0=save.t0||Date.now();persist();}
    startApp();
  };
}

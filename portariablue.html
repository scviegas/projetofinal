<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operação Portaria — Blue Team · Cybersecurity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d09; --panel:#12150e; --panel2:#171b12; --inset:#0d100a;
  --line:#282e1f; --line2:#3a4230;
  --ink:#ece9db; --dim:#a8ad97; --faint:#6d7460;
  --acc:#ffb454; --acc2:#ff8a3d;
  --netA:#ffb454; --netB:#5fd4d0; --netF:#57d97a;
  --ok:#57d97a; --bad:#ff6b5e; --warn:#ffd166;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Chakra Petch',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.55;
  background-image:linear-gradient(rgba(255,180,84,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,180,84,.025) 1px,transparent 1px);
  background-size:34px 34px;overflow:hidden}
::selection{background:var(--acc);color:#141005}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c331f;border:2px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.brief code,.hint code,.steps code{background:var(--inset);border:1px solid var(--line);padding:1px 6px;font-size:11.5px;color:var(--netB)}

#boot{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column}
#bootInner{width:min(680px,92vw)}
#bootLines{font-size:14px;color:var(--dim);min-height:230px;white-space:pre-wrap}
#bootLines .bl{display:block;opacity:0;animation:blin .25s forwards}
@keyframes blin{to{opacity:1}}
#bootLines .em{color:var(--acc)} #bootLines .gd{color:var(--ok)} #bootLines .rd{color:var(--bad)}
#bootTitle{font-family:var(--disp);font-weight:700;font-size:clamp(30px,5vw,52px);letter-spacing:.04em;color:var(--ink);margin:6px 0 2px}
#bootTitle span{color:var(--acc)}
#bootSub{color:var(--faint);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:26px}
#bootForm{display:none;gap:12px;align-items:stretch;flex-wrap:wrap}
#bootForm.on{display:flex}
#techName{flex:1;min-width:240px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:15px;padding:13px 14px;outline:none}
#techName:focus{border-color:var(--acc)}
.btn-acc{background:var(--acc);color:#171004;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.08em;padding:13px 22px;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-acc:hover{background:var(--acc2)}
#bootSkip{margin-top:26px;color:var(--faint);font-size:12px;text-decoration:underline dotted}
#bootSkip:hover{color:var(--dim)}

#app{display:grid;grid-template-columns:252px minmax(0,1fr) 392px;grid-template-rows:56px minmax(0,1fr);height:100vh;gap:1px;background:var(--line);opacity:0;transition:opacity .5s}
#app.on{opacity:1}
header,nav,main,#rightCol{background:var(--bg)}

#topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.05em}
.brand b::before{content:"";display:inline-block;width:10px;height:10px;background:var(--acc);margin-right:9px;vertical-align:0}
.brand small{color:var(--faint);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#hudName{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#hudName b{color:var(--ink)}
#hudRank{font-size:11px;color:var(--acc);border:1px solid var(--line2);padding:2px 8px;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase}
#hudPen{font-size:11px;color:var(--bad);border:1px solid var(--bad);padding:2px 8px;display:none;white-space:nowrap}
.xpwrap{display:flex;align-items:center;gap:8px;min-width:130px}
.xpbar{flex:1;height:6px;background:var(--inset);border:1px solid var(--line2)}
.xpbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .6s}
#xpTxt{font-size:11px;color:var(--dim);white-space:nowrap}
#hudClock{font-size:13px;color:var(--ink);letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.tbtns{margin-left:auto;display:flex;gap:6px}
.tbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--dim)}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}

nav{overflow-y:auto;padding:14px 10px 30px}
.navprog{height:4px;background:var(--inset);border:1px solid var(--line2);margin:2px 4px 16px}
.navprog i{display:block;height:100%;background:var(--acc);transition:width .6s}
.ph{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.mnav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-left:2px solid var(--line);color:var(--dim);font-size:12.5px;margin-bottom:2px}
.mnav .num{font-size:10px;color:var(--faint);width:32px;flex:none;letter-spacing:.05em}
.mnav .ti{flex:1;min-width:0}
.mnav .ti b{display:block;font-weight:500;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav .ti small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.mnav .st{color:var(--faint)}
.mnav:hover{border-color:var(--line2);color:var(--ink)}
.mnav.active{background:var(--panel2);border-color:var(--line2);border-left-color:var(--acc);color:var(--ink)}
.mnav.done .st{color:var(--ok)} .mnav.done .num{color:var(--ok)}
.mnav.locked{opacity:.42;cursor:not-allowed}

main{overflow-y:auto;padding:26px 34px 60px;scroll-behavior:smooth}
.mwrap{max-width:780px}
.m-head{display:flex;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.m-code{font-family:var(--disp);font-weight:700;font-size:30px;color:var(--acc);letter-spacing:.04em;line-height:1;border:1px solid var(--line2);padding:10px 12px 8px;background:var(--panel)}
.m-tt{flex:1;min-width:0}
.m-tt h2{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.02em}
.m-sub{color:var(--faint);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.m-xp{font-family:var(--disp);font-weight:600;color:var(--ok);border:1px solid var(--line2);padding:8px 12px;font-size:14px;white-space:nowrap}
.done-badge{display:inline-flex;gap:7px;align-items:center;color:var(--ok);border:1px solid var(--ok);padding:7px 12px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.1em}

.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.brief{background:var(--panel);border:1px solid var(--line);padding:16px 18px;color:var(--dim)}
.brief p+p{margin-top:9px}
.brief b,.steps b{color:var(--ink)}
.steps{counter-reset:st;list-style:none}
.steps li{counter-increment:st;position:relative;padding:9px 0 9px 44px;color:var(--dim);border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(st,decimal-leading-zero);position:absolute;left:0;top:10px;font-family:var(--disp);font-weight:700;color:var(--acc);font-size:15px}
.hint{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:13px 15px;color:var(--dim);font-size:13px}
.hint .ic{color:var(--acc);margin-top:2px}
.hint b{color:var(--ink)}

.iptab{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
.iptab th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line2)}
.iptab td{padding:7px 10px;border-bottom:1px dashed var(--line);color:var(--dim)}
.iptab td:first-child{color:var(--ink);font-weight:500}
.iptab td.num{color:var(--netA)}
.mx td.yes{color:var(--ok);font-weight:600} .mx td.no{color:var(--bad);font-weight:600}

.cli{background:var(--inset);border:1px solid var(--line2);margin:10px 0}
.cli-h{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.cli-h span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.copy{font-size:10px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);padding:3px 9px;display:flex;gap:5px;align-items:center;text-transform:uppercase}
.copy:hover{color:var(--acc);border-color:var(--acc)}
.cli pre{padding:13px 15px;font-size:12.5px;line-height:1.65;color:#d8dcc8;overflow-x:auto;white-space:pre}

.q{border:1px solid var(--line);background:var(--panel);margin-bottom:14px}
.q-q{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink)}
.q-q::before{content:"? ";color:var(--acc);font-weight:600}
.opts{padding:10px;display:grid;gap:7px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--panel2);padding:9px 13px;color:var(--dim);font-size:13px;display:flex;gap:10px;align-items:center;transition:border-color .15s}
.opt::before{content:"";width:8px;height:8px;border:1px solid var(--faint);flex:none}
.opt:hover:not(:disabled){border-color:var(--acc);color:var(--ink)}
.opt:disabled{cursor:default;opacity:.55}
.opt.ok{border-color:var(--ok);color:var(--ok);opacity:1}
.opt.ok::before{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad);animation:shake .4s}
.opt.bad::before{background:var(--bad);border-color:var(--bad)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.q-ex{display:none;padding:11px 16px;border-top:1px solid var(--line);color:var(--ok);font-size:12.5px;background:var(--panel2)}
.q.solved .q-ex{display:block}

.pair{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.pair:last-child{border-bottom:none}
.pair .term{width:150px;font-family:var(--disp);font-weight:600;color:var(--netB);font-size:13px}
.pair select{flex:1;min-width:220px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:8px 10px;outline:none}
.pair select:focus{border-color:var(--acc)}
.pair.right select{border-color:var(--ok)}

.tsk{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);background:var(--panel);margin-bottom:7px;text-align:left;color:var(--dim);font-size:13px;width:100%}
.tsk:hover{border-color:var(--line2)}
.tsk .bx{width:18px;height:18px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent}
.tsk.on{color:var(--ink)} .tsk.on .bx{background:var(--ok);border-color:var(--ok);color:#0c1409}

.valbar{display:flex;gap:14px;align-items:center;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
#valBtn{display:flex;gap:10px;align-items:center;background:var(--acc);color:#171004;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;padding:14px 26px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#valBtn:disabled{background:var(--panel2);color:var(--faint);cursor:not-allowed}
#valHint{color:var(--faint);font-size:12px}
textarea#diagText{width:100%;min-height:90px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:13px;padding:12px;outline:none;resize:vertical}
textarea#diagText:focus{border-color:var(--acc)}

.sim{border:1px solid var(--line2);background:var(--panel)}
.sim-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
.sim-top .sab{color:var(--warn);font-size:12.5px;display:flex;gap:8px;align-items:center}
.sim-top button{margin-left:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:5px 10px;display:flex;gap:6px;align-items:center}
.sim-top button:hover{color:var(--acc);border-color:var(--acc)}
.sim-top select{background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:5px 8px;outline:none}
.sim-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:1px;background:var(--line2)}
.sim-l{background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.sim-l label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.sim-l input{background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:8px;outline:none}
.sim-l input:focus{border-color:var(--acc)}
.scmd{text-align:left;border:1px solid var(--line2);background:var(--inset);padding:7px 10px;color:var(--dim);font-size:12px}
.scmd:hover{border-color:var(--acc);color:var(--acc)}
.sim-c{background:#080a06;min-height:260px;max-height:330px;overflow-y:auto;padding:12px 14px;font-size:12.5px;line-height:1.6}
.sim-c .ln{white-space:pre-wrap;word-break:break-word}
.sim-c .cmd{color:var(--acc)} .sim-c .ok{color:var(--ok)} .sim-c .err{color:var(--bad)} .sim-c .wrn{color:var(--warn)} .sim-c .dim{color:var(--faint)} .sim-c .cy{color:var(--netB)}

.suite{border:1px solid var(--line2);background:var(--panel)}
.srow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.srow:last-child{border-bottom:none}
.srow .sl{flex:1;min-width:190px;color:var(--ink)}
.srow .sx{width:190px;color:var(--faint);font-size:11px}
.chip{font-size:10px;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--line2);text-transform:uppercase;white-space:nowrap}
.chip.pass{color:var(--ok);border-color:var(--ok)}
.chip.vio{color:var(--bad);border-color:var(--bad)}
.chip.blk{color:var(--warn);border-color:var(--warn)}
.chip.wait{color:var(--faint)}

.incident{border:1px solid var(--bad);background:#160d0b;padding:14px 16px}
.incident h5{color:var(--bad);font-family:var(--disp);letter-spacing:.08em;font-size:14px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.incident p{color:var(--dim);font-size:12.5px}

.socline{font-size:11.5px;line-height:1.75;color:var(--dim)}
.socline .t{color:var(--faint);margin-right:7px}
.socline.perm{color:var(--ok)} .socline.deny{color:var(--warn)} .socline.alert{color:var(--bad)} .socline.crit{color:var(--bad);font-weight:600} .socline.info{color:var(--dim)}
.socline.crit::before{content:"◆ "}

.discf{display:grid;gap:10px}
.drow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drow label{width:270px;color:var(--dim);font-size:12.5px}
.drow input{flex:1;min-width:160px;background:var(--inset);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none}
.drow input:focus{border-color:var(--acc)}
.drow input.ok{border-color:var(--ok);color:var(--ok)}
.drow .chk{font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);padding:7px 12px;color:var(--dim)}
.drow .chk:hover{border-color:var(--acc);color:var(--acc)}
.drow .st{width:20px;color:var(--faint)}
.drow.right .st{color:var(--ok)}

.penlist{font-size:12.5px;color:var(--dim)}
.penlist div{padding:5px 0;border-bottom:1px dashed var(--line)}
.penlist b{color:var(--bad)}

#rightCol{display:flex;flex-direction:column;min-height:0}
#topoWrap{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
#topoWrap::before,#topoWrap::after,#rightCol .corner::before,#rightCol .corner::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--acc);border-style:solid}
#topoWrap::before{top:6px;left:6px;border-width:1px 0 0 1px}
#topoWrap::after{top:6px;right:6px;border-width:1px 1px 0 0}
#rightCol .corner::before{bottom:6px;left:6px;border-width:0 0 1px 1px}
#rightCol .corner::after{bottom:6px;right:6px;border-width:0 1px 1px 0}
.panel-t{display:flex;gap:8px;align-items:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.panel-t .ic{color:var(--acc)}
#topoSvg{width:100%;display:block;background:var(--inset);border:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--faint);letter-spacing:.05em}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
#socWrap{flex:1;min-height:130px;display:flex;flex-direction:column;padding:12px 16px 14px;position:relative}
#socHead{display:flex;align-items:center;gap:8px}
#socHead .panel-t{flex:1;margin-bottom:0}
#socList{flex:1;overflow-y:auto;margin-top:8px}
#socList::-webkit-scrollbar{width:8px}

.dev{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.dev.show{opacity:1;transform:none}
.ghost{opacity:.45}
.tlink{stroke:#3a4230;stroke-width:1.6;fill:none;transition:stroke .5s}
.tlink.up{stroke-width:2;opacity:.8}
.tlink.netA{stroke:var(--netA)} .tlink.netB{stroke:var(--netB)} .tlink.netF{stroke:var(--netF)}
.tlink.tr{stroke-dasharray:5 5;animation:dashmove 1.2s linear infinite;stroke:var(--ink)}
@keyframes dashmove{to{stroke-dashoffset:-20}}
.dlbl{font-family:var(--mono);font-size:10.5px;fill:var(--ink)}
.dip{font-family:var(--mono);font-size:8.5px}
.led{animation:ledpulse 1.6s infinite}
@keyframes ledpulse{50%{opacity:.25}}

#stamp{position:fixed;inset:0;display:none;place-items:center;z-index:120;pointer-events:none}
#stamp.on{display:grid}
#stampIn{font-family:var(--disp);font-weight:700;font-size:clamp(28px,4vw,46px);letter-spacing:.14em;color:var(--ok);border:4px solid var(--ok);padding:16px 34px;transform:rotate(-7deg) scale(2.6);opacity:0;background:rgba(11,13,9,.85);animation:stampin .55s cubic-bezier(.2,1.6,.4,1) forwards;text-transform:uppercase}
@keyframes stampin{to{transform:rotate(-7deg) scale(1);opacity:1}}

#toastHost{position:fixed;top:66px;right:16px;z-index:150;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:11px 14px;font-size:12.5px;color:var(--ink);max-width:340px;animation:tin .3s}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.toast .ic{margin-top:1px;color:var(--acc)} .toast.ok .ic{color:var(--ok)} .toast.err .ic{color:var(--bad)} .toast.warn .ic{color:var(--warn)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.toast.out{transition:.3s;opacity:0;transform:translateX(30px)}

#modalHost{position:fixed;inset:0;z-index:180;display:none;align-items:center;justify-content:center;background:rgba(5,6,4,.78)}
#modalHost.on{display:flex}
.modal{width:min(740px,92vw);max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);padding:24px 26px}
.modal h3{font-family:var(--disp);font-size:19px;letter-spacing:.05em;color:var(--acc);display:flex;gap:10px;align-items:center;margin-bottom:14px}

<script>
/* ============================================================
   OPERAÇÃO PORTARIA — BLUE TEAM (v2.1 · correções)
   ============================================================ */
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;

/* ---------- estado ---------- */
const DEF={name:'',xp:0,pens:[],penKeys:[],done:[],cur:'m1',qs:{},tk:{},pr:{},sr:{},diag:'',
  disc:{net:false,mask:false,gw:false,srv:false},
  rev:{pc1:false,pc2:false,admin:false,cam:false,srv:false,r1:false},
  arp:{},inc70:false,inc71:false,teln:false,finPlanted:null,finSolved:false,
  pcSel:'PC1',t0:null,tEnd:null,muted:false,
  rtr:null,cliLog:[],pcLog:{}};
let save;
try{save=Object.assign({},DEF,JSON.parse(localStorage.getItem('portaria-bt-save')||'{}'));}catch(e){save=Object.assign({},DEF);}
save.pens=save.pens||[];save.penKeys=save.penKeys||[];
save.disc=save.disc||DEF.disc;save.rev=save.rev||DEF.rev;save.arp=save.arp||{};
save.pcLog=save.pcLog||{};save.cliLog=save.cliLog||[];save.sr=save.sr||{};
const persist=()=>localStorage.setItem('portaria-bt-save',JSON.stringify(save));

/* ---------- áudio ---------- */
let AC=null;
function tone(f,d,type,v,delay){
  if(save.muted)return;
  type=type||'square';v=v||.05;delay=delay||0;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const snd={
  click:()=>tone(660,.05,'square',.03,0),
  type:()=>tone(1100+Math.random()*300,.02,'square',.012,0),
  ok:()=>{tone(740,.09,'square',.05,0);tone(1108,.14,'square',.05,.09);},
  err:()=>tone(160,.22,'sawtooth',.06,0),
  alarm:()=>{tone(880,.14,'square',.06,0);tone(660,.14,'square',.06,.16);tone(880,.14,'square',.06,.32);},
  done:()=>{tone(660,.1,'square',.05,0);tone(880,.1,'square',.05,.1);tone(1320,.2,'square',.05,.2);},
  stamp:()=>tone(140,.18,'sawtooth',.08,0)
};

/* ---------- toast / tempo / patentes ---------- */
function toast(msg,type){
  type=type||'';
  const d=document.createElement('div');d.className='toast '+type;
  d.innerHTML=ic(type==='err'?'alert':type==='ok'?'check':'zap')+'<span>'+msg+'</span>';
  $('#toastHost').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),350);},4200);
}
function fmtTime(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,'0');
  return h?p(h)+':'+p(m)+':'+p(ss):p(m)+':'+p(ss);}
function nowStamp(){return new Date().toLocaleTimeString('pt-BR',{hour12:false});}
const RANKS=[[0,'Estagiário SOC'],[200,'Analista Jr.'],[500,'Analista de Redes'],[800,'Analista de Segurança'],[1100,'Defensor de Perímetro'],[1350,'Respondente de Incidentes'],[1500,'Arquiteto Blue Team']];
const penTotal=()=>save.pens.reduce((a,p)=>a+p.x,0);
const xpNet=()=>Math.max(0,save.xp-penTotal());
const rankFor=n=>{let r=RANKS[0][1];RANKS.forEach(kv=>{if(n>=kv[0])r=kv[1];});return r;};
function pushPen(reason,xp){
  save.pens.push({r:reason,x:xp});persist();
  toast('Penalidade: '+reason+' ('+xp+' XP)','err');snd.err();updateHud();
}

/* ============================================================
   MOTOR DE REDE
   ============================================================ */
const PORTS={ftp:21,'ftp-data':20,ssh:22,telnet:23,smtp:25,domain:53,www:80,http:80,https:443,pop3:110};
const RTRIPS={'g0/0':'172.22.34.65','g0/1':'172.22.34.97','g0/2':'172.22.34.1'};
const HOSTS={
  PC1:{ip:'172.22.34.66',mask:'255.255.255.224',gw:'172.22.34.65',lbl:'PC1'},
  PC2:{ip:'172.22.34.98',mask:'255.255.255.240',gw:'172.22.34.97',lbl:'PC2'},
  ADMIN:{ip:'172.22.34.100',mask:'255.255.255.240',gw:'172.22.34.97',lbl:'ADMIN'},
  CAM:{ip:'172.22.34.70',mask:'255.255.255.224',gw:'172.22.34.65',lbl:'CAM'}
};
const SRVIP='172.22.34.62';
const SRVSVC={21:'ftp',22:'ssh',53:'dns',80:'http',443:'https'};
const DNSNAMES={'filesrv.orion.local':SRVIP,'www.orion.local':SRVIP};

function newRtr(){return{hostname:'R1',vty:{acl:null,trans:null},
  ifaces:{'g0/0':{ip:'172.22.34.65',mask:'255.255.255.224',up:true,aclIn:null,aclOut:null},
          'g0/1':{ip:'172.22.34.97',mask:'255.255.255.240',up:true,aclIn:null,aclOut:null},
          'g0/2':{ip:'172.22.34.1',mask:'255.255.255.192',up:true,aclIn:null,aclOut:null}},
  num:{},named:{}};}
if(!save.rtr)save.rtr=newRtr();
['g0/0','g0/1','g0/2'].forEach(k=>{if(!save.rtr.ifaces[k])save.rtr.ifaces[k]=newRtr().ifaces[k];});
if(!save.rtr.vty)save.rtr.vty={acl:null,trans:null};

const isIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s||'')&&String(s).split('.').every(o=>+o<=255);
const ipN=s=>{const p=String(s).split('.').map(Number);return((p[0]<<24)|(p[1]<<16)|(p[2]<<8)|p[3])>>>0;};
const inNet=(ip,net,wc)=>((ipN(ip)^ipN(net))&~ipN(wc))===0;
const maskCidr=m=>String(m).split('.').reduce((a,o)=>a+((+o).toString(2).match(/1/g)||[]).length,0);
const pad=(s,n)=>(String(s)+' '.repeat(n)).slice(0,n);
function normIf(s){s=String(s||'').toLowerCase().replace(/\s+/g,'');s=s.replace(/^(gigabitethernet|gigabit|gig|gi|g)/,'g');return /^g0\/[0-2]$/.test(s)?s:null;}
function normPort(p){
  p=String(p||'').toLowerCase();
  if(PORTS[p])return p;
  if(/^\d+$/.test(p)&&+p>0&&+p<65536){const k=Object.keys(PORTS).find(k=>PORTS[k]===+p);return k||String(+p);}
  return null;
}
const portNum=p=>/^\d+$/.test(String(p))?+p:PORTS[p];
function getList(id){return save.rtr.num[id]||save.rtr.named[id]||null;}

function readSpec(t,i){
  if(!t[i])return{err:'endereço de origem ausente'};
  if(t[i].toLowerCase()==='any')return{addr:'0.0.0.0',wc:'255.255.255.255',next:i+1};
  if(t[i].toLowerCase()==='host'){if(!isIp(t[i+1]))return{err:'endereço inválido após "host"'};
    return{addr:t[i+1],wc:'0.0.0.0',next:i+2};}
  if(!isIp(t[i]))return{err:'IP inválido: '+t[i]};
  if(!isIp(t[i+1]))return{err:'falta a máscara curinga após '+t[i]+' (ex.: 0.0.0.31)'};
  return{addr:t[i],wc:t[i+1],next:i+2};
}
function parseExtLine(rest){
  const proto=(rest[0]||'').toLowerCase();
  if(!['ip','tcp','udp','icmp'].includes(proto))return{err:'protocolo inválido — use ip, tcp, udp ou icmp'};
  let i=1;const s=readSpec(rest,i);if(s.err)return s;i=s.next;
  let d=null;
  if(i<rest.length){d=readSpec(rest,i);if(d.err)return d;i=d.next;}
  if(!d)return{err:'falta o destino (ex.: host 172.22.34.62)'};
  let port=null;
  if(rest[i]){
    if(rest[i].toLowerCase()==='eq'){port=normPort(rest[i+1]);if(!port)return{err:'porta/serviço inválido após "eq"'};i+=2;}
    else return{err:'parâmetro inesperado: '+rest[i]};
  }
  return{line:{proto:proto,src:s.addr,swc:s.wc,dst:d.addr,swd:d.wc,port:port}};
}
function matchLine(l,pkt){
  if(l.proto!=='ip'&&l.proto!==pkt.proto)return false;
  if(!inNet(pkt.src,l.src,l.swc))return false;
  if(!inNet(pkt.dst,l.dst,l.swd))return false;
  if(l.port!=null){
    if(pkt.proto!=='tcp'&&pkt.proto!=='udp')return false;
    if(pkt.dport!==portNum(l.port))return false;
  }
  return true;
}
function aclCheck(id,pkt){
  const list=getList(id);if(!list)return null;
  for(const ln of list){if(matchLine(ln,pkt)){ln.hits++;return{acl:id,action:ln.action,implicit:false};}}
  return{acl:id,action:'deny',implicit:true};
}
function ifaceOf(ip){
  const keys=['g0/0','g0/1','g0/2'];
  for(const k of keys){const IF=save.rtr.ifaces[k];
    if(IF.up&&IF.ip&&inNet(ip,IF.ip,IF.mask))return k;}
  return null;
}
function flow(src,dst,proto,dport){
  const rtrIps=Object.values(RTRIPS);
  const inIf=ifaceOf(src);
  if(!inIf)return{out:'bad-src'};
  if(rtrIps.includes(dst)){
    const pkt={src:src,dst:dst,proto:proto,dport:dport};
    const b=save.rtr.ifaces[inIf].aclIn?aclCheck(save.rtr.ifaces[inIf].aclIn,pkt):null;
    if(b&&b.action==='deny')return{out:'acl-deny',acl:b.acl,implicit:b.implicit};
    if(proto==='tcp'&&(dport===22||dport===23)){
      if(dport===23&&save.rtr.vty.trans==='ssh')
        return{out:'acl-deny',acl:'vty',implicit:true,why:'transport input ssh'};
      if(save.rtr.vty.acl){
        const v=aclCheck(save.rtr.vty.acl,pkt);
        if(v&&v.action==='deny')return{out:'acl-deny',acl:v.acl,implicit:v.implicit};
      }
    }
    persist();return{out:'self-ok'};
  }
  const outIf=ifaceOf(dst);
  if(!outIf)return{out:'no-route'};
  if(inIf===outIf){persist();return{out:'ok'};}
  const pkt={src:src,dst:dst,proto:proto,dport:dport};
  let b=save.rtr.ifaces[inIf].aclIn?aclCheck(save.rtr.ifaces[inIf].aclIn,pkt):null;
  if(b&&b.action==='deny')return{out:'acl-deny',stage:'req',acl:b.acl,implicit:b.implicit};
  b=save.rtr.ifaces[outIf].aclOut?aclCheck(save.rtr.ifaces[outIf].aclOut,pkt):null;
  if(b&&b.action==='deny')return{out:'acl-deny',stage:'req',acl:b.acl,implicit:b.implicit};
  const rp={src:dst,dst:src,proto:proto,dport:(proto==='tcp'||proto==='udp')?61234:null};
  b=save.rtr.ifaces[outIf].aclIn?aclCheck(save.rtr.ifaces[outIf].aclIn,rp):null;
  if(b&&b.action==='deny')return{out:'acl-deny',stage:'rep',acl:b.acl,implicit:b.implicit};
  b=save.rtr.ifaces[inIf].aclOut?aclCheck(save.rtr.ifaces[inIf].aclOut,rp):null;
  if(b&&b.action==='deny')return{out:'acl-deny',stage:'rep',acl:b.acl,implicit:b.implicit};
  persist();return{out:'ok'};
}
function probe(src,dst,kind){
  const map={http:['tcp',80],https:['tcp',443],dns:['udp',53],ftp:['tcp',21],ssh:['tcp',22],telnet:['tcp',23],icmp:['icmp',null]};
  const pr=map[kind];const r=flow(src,dst,pr[0],pr[1]);
  if(r.out==='ok'||r.out==='self-ok'){
    const isRtr=Object.values(RTRIPS).includes(dst);
    const svc=isRtr?{22:1,23:1}:SRVSVC;
    const dp=pr[1];
    if(dp!==null&&!svc[dp])return{st:'refused',r:r};
    return{st:'ok',r:r};
  }
  if(r.out==='acl-deny')return{st:'filtered',r:r};
  return{st:'no-route',r:r};
}

/* ---------- log SOC ---------- */
const SOC=[];
function soc(sev,txt){
  SOC.push({t:nowStamp(),sev:sev,txt:txt});
  if(SOC.length>120)SOC.shift();
  renderSoc();
}
function renderSoc(){
  const box=$('#socList');if(!box)return;
  box.innerHTML=SOC.map(e=>`<div class="socline ${e.sev}"><span class="t">${e.t}</span>${esc(e.txt)}</div>`).join('');
  box.scrollTop=box.scrollHeight;
}
function socProbe(srcIp,srcLbl,dst,dport,proto){
  const r=flow(srcIp,dst,proto,dport);
  const st=r.out==='ok'||r.out==='self-ok'?'ok':r.out==='acl-deny'?'filtered':'no-route';
  const sev=st==='ok'?'perm':st==='filtered'?'deny':'info';
  const tag=st==='ok'?'PERMIT':st==='filtered'?'DENY (ACL)':'—';
  const isRtr=Object.values(RTRIPS).includes(dst);
  const svc=isRtr?{22:'ssh',23:'telnet'}:SRVSVC;
  const nm=svc[dport]||dport;
  soc(sev,srcLbl+'('+srcIp+') → '+(isRtr?'R1':'SRV')+'('+dst+'):'+dport+' '+String(proto).toUpperCase()+' · '+tag);
  return st;
}

/* ---------- CLI do R1 ---------- */
const cli={mode:'user',curIf:null,curNacl:null,hist:[],hi:null};
function promptStr(){const h=save.rtr.hostname;
  if(cli.mode==='user')return h+'>';
  if(cli.mode==='priv')return h+'#';
  if(cli.mode==='conf')return h+'(config)#';
  if(cli.mode==='conf-if')return h+'(config-if)#';
  if(cli.mode==='conf-line')return h+'(config-line)#';
  return h+'(config-ext-nacl)#';}
function specTxt(a,w){if(w==='0.0.0.0')return 'host '+a;if(a==='0.0.0.0'&&w==='255.255.255.255')return 'any';return a+' '+w;}
function lineText(l){let s=l.action+' '+l.proto+' '+specTxt(l.src,l.swc);
  s+=' '+specTxt(l.dst,l.swd);
  if(l.port)s+=' eq '+l.port;return s;}
function helpFor(line,out){
  const t=line.replace('?','').trim().toLowerCase();const first=t.split(/\s+/)[0];
  if(first==='access-list'&&cli.mode==='conf'){
    out.push(['<1-99>      IP standard access list','dim']);
    out.push(['<100-199>   IP extended access list','dim']);return;}
  const ctx={
    user:['enable','ping <ip>','exit'],
    priv:['configure terminal','show access-lists','show ip interface brief','show running-config','show ip interface g0/x','ping <ip>','write memory','disable'],
    conf:['hostname <nome>','interface g0/0|g0/1|g0/2','access-list 100-199 permit|deny ...','ip access-list extended <NOME>','no access-list <num>','line vty 0 4','do show ...','end'],
    'conf-if':['ip address <ip> <máscara>','no shutdown','shutdown','ip access-group <num|nome> <in|out>','no ip access-group ...','do show ...','end'],
    'conf-line':['access-class <num|nome> in','transport input ssh|telnet|all','do show ...','end'],
    nacl:['permit|deny <ip|tcp|udp|icmp> <origem> <destino> [eq porta]','no <sequência>','exit','end']
  }[cli.mode];
  out.push(['Comandos neste modo:','dim']);
  (ctx||[]).forEach(c=>out.push(['  '+c,'dim']));
}
function doShow(a,P){
  const c=(a[0]||'').toLowerCase();
  if(c==='access-lists'||c==='access-list'){
    let any=false;
    const dump=(title,list)=>{if(!list||!list.length)return;any=true;
      P('Extended IP access list '+title,'ok');
      list.forEach(l=>P('    '+l.seq+' '+lineText(l)+(l.hits?' ('+l.hits+' match'+(l.hits>1?'es':'')+')':'')));};
    Object.keys(save.rtr.num).forEach(k=>dump(k,save.rtr.num[k]));
    Object.keys(save.rtr.named).forEach(k=>dump(k,save.rtr.named[k]));
    if(!any)P('(nenhuma ACL configurada)','wrn');return;}
  if(c==='ip'&&a[1]==='brief'){
    P('Interface              IP-Address      OK? Method Status                Protocol');
    ['g0/0','g0/1','g0/2'].forEach(n=>{const IF=save.rtr.ifaces[n];
      P(pad(n.toUpperCase().replace('G','GigabitEthernet'),22)+pad(IF.ip||'unassigned',16)+'YES manual '+
        pad(IF.up?'up':'administratively down',22)+(IF.up?'up':'down'));});return;}
  if(c==='ip'&&a[1]==='interface'){
    const list=a[2]?[normIf(a[2])]:['g0/0','g0/1','g0/2'];
    if(a[2]&&!list[0]){P('% Invalid interface','err');return;}
    list.forEach(n=>{const IF=save.rtr.ifaces[n];
      P(n.toUpperCase().replace('G','GigabitEthernet')+' is '+(IF.up?'up':'administratively down')+', line protocol is '+(IF.up?'up':'down'));
      P('  Internet address is '+(IF.ip?IF.ip+'/'+maskCidr(IF.mask):'não configurada'));
      P('  Outgoing access list is '+(IF.aclOut||'not set'));
      P('  Inbound access list is '+(IF.aclIn||'not set'));});return;}
  if(c==='run'||c==='running-config'){
    P('Building configuration...');P('!');P('hostname '+save.rtr.hostname);P('!');
    ['g0/0','g0/1','g0/2'].forEach(n=>{const IF=save.rtr.ifaces[n];
      P('interface '+n.toUpperCase().replace('G','GigabitEthernet'));
      if(IF.ip)P(' ip address '+IF.ip+' '+IF.mask);
      P(' '+(IF.up?'no shutdown':'shutdown'));
      if(IF.aclIn)P(' ip access-group '+IF.aclIn+' in');
      if(IF.aclOut)P(' ip access-group '+IF.aclOut+' out');P('!');});
    Object.keys(save.rtr.num).forEach(k=>save.rtr.num[k].forEach(l=>P('access-list '+k+' '+lineText(l))));
    Object.keys(save.rtr.named).forEach(k=>{P('ip access-list extended '+k);
      save.rtr.named[k].forEach(l=>P(' '+lineText(l)));});
    P('line vty 0 4');
    if(save.rtr.vty.acl)P(' access-class '+save.rtr.vty.acl+' in');
    if(save.rtr.vty.trans)P(' transport input '+save.rtr.vty.trans);
    P('!');P('end');return;}
  if(c==='version'){P('Cisco IOS Software, ISR Software (Operação Portaria BT), Version 15.1','dim');return;}
  P('% Uso: show access-lists · show ip interface brief · show ip interface [g0/x] · show running-config','dim');
}
function routerPingCmd(ip){const out=[];const P=(t,c)=>out.push([t,c||'']);
  if(!ip||!isIp(ip)){P('% Uso: ping <endereço IP>','wrn');return out;}
  P('Type escape sequence to abort.');
  P('Sending 5, 100-byte ICMP Echos to '+ip+', timeout is 2 seconds:');
  const eg=ifaceOf(ip);
  let r='no-route';
  if(eg){const src=save.rtr.ifaces[eg].ip;
    const b=save.rtr.ifaces[eg].aclOut?aclCheck(save.rtr.ifaces[eg].aclOut,{src:src,dst:ip,proto:'icmp',dport:null}):null;
    r=(b&&b.action==='deny')?'acl-deny':'ok';}
  if(r==='ok'){P('!!!!!','ok');P('Success rate is 100 percent (5/5)','ok');}
  else{P('.....','err');P('Success rate is 0 percent (0/5)'+(r==='acl-deny'?' — filtrado por ACL':''),'err');}
  persist();return out;}
function cmdNumberedAcl(t,P){
  const n=t[1];
  if(!n||isNaN(+n)){P('% Uso: access-list <100-199> permit|deny <ip|tcp|udp|icmp> <origem> <destino> [eq porta]','err');return;}
  if(+n<100){P('% ACL PADRÃO (1-99) filtra apenas a origem. Esta política exige ACL ESTENDIDA: use 100-199.','wrn');return;}
  const action=(t[2]||'').toLowerCase();
  if(!['permit','deny'].includes(action)){P('% Uso: access-list <num> permit|deny <ip|tcp|udp|icmp> <origem> <destino> [eq porta]','err');return;}
  const r=parseExtLine(t.slice(3));if(r.err){P('% '+r.err,'err');return;}
  const list=save.rtr.num[n]=save.rtr.num[n]||[];
  const line=r.line;line.seq=list.length?list[list.length-1].seq+10:10;line.action=action;line.hits=0;
  list.push(line);persist();
}
function execCli(raw){
  const out=[];const P=(t,c)=>out.push([t,c||'']);
  const line=raw.trim();if(!line)return out;
  const t=line.split(/\s+/);const c0=t[0].toLowerCase();
  if(line.endsWith('?')){helpFor(line,out);return out;}
  if(cli.mode==='user'){
    if(c0==='enable'){cli.mode='priv';return out;}
    if(c0==='ping')return routerPingCmd(t[1]);
    if(c0==='exit'||c0==='logout')return out;
    P('% Invalid input. Digite "enable".','wrn');return out;}
  if(cli.mode==='priv'){
    if(c0==='enable')return out;
    if(['conf','config','configure'].includes(c0)&&(!t[1]||['terminal','t'].includes((t[1]||'').toLowerCase()))){cli.mode='conf';return out;}
    if(c0==='disable'){cli.mode='user';return out;}
    if(c0==='show'){doShow(t.slice(1),P);return out;}
    if(c0==='ping')return routerPingCmd(t[1]);
    if(c0==='write'||c0==='wr'){P('Building configuration...');P('[OK]','ok');return out;}
    P('% Invalid input. Digite "?" para ajuda.','err');return out;}
  if(cli.mode==='conf'){
    if(c0==='hostname'){if(!t[1]){P('% Informe o nome','err');return out;}save.rtr.hostname=t[1];persist();return out;}
    if(c0==='interface'||c0==='int'){const n=normIf(t.slice(1).join(' '));
      if(!n){P('% Invalid interface — use g0/0, g0/1 ou g0/2','err');return out;}
      cli.mode='conf-if';cli.curIf=n;return out;}
    if(c0==='access-list'){cmdNumberedAcl(t,P);return out;}
    if(c0==='no'&&t[1]==='access-list'){delete save.rtr.num[t[2]];persist();return out;}
    if(c0==='ip'&&t[1]==='access-list'&&t[2]==='extended'){
      const nm=t[3];if(!nm){P('% Informe o nome da ACL','err');return out;}
      save.rtr.named[nm]=save.rtr.named[nm]||[];cli.mode='nacl';cli.curNacl=nm;persist();return out;}
    if(c0==='no'&&t[1]==='ip'&&t[2]==='access-list'&&t[3]==='extended'){delete save.rtr.named[t[4]];persist();return out;}
    if(c0==='line'&&t[1]==='vty'){cli.mode='conf-line';return out;}
    if(c0==='do'){doShow(t.slice(2),P);return out;}
    if(c0==='end'||c0==='exit'){cli.mode='priv';return out;}
    if(c0==='write'||c0==='wr'){P('Building configuration...');P('[OK]','ok');return out;}
    P('% Invalid input. Digite "?" para ajuda.','err');return out;}
  if(cli.mode==='conf-if'){
    const IF=save.rtr.ifaces[cli.curIf];
    if(c0==='ip'&&t[1]==='address'){
      if(!isIp(t[2])||!isIp(t[3])){P('% IP/máscara inválidos (máscara dotted, ex.: 255.255.255.224)','err');return out;}
      IF.ip=t[2];IF.mask=t[3];persist();return out;}
    if(c0==='no'&&t[1]==='shutdown'){IF.up=true;persist();return out;}
    if(c0==='shutdown'){IF.up=false;persist();return out;}
    if(c0==='ip'&&t[1]==='access-group'){
      const id=t[2],dir=(t[3]||'out').toLowerCase();
      if(!id||(dir!=='in'&&dir!=='out')){P('% Uso: ip access-group <número|nome> <in|out>','err');return out;}
      IF[dir==='in'?'aclIn':'aclOut']=id;
      if(!getList(id))P('% Aviso: a ACL "'+id+'" ainda não existe — será efetiva quando criada.','wrn');
      persist();return out;}
    if(c0==='no'&&t[1]==='ip'&&t[2]==='access-group'){
      if(t[3]==='in')IF.aclIn=null;else if(t[3]==='out')IF.aclOut=null;else{IF.aclIn=null;IF.aclOut=null;}
      persist();return out;}
    if(c0==='description')return out;
    if(c0==='exit'){cli.mode='conf';return out;}
    if(c0==='end'){cli.mode='priv';return out;}
    if(c0==='do'){doShow(t.slice(2),P);return out;}
    P('% Invalid input. Digite "?" para ajuda.','err');return out;}
  if(cli.mode==='conf-line'){
    if(c0==='access-class'&&t[1]&&(t[2]||'in')==='in'){
      save.rtr.vty.acl=t[1];
      if(!getList(t[1]))P('% Aviso: a ACL "'+t[1]+'" ainda não existe.','wrn');
      persist();return out;}
    if(c0==='transport'&&t[1]==='input'){
      const v=(t[2]||'').toLowerCase();
      if(['ssh','telnet','all'].includes(v)){save.rtr.vty.trans=v==='all'?null:v;persist();return out;}
      P('% Uso: transport input ssh | telnet | all','err');return out;}
    if(c0==='exit'){cli.mode='conf';return out;}
    if(c0==='end'){cli.mode='priv';return out;}
    if(c0==='do'){doShow(t.slice(2),P);return out;}
    P('% Invalid input. Digite "?" para ajuda.','err');return out;}
  if(cli.mode==='nacl'){
    if((c0==='permit'||c0==='deny')&&t[1]){
      const r=parseExtLine(t.slice(1));if(r.err){P('% '+r.err,'err');return out;}
      const list=save.rtr.named[cli.curNacl];
      const line=r.line;line.seq=list.length?list[list.length-1].seq+10:10;line.action=c0;line.hits=0;
      list.push(line);persist();return out;}
    if(c0==='no'){
      const n=parseInt(t[1]);
      if(!isNaN(n)&&t.length===2){save.rtr.named[cli.curNacl]=save.rtr.named[cli.curNacl].filter(l=>l.seq!==n);persist();return out;}}
    if(c0==='exit'){cli.mode='conf';return out;}
    if(c0==='end'){cli.mode='priv';return out;}
    if(c0==='do'){doShow(t.slice(2),P);return out;}
    P('% Invalid input. Digite "?" para ajuda.','err');return out;}
  return out;
}
function cliRun(raw){
  const line=raw.trim();
  const entry=[[promptStr()+(line?' ':'')+(line||''),'cmd']];
  if(line)execCli(line).forEach(l=>entry.push(l));
  save.cliLog=save.cliLog||[];
  save.cliLog.push.apply(save.cliLog,entry);
  if(save.cliLog.length>180)save.cliLog=save.cliLog.slice(-180);
  persist();
  const out=$('#cliOut');
  if(out){out.innerHTML=save.cliLog.map(l=>`<div class="ln ${l[1]||''}">${esc(l[0])}</div>`).join('');out.scrollTop=out.scrollHeight;}
  const p=$('#cliPrompt');if(p)p.textContent=promptStr();
}

/* ---------- terminais das estações ---------- */
function macOf(ip){const o=ip.split('.').slice(2).map(x=>(+x).toString(16).padStart(2,'0')).join('');return '0001.42'+o.slice(0,6);}
function arpAdd(dev,ip){save.arp[dev]=save.arp[dev]||{};save.arp[dev][ip]=macOf(ip);}
function pingOut(dev,ip){
  const me=HOSTS[dev];const out=[];
  const r=flow(me.ip,ip,'icmp',null);
  if(r.out==='ok'||r.out==='self-ok'){
    for(let i=0;i<4;i++)out.push(['Resposta de '+ip+': bytes=32 tempo<1ms TTL=127','ok']);
    out.push(['(4/4 recebidos)','dim']);
    if(ip===me.gw){arpAdd(dev,ip);reveal('r1');}
  }else if(r.out==='acl-deny'&&r.stage==='req'){
    for(let i=0;i<4;i++)out.push(['Resposta de '+me.gw+': Host de destino inacessível.','err']);
    out.push(['(0/4 — pacote FILTRADO pela ACL do R1)','err']);
    soc('deny',me.lbl+'('+me.ip+') → '+ip+' ICMP · DENY (ACL)');
  }else if(r.out==='acl-deny'){
    for(let i=0;i<4;i++)out.push(['Esgotado o tempo limite da solicitação.','err']);
    out.push(['(0/4 — a requisição saiu, mas a RESPOSTA foi descartada no caminho de volta)','wrn']);
  }else{
    out.push(['Host inacessível (sem rota — verifique o gateway).','err']);
  }
  return out;
}
function scanPortsFor(ip){
  if(Object.values(RTRIPS).includes(ip))return[[22,'ssh'],[23,'telnet']];
  if(ip===SRVIP)return[[21,'ftp'],[22,'ssh'],[23,'telnet'],[25,'smtp'],[53,'domain'],[80,'http'],[110,'pop3'],[443,'https']];
  return[];
}
function scanOut(dev,arg){
  const me=HOSTS[dev];const out=[];
  if(!arg){out.push(['Uso: scan <ip>  |  scan <rede/cidr>  (ex.: scan 172.22.34.62 · scan 172.22.34.64/27)','wrn']);return out;}
  const cidr=arg.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/);
  let targets=[];
  if(cidr){
    const base=cidr[1];let found=[];
    if(base==='172.22.34.0'&&+cidr[2]===26){found=[['172.22.34.1','gateway'],['172.22.34.62','servidor']];reveal('srv');}
    else if(base==='172.22.34.64'&&+cidr[2]===27){found=[['172.22.34.65','gateway'],['172.22.34.66','estação'],['172.22.34.70','câmera IP · firmware desatualizado']];reveal('pc1');reveal('cam');}
    else if(base==='172.22.34.96'&&+cidr[2]===28){found=[['172.22.34.97','gateway'],['172.22.34.98','estação'],['172.22.34.100','estação admin']];reveal('pc2');reveal('admin');}
    if(!found.length){out.push(['Nenhum host respondeu na rede '+arg+'.','err']);return out;}
    out.push(['Varredura de '+arg+' — '+found.length+' host(s) responderam ao ICMP:','dim']);
    targets=found;
  }else{
    if(!isIp(arg)){out.push(['Endereço inválido.','err']);return out;}
    targets=[[arg,'']];
  }
  targets.forEach(tg=>{
    const ip=tg[0],note=tg[1];
    const alive=flow(me.ip,ip,'icmp',null).out==='ok';
    if(!alive){out.push([' '+ip+'  — sem resposta (filtrado ou inativo)','err']);return;}
    out.push([' '+ip+(note?'  '+note:''),'ok']);
    const ports=scanPortsFor(ip);
    if(!ports.length){out.push(['   nenhuma porta de serviço conhecida (estação de trabalho)','dim']);return;}
    ports.forEach(pt=>{
      const num=pt[0],nm=pt[1];
      const r=flow(me.ip,ip,'tcp',num);
      const open=r.out==='ok'||r.out==='self-ok';
      const isRtr=Object.values(RTRIPS).includes(ip);
      const svc=isRtr?{22:1,23:1}:SRVSVC;
      const state=!open?'FILTRADO':svc[num]?'ABERTO':'fechado';
      const cls=!open?'err':svc[num]?'ok':'dim';
      out.push(['   '+String(num).padStart(3)+'/tcp  '+nm.padEnd(9)+'  '+state,cls]);
      soc(!open?'deny':svc[num]?'perm':'info',me.lbl+'('+me.ip+') → '+ip+':'+num+' '+nm.toUpperCase()+' · '+(!open?'DENY (ACL)':svc[num]?'PERMIT':'closed'));
    });
  });
  return out;
}
function pcExec(dev,raw){
  const out=[];const P=(t,c)=>out.push([t,c||'']);
  const line=raw.trim();
  if(!line){pushPc(dev,out);return;}
  P(dev+'> '+line,'cmd');
  const t=line.split(/\s+/);const c=t[0].toLowerCase();const a=(t[1]||'').toLowerCase();
  const me=HOSTS[dev];
  if(dev==='CAM')reveal('cam');
  if(c==='help'){
    P('Comandos: ipconfig · arp -a · ping <ip> · tracert <ip> · scan <ip|rede/cidr>','dim');
    P('          ssh <ip> · telnet <ip> · ftp <ip> · browser <ip|nome> · nslookup <nome> · clear','dim');
  }
  else if(c==='clear'){save.pcLog[dev]=[];persist();pushPc(dev,out);return;}
  else if(c==='ipconfig'){
    P('Configuração IP de '+me.lbl+':','dim');
    P('   IPv4 . . . . . . . : '+me.ip);P('   Máscara  . . . . . : '+me.mask);
    P('   Gateway  . . . . . : '+me.gw);
    reveal(dev==='PC1'?'pc1':dev==='PC2'?'pc2':dev==='ADMIN'?'admin':'cam');
  }
  else if(c==='arp'){
    if(a==='-a'){
      const en=Object.entries(save.arp[dev]||{});
      if(!en.length)P('Tabela ARP vazia — faça ping nos vizinhos primeiro.','dim');
      else{P('  Internet Address      Physical Address','dim');
        en.forEach(e=>P('  '+pad(e[0],22)+e[1]+'  (dinâmico)'));}
    }else P('Uso: arp -a','wrn');
  }
  else if(c==='ping'){
    if(!isIp(a))P('Uso: ping <endereço IP>','wrn');
    else{P('Executando ping '+a+' com 32 bytes de dados:');
      pingOut(dev,a).forEach(x=>out.push(x));}
  }
  else if(c==='tracert'){
    if(!isIp(a))P('Uso: tracert <endereço IP>','wrn');
    else{
      P('Traçando rota para '+a+' — 30 saltos no máximo:');
      if(a===me.ip){P('  1    <1 ms   '+a+'  (este host)','ok');pushPc(dev,out);return;}
      const gwAlive=flow(me.ip,me.gw,'icmp',null).out==='ok';
      if(!gwAlive){P('  1     *        *        *     Solicitação esgotada.','err');pushPc(dev,out);return;}
      P('  1    <1 ms   '+me.gw+'  (gateway)','ok');
      arpAdd(dev,me.gw);reveal('r1');
      if(Object.values(RTRIPS).includes(a)){P('  2    <1 ms   '+a+'  (R1 — destino é o próprio roteador)','ok');pushPc(dev,out);return;}
      if(ifaceOf(a)&&ifaceOf(a)===ifaceOf(me.ip)){P('  2    <1 ms   '+a+'  (mesma rede local)','ok');pushPc(dev,out);return;}
      const r=flow(me.ip,a,'icmp',null);
      if(r.out==='ok'){P('  2    <1 ms   '+a+'  (destino)','ok');if(a===SRVIP)reveal('srv');}
      else P('  2     *        *        *     Solicitação esgotada.'+(r.out==='acl-deny'?'  [pacote filtrado pela ACL]':''),'err');
    }
  }
  else if(c==='scan'){scanOut(dev,t.slice(1).join(' ')).forEach(x=>out.push(x));}
  else if(c==='nslookup'){
    const nm=t[1];
    if(!nm)P('Uso: nslookup <nome>','wrn');
    else{P('Servidor padrão: filesrv.orion.local ('+SRVIP+')','dim');
      const st=probe(me.ip,SRVIP,'dns');
      if(st.st!=='ok')P('*** A consulta DNS foi FILTRADA pela ACL (udp/53).','err');
      else if(!DNSNAMES[nm])P('*** '+nm+': não existe registro.','err');
      else{P('Nome:    '+nm);P('Address: '+DNSNAMES[nm],'cy');

  else if(c==='browser'){

        soc('deny',me.lbl+'('+me.ip+') → '+ip+':80 HTTP · DENY (ACL)');}

  else if(c==='ssh'||c==='telnet'){

      const st=probe(me.ip,a,c);
      if(st.st==='ok'){

      }else if(st.st==='filtered'){
        P('% Conexão recusada: pacote descartado pela ACL do R1'+(st.r.why?' ('+st.r.why+')':'')+'.','err');
        soc('deny',me.lbl+'('+me.ip+') → '+a+':'+(c==='ssh'?22:23)+' '+c.toUpperCase()+' · DENY (ACL)');
      }else if(st.st==='refused'){
        P('% Conexão recusada pela aplicação — o destino não executa '+c+'.','wrn');
      }else P('% Tempo esgotado (sem rota).','err');
    }
  }
  else if(c==='ftp'){

function wireMission(m){
  document.querySelectorAll('#mwrap .copy').forEach(b=>b.onclick=()=>{

      const qi=+btn.dataset.q,oi=+btn.dataset.o,q=m.quiz[qi];

      if(st[qi]===q.a)return;
      if(oi===q.a){st[qi]=oi;snd.ok();toast('Correto','ok');persist();renderMission();}
      else{btn.classList.add('bad');snd.err();setTimeout(()=>btn.classList.remove('bad'),500);}};});
  document.querySelectorAll('#mwrap .pair select').forEach(sel=>{
    sel.onchange=()=>{
      const pi=+sel.dataset.p,v=sel.value===''?null:+sel.value,p=m.pairs[pi];

      else{sel.style.borderColor='var(--bad)';snd.err();setTimeout(()=>sel.style.borderColor='',600);}};});
  document.querySelectorAll('#mwrap .tsk').forEach(btn=>{
    btn.onclick=()=>{
      const ti=+btn.dataset.t;

      st[ti]=!st[ti];snd.click();persist();renderMission();};});
  const dt=$('#diagText');if(dt)dt.oninput=()=>{save.diag=dt.value;persist();};
  if(m.discovery){
    document.querySelectorAll('#mwrap .drow .chk').forEach(b=>b.onclick=()=>{
      const k=b.dataset.d,inp=document.querySelector('#mwrap input[data-d="'+k+'"]');
      const fn=DISC_FIELDS.find(f=>f[0]===k)[2];
      if(fn(inp.value||'')){save.disc[k]=true;persist();snd.ok();toast('Constatação registrada','ok');
        if(k==='net')reveal('pc1');if(k==='gw')reveal('r1');if(k==='srv')reveal('srv');
        renderMission();}
      else{snd.err();inp.style.borderColor='var(--bad)';setTimeout(()=>inp.style.borderColor='',700);
        toast('Não confere — investigue mais (ipconfig / ping / tracert / scan)','err');}});
  }
  if(m.ios){
    const out=$('#cliOut');
    out.innerHTML=save.cliLog.map(l=>`<div class="ln ${l[1]||''}">${esc(l[0])}</div>`).join('');out.scrollTop=out.scrollHeight;
    $('#cliPrompt').textContent=promptStr();
    document.querySelectorAll('#mwrap .ccmd').forEach(b=>b.onclick=()=>cliRun(b.dataset.c));
    const inp=$('#cliIn');
    inp.onkeydown=e=>{
      if(e.key==='Enter'){const v=inp.value;inp.value='';cli.hi=null;cliRun(v);}
      else if(e.key==='ArrowUp'){cli.hi=cli.hi==null?cli.hist.length:cli.hi;cli.hi=Math.max(0,cli.hi-1);inp.value=cli.hist[cli.hi]||'';e.preventDefault();}
      else if(e.key==='ArrowDown'){if(cli.hi!=null){cli.hi=Math.min(cli.hist.length,cli.hi+1);inp.value=cli.hist[cli.hi]||''}}};
    $('#cliClear').onclick=()=>{save.cliLog=[];persist();renderMission();};
    $('#cliReset').onclick=()=>{save.rtr=newRtr();save.cliLog=[];save.sr={};persist();renderMission();toast('R1 do simulador zerado (interfaces pré-configuradas)','ok');};
  }
  if(m.pcs){
    const sel=$('#pcSel');
    const camOpt=sel.querySelector('option[value="CAM"]');

    pcQuick();

  }
  if(m.suite){
    $('#suiteAll').onclick=()=>{
      SUITES[m.suite].rows.forEach(r=>runRow(m.suite,r));
      if(suiteAllPass(m.suite)){
        snd.ok();toast('Bateria 100% — política validada','ok');
        if(m.suite==='sf'&&save.finPlanted&&!save.finSolved){
          save.finSolved=true;persist();
          soc('perm','■ PROVA DE FOGO: bateria FINAL 100% — anomalia neutralizada.');
        }
      }else{snd.err();toast('Há divergências — investigue com show run / show access-lists','err');}
      updateHud();renderMission();};
  }
  const i70=$('#inc70');
  if(i70)i70.onclick=()=>{i70.disabled=true;playIncident70(()=>renderMission());};
  const i71=$('#inc71');
  if(i71)i71.onclick=()=>{i71.disabled=true;playIncident71(()=>renderMission());};
  const fs=$('#finStart');
  if(fs)fs.onclick=()=>{
    const f=FINF[Math.floor(Math.random()*FINF.length)];
    f.plant();
    save.finPlanted={id:f.id,hint:f.hint};save.finSolved=false;
    save.sr['sf']={};
    persist();snd.alarm();
    soc('crit','■ PROVA DE FOGO iniciada · anomalia do turno anterior ativa — bom diagnóstico.');
    renderMission();};
  $('#valBtn').onclick=()=>validate(m);
}
function validate(m){
  if(save.done.includes(m.id))return;
  if(m.code==='M-10'&&!save.finPlanted){toast('Inicie a prova de fogo primeiro','err');snd.err();return;}
  const miss=[];
  if(m.discovery&&!discDone())miss.push('formulário de descoberta completo');
  if(m.quiz&&!quizSolved(m))miss.push('perguntas respondidas corretamente');
  if(m.pairs&&!pairsSolved(m))miss.push('quadro de conceitos completo');
  if(m.suite&&!suiteAllPass(m.suite))miss.push('bateria 100% verde');
  if(m.tasks&&m.tasks.length&&!tasksDone(m))miss.push('checklist completo');
  if(m.code==='M-10'&&!save.finSolved)miss.push('bateria FINAL verde após correção');
  if(miss.length){snd.err();toast('Falta: '+miss.join(' · '),'err');return;}
  save.done.push(m.id);save.xp+=m.xp;
  if(!save.tEnd)save.tEnd=Date.now();
  soc('perm','■ '+m.log);
  toast('+'+m.xp+' XP — '+m.code+' validada','ok');snd.done();
  if(m.cp){stamp(m.cp);setTimeout(()=>toast(m.cp+' alcançado','ok'),700);}
  persist();updateHud();renderNav();renderMission();
  if(m.id==='m10')setTimeout(showCert,1600);
}

    if(aborted)return;
    if(i<BOOT.length){
      const d=document.createElement('span');d.className='bl';d.innerHTML=BOOT[i];
      lines.appendChild(d);snd.type();i++;
      setTimeout(next,i===BOOT.length?500:240+Math.random()*220);
    }else{
      $('#bootTitle').style.display='block';$('#bootSub').style.display='block';
      if(save.name)startApp();
      else{$('#bootForm').classList.add('on');$('#techName').focus();}
      $('#bootSkip').style.display='block';}};
  next();
  $('#bootForm').onsubmit=e=>{
    e.preventDefault();
    const v=$('#techName').value.trim();
    if(!v){toast('Identifique-se para assinar o termo','err');return;}
    save.name=v;save.t0=save.t0||Date.now();persist();snd.ok();startApp();};
  $('#bootSkip').onclick=()=>{
    aborted=true;
    if(!save.name){save.name='Analista';save.t0=save.t0||Date.now();persist();}
    startApp();};
}

<tr><td>ACL 120 (g0/1 in)</td><td><code>permit tcp host .100 host .62 eq ftp / eq 22 · deny tcp host .98 host .62 eq ftp / eq 22 · permit tcp 172.22.34.96 0.0.0.15 host .62 eq www / 443 · permit udp ... domain · deny ... ftp · permit ip any any</code></td></tr>

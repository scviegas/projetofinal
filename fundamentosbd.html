{num:1,tab:"SGBD & Docker",title:"Sistemas de Gerenciamento de Bancos de Dados",week:"Semana 1",
goals:["Diferenciar banco de dados de sistema de arquivos","Reconhecer as vantagens e componentes de um SGBD","Identificar as linguagens do SQL","Subir o MySQL em container Docker"],
summary:["<b>Banco de Dados (BD)</b>: coleção organizada de dados relacionados, com integridade e acesso controlado.",
"<b>SGBD</b>: software que define, armazena, consulta e protege os dados (MySQL, PostgreSQL, Oracle, MongoDB).",
"<b>BD × Sistema de Arquivos</b>: o SGBD reduz redundância e inconsistência e garante integridade, segurança, concorrência e recuperação (backup).",
"<b>Metadados</b>: dados sobre os dados (ex.: estrutura das tabelas). <b>Esquema</b>: o projeto/estrutura; <b>Instância</b>: os dados num instante.",
"<b>Linguagens</b>: <code>DDL</code> (CREATE, ALTER, DROP) • <code>DML</code> (INSERT, UPDATE, DELETE) • <code>DQL</code> (SELECT) • <code>DCL</code> (GRANT, REVOKE) • <code>TCL</code> (COMMIT, ROLLBACK).",
"<b>Usuários</b>: administrador (DBA), projetista, desenvolvedor e usuário final.",
"<b>Docker</b>: executa o MySQL em containers isolados: <code>docker run --name meu-mysql -e MYSQL_ROOT_PASSWORD=senha -d mysql</code>."],
activities:[
{type:"quiz",q:"Um SGBD (Sistema de Gerenciamento de Banco de Dados) é...",options:["Um software que permite definir, criar, consultar e administrar bancos de dados","Um hardware dedicado ao armazenamento de arquivos","Uma linguagem de programação orientada a objetos","Um sistema operacional para servidores"],answer:0,explain:"O SGBD é a camada de software (MySQL, PostgreSQL, Oracle...) entre os dados e os usuários/aplicações."},
{type:"quiz",q:"Qual é a principal vantagem de um SGBD sobre armazenar dados apenas em arquivos?",options:["Arquivos são mais rápidos para consultas","Controle de redundância, integridade, segurança e acesso concorrente aos dados","O SGBD elimina a necessidade de backup","Arquivos não permitem gravar dados"],answer:1,explain:"O SGBD centraliza os dados garantindo integridade, segurança, concorrência e recuperação."},
{type:"quiz",q:"Metadados são...",options:["Dados duplicados no banco","Dados sobre os próprios dados — como a estrutura das tabelas","Backups automáticos","Registros apagados"],answer:1,explain:"Metadados descrevem a estrutura do banco: nomes de tabelas, tipos de colunas, restrições."},
{type:"quiz",q:"Qual categoria do SQL é usada para DEFINIR a estrutura de tabelas?",options:["DML","DQL","DDL","TCL"],answer:2,explain:"DDL = CREATE, ALTER, DROP. DML manipula dados, DQL consulta (SELECT), DCL concede permissões."},

{type:"quiz",q:"No contexto do curso, o Docker é utilizado para...",options:["Editar diagramas ER","Executar o MySQL e outros SGBDs em containers isolados e padronizados","Compilar consultas SQL","Normalizar tabelas automaticamente"],answer:1,explain:"Containers garantem o mesmo ambiente em qualquer máquina, sem instalar o MySQL direto no sistema."},
{type:"quiz",q:"Qual comando cria e inicia um container MySQL chamado 'meu-mysql' com senha root definida?",options:["mysql start meu-mysql","docker build mysql","docker run --name meu-mysql -e MYSQL_ROOT_PASSWORD=senha123 -d mysql","run mysql --container meu-mysql"],answer:2,explain:"docker run cria o container; -e define variável de ambiente; -d executa em segundo plano; mysql é a imagem."},

{num:2,tab:"Modelo ER",title:"O Modelo Relacional e a Modelagem Entidade-Relacionamento",week:"Semana 2",

summary:["<b>Entidade</b>: objeto do mundo real sobre o qual guardamos dados (Cliente, Produto). <b>Atributo</b>: propriedade da entidade (nome, preço).",
"<b>Chave primária (PK)</b>: identifica unicamente cada tupla (linha). <b>Chave candidata</b>: alternativa única. <b>Chave estrangeira (FK)</b>: referencia a PK de outra tabela.",

"Ferramentas para desenhar diagramas ER: <b>Lucidchart</b> e <b>Draw.io</b>."],
activities:[

{type:"quiz",q:"A chave primária (PK) serve para...",options:["Criptografar os dados","Identificar unicamente cada linha/tupla da tabela","Ordenar automaticamente a tabela","Acelerar a internet"],answer:1,explain:"PK não admite valores repetidos nem nulos."},
{type:"quiz",q:"A chave estrangeira (FK) tem a função de...",options:["Gerar senhas","Referenciar a chave primária de outra tabela, criando o relacionamento","Substituir a chave primária","Apagar dados em cascata sempre"],answer:1,explain:"Ex.: pedidos.id_cliente referencia clientes.id_cliente."},
{type:"quiz",q:"'Um cliente pode fazer vários pedidos, mas cada pedido pertence a um único cliente'. Cardinalidade:",options:["1:1","1:N","N:M","0:0"],answer:1,explain:"Um-para-muitos: a FK fica no lado N (em pedidos)."},
{type:"quiz",q:"Em um relacionamento N:M (ex.: alunos e disciplinas), como implementar no modelo relacional?",options:["Guardar tudo numa única coluna","Criar uma tabela intermediária (associativa) com FKs das duas entidades","Não é possível implementar","Usar apenas uma chave primária dupla"],answer:1,explain:"Ex.: matriculas(id_aluno FK, id_disciplina FK)."},
{type:"quiz",q:"O endereço dividido em rua, número e cidade é um exemplo de atributo...",options:["Simples","Multivalorado","Composto","Derivado"],answer:2,explain:"Composto = divisível em partes. Multivalorado seria, ex., uma lista de telefones."},
{type:"quiz",q:"Quais ferramentas citadas no material servem para desenhar diagramas ER on-line?",options:["Lucidchart e Draw.io","Photoshop e Illustrator","Excel e PowerPoint","VS Code e Git"],answer:0,explain:"Ambas permitem representar entidades, atributos, chaves e relacionamentos graficamente."},

{num:3,tab:"SQL Básico 1",title:"SQL Básico 1 — Criação e Formas Normais",week:"Semana 3",

{num:4,tab:"Normalização",title:"Normalização, Usuários e Permissões",week:"Semana 4",

summary:["A normalização <b>elimina redundâncias</b> e evita <b>anomalias</b> de inserção, atualização e exclusão.",

"Revogar permissão: <code>REVOKE ...</code> • Remover usuário: <code>DROP USER</code>.",
"Inserir dados: <code>INSERT INTO tabela (colunas) VALUES (valores);</code>",

{num:5,tab:"SQL Consultas",title:"SQL Básico 2 — SELECT, Agregações e GROUP BY",week:"Semana 5",
goals:["Praticar consultas com SELECT, WHERE, LIKE, BETWEEN, IN, ORDER BY","Usar funções de agregação: COUNT, SUM, AVG, MAX, MIN","Agrupar resultados com GROUP BY e filtrar grupos com HAVING"],
summary:["<code>SELECT colunas FROM tabela WHERE condição ORDER BY coluna ASC|DESC LIMIT n;</code>",
"Operadores: <code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>&gt;</code>, <code>BETWEEN a AND b</code>, <code>IN (lista)</code>, <code>LIKE</code>, <code>AND/OR</code>.",
"<code>LIKE 'S%'</code> = começa com S • <code>'%a'</code> = termina com a • <code>'_a%'</code> = segunda letra 'a'.",
"<code>DISTINCT</code> elimina duplicatas.",
"<b>Agregações</b>: <code>COUNT(*)</code> (conta linhas), <code>SUM</code> (soma), <code>AVG</code> (média), <code>MAX</code>/<code>MIN</code> (maior/menor).",
"<b>GROUP BY</b>: agrupa linhas com o mesmo valor para agregar por grupo (ex.: clientes por cidade).",

{num:6,tab:"Álgebra + DML",title:"Álgebra Relacional e Atualização/Exclusão (UPDATE, DELETE)",week:"Semana 6",
goals:["Relacionar operações da álgebra relacional ao SQL","Praticar consultas de atualização e exclusão","Evitar comandos perigosos sem WHERE"],
summary:["<b>σ (seleção)</b>: filtra <b>linhas</b> → cláusula <code>WHERE</code>.",
"<b>π (projeção)</b>: escolhe <b>colunas</b> → lista após o <code>SELECT</code>.",
"<b>⋈ (junção)</b>: combina tabelas → <code>JOIN ... ON</code>. Também existem ∪ (união), ∩ (interseção), − (diferença), × (produto cartesiano) e ρ (renomeação).",
"<code>UPDATE tabela SET coluna = valor WHERE condição;</code>",
"<code>DELETE FROM tabela WHERE condição;</code>",
"⚠️ <b>UPDATE ou DELETE sem WHERE</b> afeta TODAS as linhas da tabela!"],
schema:[T_CLIENTES,T_PRODUTOS,T_PEDIDOS],
activities:[
{type:"quiz",q:"A operação σ (sigma) da álgebra relacional...",options:["Seleciona colunas","Seleciona LINHAS (tuplas) que atendem a uma condição","Junta duas tabelas","Ordena os dados"],answer:1,explain:"σ condição (Relação) equivale ao WHERE do SQL."},
{type:"quiz",q:"A operação π (pi) da álgebra relacional...",options:["Seleciona COLUNAS (atributos) da relação","Filtra linhas","Remove duplicatas do disco","Cria índices"],answer:0,explain:"π nome, cidade (CLIENTES) equivale a SELECT nome, cidade FROM clientes."},
{type:"quiz",q:"O operador ⋈ representa...",options:["União","Diferença","Junção (combine relações por um atributo comum)","Renomeação"],answer:2,explain:"Junção natural equivale ao INNER JOIN ... ON do SQL."},
{type:"quiz",q:"σ cidade = 'São Paulo' (CLIENTES) corresponde a qual cláusula SQL?",options:["SELECT","FROM","WHERE","ORDER BY"],answer:2,explain:"A seleção (σ) vira o filtro WHERE."},
{type:"sql",q:"Traduza para SQL: <code>π nome, cidade (σ idade &gt; 30 (CLIENTES))</code>",
ph:"SELECT ...;",
must:[{re:/select/i,label:"Usa SELECT (projeção π)"},{re:/nome/i,label:"Coluna nome"},{re:/cidade/i,label:"Coluna cidade"},{re:/from\s+clientes/i,label:"FROM clientes"},{re:/where/i,label:"WHERE (seleção σ)"},{re:/idade\s*>\s*30/i,label:"idade > 30"}],
hint:"π vira a lista de colunas; σ vira o WHERE.",
ok:"3 rows in set (0.00 sec)",table:{cols:["nome","cidade"],rows:[["Bruno Lima","Rio de Janeiro"],["Carla Dias","São Paulo"],["Elisa Rocha","Curitiba"]]},
sol:"SELECT nome, cidade FROM clientes WHERE idade > 30;"},

hint:"DELETE FROM tabela WHERE condição;",
ok:"Query OK, 1 row affected (0.01 sec)",sol:"DELETE FROM pedidos WHERE id_pedido = 5;"},
{type:"quiz",q:"O que acontece ao executar UPDATE produtos SET preco = 0; SEM WHERE?",options:["Nada, o MySQL bloqueia","Todos os produtos terão preço 0","Apenas o primeiro produto é alterado","O comando dá erro de sintaxe"],answer:1,explain:"Sem WHERE, o UPDATE afeta todas as linhas — cuidado redobrado!"}]},

{num:7,tab:"NoSQL",title:"Bancos de Dados NoSQL (MongoDB) — CRUD",week:"Semana 7",
goals:["Classificar os tipos de bancos NoSQL","Executar operações CRUD no MongoDB","Comparar NoSQL x Relacional"],
summary:["NoSQL surgiu para grandes volumes, alta escala e <b>schema flexível</b>. Tipos: <b>Documento</b> (MongoDB), <b>Chave-valor</b> (Redis), <b>Colunas</b> (Cassandra), <b>Grafo</b> (Neo4j).",
"MongoDB guarda <b>documentos BSON/JSON</b> dentro de <b>coleções</b>; cada documento tem um <code>_id</code> padrão.",
"CRUD Mongo: <code>insertOne()</code> • <code>find()</code> • <code>updateOne({filtro}, {$set:{...}})</code> • <code>deleteOne({filtro})</code>.",
"<b>Relacional</b>: schema rígido, JOINs, ACID, escala vertical. <b>NoSQL</b>: schema flexível, escala horizontal, consistência eventual."],
activities:[
{type:"quiz",q:"O MongoDB é um banco NoSQL orientado a...",options:["Grafos","Documentos (JSON/BSON)","Colunas largas","Chave-valor"],answer:1,explain:"Dados ficam em documentos JSON dentro de coleções."},
{type:"quiz",q:"O Redis é um banco NoSQL do tipo...",options:["Documento","Grafo","Chave-valor (extremamente rápido)","Colunas"],answer:2,explain:"Redis guarda pares chave→valor em memória (cache, sessões)."},
{type:"quiz",q:"Qual banco NoSQL é baseado em GRAFOS (nós e arestas)?",options:["Neo4j","MongoDB","Cassandra","MySQL"],answer:0,explain:"Neo4j é ideal para relacionamentos complexos: redes sociais, recomendações."},
{type:"quiz",q:"Em MongoDB, todo documento recebe por padrão um identificador chamado...",options:["id","_id","pk","uid"],answer:1,explain:"_id é gerado automaticamente (ObjectId) se não for informado."},
{type:"quiz",q:"Uma vantagem típica dos bancos NoSQL sobre os relacionais é...",options:["Schema rígido e fixo","Schema flexível e escalabilidade horizontal","JOINs mais rápidos","Garantia ACID em tudo"],answer:1,explain:"Documentos da mesma coleção podem ter estruturas diferentes."},
{type:"match",q:"Ligue cada comando SQL ao seu equivalente no MongoDB:",pairs:[{l:"INSERT INTO clientes VALUES (...)",r:"db.clientes.insertOne({...})"},{l:"SELECT * FROM clientes",r:"db.clientes.find()"},{l:"UPDATE clientes SET ... WHERE ...",r:"db.clientes.updateOne({...}, {$set:{...}})"},{l:"DELETE FROM clientes WHERE ...",r:"db.clientes.deleteOne({...})"}],explain:"CRUD: Create→insertOne, Read→find, Update→updateOne, Delete→deleteOne."},

/* ============ MOTOR ============ */
const S={done:new Set(JSON.parse(localStorage.getItem('bdSimDone')||'[]'))};
const save=()=>localStorage.setItem('bdSimDone',JSON.stringify([...S.done]));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function h(t,c,html){const e=document.createElement(t);if(c)e.className=c;if(html!=null)e.innerHTML=html;return e;}

function refreshScore(){
  const total=MODULES.reduce((n,m)=>n+m.activities.length,0);
  document.getElementById('scoreTxt').textContent=`${S.done.size}/${total} atividades • ${S.done.size*10} XP`;
  document.getElementById('bar').style.width=(S.done.size/total*100)+'%';
}
function markDone(id,card){
  if(S.done.has(id))return;
  S.done.add(id);save();refreshScore();
  if(card){card.classList.add('done');const st=card.querySelector('.pts');if(st)st.textContent='✔ concluída • 10 XP';}
}
function cardHead(type){
  const head=h('div','qhead');
  head.append(h('span','tag '+type,type==='quiz'?'Quiz':type==='sql'?'SQL Editor':'Ligar os pares'));
  head.append(h('span','pts','10 XP'));
  return head;
}
function resultTable(t){
  const tb=h('table','rt');const tr=h('tr');
  t.cols.forEach(c=>tr.append(h('th',null,esc(String(c)))));tb.append(tr);
  const body=h('tbody');
  t.rows.forEach(r=>{const row=h('tr');r.forEach(v=>row.append(h('td',null,esc(String(v)))));body.append(row);});
  tb.append(body);return tb;
}
function renderQuiz(a,id){
  const c=h('div','card');if(S.done.has(id))c.classList.add('done');
  c.append(cardHead('quiz'),h('p','q',a.q));
  const fb=h('div','fb');
  a.options.forEach((t,i)=>{
    const b=h('button','opt');b.textContent=t;
    b.onclick=()=>{
      if(i===a.answer){
        b.classList.add('ok');c.querySelectorAll('.opt').forEach(o=>o.disabled=true);
        fb.innerHTML=`<span class="check">✔ Correto!</span> ${a.explain||''}`;
        markDone(id,c);
      }else{b.classList.add('bad');b.disabled=true;fb.innerHTML='<span class="cross">✖ Não é essa.</span> Tente novamente.';}
    };
    c.append(b);
  });
  c.append(fb);return c;
}
function renderSQL(a,id){
  const c=h('div','card');if(S.done.has(id))c.classList.add('done');
  if(S.done.has(id)){const st=c.querySelector('.pts');}
  c.append(cardHead('sql'),h('p','q',a.q));
  if(S.done.has(id)){const hd=c.querySelector('.qhead .pts');if(hd)hd.textContent='✔ concluída • 10 XP';}
  const ta=h('textarea','sql');ta.placeholder=a.ph||'Digite seu comando SQL...';ta.spellcheck=false;c.append(ta);
  const hint=h('div','hintbox');hint.innerHTML='💡 '+a.hint;
  const fb=h('div','fb');
  const bCheck=h('button','btn primary');bCheck.textContent='▶ Verificar';
  const bHint=h('button','btn');bHint.textContent='💡 Dica';
  const bClr=h('button','btn');bClr.textContent='Limpar';
  bHint.onclick=()=>hint.style.display='block';
  bClr.onclick=()=>{ta.value='';fb.innerHTML='';};
  bCheck.onclick=()=>{
    const v=ta.value;fb.innerHTML='';
    if(!v.trim()){fb.innerHTML='<span class="cross">✖</span> Digite um comando SQL.';return;}
    let ok=true;const ul=h('ul');
    a.must.forEach(m=>{const p=m.re.test(v);ok=ok&&p;ul.append(h('li',null,`<span class="${p?'check':'cross'}">${p?'✔':'✖'}</span> ${m.label}`));});
    (a.mustNot||[]).forEach(m=>{const bad=m.re.test(v);ok=ok&&!bad;ul.append(h('li',null,`<span class="${bad?'cross':'check'}">${bad?'✖':'✔'}</span> ${m.label}`));});
    fb.append(ul);
    if(ok){
      fb.append(h('div','console',a.ok||'Query OK'));
      if(a.table)fb.append(resultTable(a.table));
      if(a.sol){const d=h('details');d.append(h('summary',null,'Ver solução modelo'));d.append(h('pre',null,esc(a.sol)));fb.append(d);}
      markDone(id,c);
    }
  };
  const row=h('div','btnrow');row.append(bCheck,bHint,bClr);
  c.append(row,hint,fb);return c;
}
function renderMatch(a,id){
  const c=h('div','card');if(S.done.has(id))c.classList.add('done');
  c.append(cardHead('match'),h('p','q',a.q));
  const rights=a.pairs.map(p=>p.r);const shuf=[...rights].sort(()=>Math.random()-.5);
  const selMap=[];
  a.pairs.forEach(p=>{
    const row=h('div','pair');
    row.append(h('code',null,esc(p.l)));
    const s=h('select','m');s.append(h('option',null,'— selecione —'));
    shuf.forEach(r=>{const o=h('option');o.value=r;o.textContent=r;s.append(o);});
    row.append(s);selMap.push({sel:s,right:p.r});c.append(row);
  });
  const fb=h('div','fb');
  const b=h('button','btn primary');b.textContent='▶ Verificar';
  b.onclick=()=>{
    let ok=true;
    selMap.forEach(({sel,right})=>{const g=sel.value===right;sel.style.borderColor=g?'#34d399':'#f87171';if(!g)ok=false;});
    if(ok){fb.innerHTML=`<span class="check">✔ Perfeito! Todos os pares corretos.</span> ${a.explain||''}`;markDone(id,c);}
    else fb.innerHTML='<span class="cross">✖</span> Alguns pares estão errados (borda vermelha). Tente de novo.';
  };
  const row=h('div','btnrow');row.append(b);c.append(row,fb);return c;
}
function resultTablesBlock(tables){
  const w=h('div','schema');
  w.append(h('p',null,'<b style="color:#fbbf24">📖 Dicionário de dados — banco <code>loja</code> (use como referência)</b>'));
  tables.forEach(t=>{
    const label=t.cols[0]==='id_cliente'?'clientes':t.cols[0]==='id_produto'?'produtos':'pedidos';
    w.append(h('h4',null,'Tabela: '+label));
    w.append(resultTable(t));
  });
  return w;
}
function buildModule(m){
  const sec=h('section','module');
  sec.append(h('h2',null,`Módulo ${m.num} — ${m.title}`),h('p','week',m.week));
  const g=h('div','summary');g.innerHTML='<b>🎯 Objetivos</b>';
  const ul=h('ul');m.goals.forEach(t=>ul.append(h('li',null,t)));g.append(ul);sec.append(g);
  const s=h('div','summary');s.innerHTML='<b>📘 Resumo do conteúdo</b>';
  const ul2=h('ul');m.summary.forEach(t=>ul2.append(h('li',null,t)));s.append(ul2);sec.append(s);
  if(m.schema)sec.append(resultTablesBlock(m.schema));
  m.activities.forEach((a,i)=>{
    const id=`m${m.num}a${i}`;
    const card=a.type==='quiz'?renderQuiz(a,id):a.type==='sql'?renderSQL(a,id):renderMatch(a,id);
    sec.append(card);
  });
  return sec;
}

let examTimer=null,examState={started:false,finished:false,remaining:EXAM_TIME};
function gradeLetter(p){
  if(p>=94)return['A','🏆 Excelente! Domínio completo do conteúdo.'];
  if(p>=90)return['A-','🌟 Ótimo!'];
  if(p>=86)return['B+','👍 Muito bom!'];
  if(p>=83)return['B','👍 Bom!'];
  if(p>=80)return['B-','👍 Bom, dá para revisar alguns pontos.'];
  if(p>=76)return['C+','🙂 Satisfatório.'];
  if(p>=73)return['C','🙂 Satisfatório.'];
  if(p>=70)return['C-','🙂 Satisfatório, revise os erros.'];
  if(p>=66)return['D+','⚠️ Abaixo do esperado.'];
  if(p>=63)return['D','⚠️ Abaixo do esperado.'];
  if(p>=60)return['D-','⚠️ No limite — revise os módulos!'];
  return['F','📕 Reprovado — revise os módulos e tente novamente!'];
}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function buildExamSection(){
  const sec=h('section','module');sec.id='examSec';
  sec.append(h('h2',null,'🏁 Prova Final Cronometrada'),h('p','week','Modo avaliação — todo o conteúdo do curso'));
  const intro=h('div','examintro');
  intro.innerHTML=`<p>⚠️ Você terá <b style="color:#fbbf24">12 minutos</b> para resolver <b style="color:#fbbf24">${EXAM_QS.length} questões</b> (quizzes, editor SQL e ligar-pares) sobre <b>todos os módulos</b>.</p>
  <p>• Questões de quiz: 1 tentativa de marcação (pode trocar até entregar)<br>• SQL: digite o comando completo<br>• Ao terminar o tempo, a prova é entregue automaticamente<br>• A nota sai em porcentagem e conceito (A a F)</p>`;
  const btnStart=h('button','btn danger');btnStart.textContent='🚀 Iniciar prova';btnStart.style.fontSize='1rem';btnStart.style.padding='12px 26px';
  btnStart.onclick=startExam;
  intro.append(btnStart);
  sec.append(intro);
  const holder=h('div');holder.id='examBody';sec.append(holder);
  return sec;
}
function startExam(){
  if(!confirm(`Iniciar a prova final?\n${EXAM_QS.length} questões • ${EXAM_TIME/60} minutos • sem pausa!`))return;
  clearInterval(examTimer);
  examState={started:true,finished:false,remaining:EXAM_TIME};
  const body=document.getElementById('examBody');body.innerHTML='';
  const bar=h('div','exambar');
  bar.innerHTML=`<span class="timer" id="examTimer">${fmtTime(EXAM_TIME)}</span><div class="tbar"><i id="examTbar"></i></div>`;
  const btnSubmit=h('button','btn danger');btnSubmit.textContent='📤 Entregar prova';btnSubmit.onclick=()=>submitExam(false);
  bar.append(btnSubmit);
  body.append(bar);
  EXAM_QS.forEach((q,i)=>{
    const card=h('div','card');card.id='eq'+i;
    card.append(h('div','qhead',`<span class="tag">Questão ${i+1}/${EXAM_QS.length}</span><span class="pts">1 ponto</span>`),h('p','q',q.q));
    if(q.type==='quiz'){
      q.options.forEach((t,j)=>{
        const b=h('button','opt');b.textContent=t;
        b.onclick=()=>{card.dataset.answer=j;card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');};
        card.append(b);
      });
    } else if(q.type==='sql'){
      const ta=h('textarea','sql');ta.placeholder='Digite seu comando SQL...';ta.spellcheck=false;card.append(ta);
      card.append(h('div','fb'));
    } else {
      const shuf=[...q.pairs.map(p=>p.r)].sort(()=>Math.random()-.5);
      q.pairs.forEach(p=>{
        const row=h('div','pair');
        row.append(h('code',null,esc(p.l)));
        const s=h('select','m');s.append(h('option',null,'— selecione —'));
        shuf.forEach(r=>{const o=h('option');o.value=r;o.textContent=r;s.append(o);});
        row.append(s);card.append(row);
      });
      card.append(h('div','fb'));
    }
    body.append(card);
  });
  const fin=h('div','btnrow');fin.style.justifyContent='center';
  const bEnd=h('button','btn danger');bEnd.textContent='📤 Entregar prova';bEnd.onclick=()=>submitExam(false);
  fin.append(bEnd);body.append(fin);
  examTimer=setInterval(()=>{
    examState.remaining--;
    const tEl=document.getElementById('examTimer'),bEl=document.getElementById('examTbar');
    if(!tEl){clearInterval(examTimer);return;}
    tEl.textContent=fmtTime(Math.max(examState.remaining,0));
    bEl.style.width=(examState.remaining/EXAM_TIME*100)+'%';
    if(examState.remaining<=60){tEl.className='timer danger';bEl.style.background='#f87171';}
    else if(examState.remaining<=180){tEl.className='timer warn';bEl.style.background='#fbbf24';}
    if(examState.remaining<=0)submitExam(true);
  },1000);
}
function submitExam(auto){
  if(!examState.started||examState.finished)return;
  examState.finished=true;clearInterval(examTimer);
  let score=0;const detail=[];
  EXAM_QS.forEach((q,i)=>{
    const card=document.getElementById('eq'+i);let ok=false;
    if(q.type==='quiz'){
      const chosen=card.dataset.answer;
      card.querySelectorAll('.opt').forEach((o,j)=>{
        o.disabled=true;
        if(j===q.answer)o.classList.add('ok');
        else if(chosen!==undefined&&+chosen===j)o.classList.add('bad');
      });
      ok=chosen!==undefined&&+chosen===q.answer;
    } else if(q.type==='sql'){
      const ta=card.querySelector('textarea');const v=ta.value;ta.disabled=true;
      ok=q.must.every(m=>m.re.test(v))&&(q.mustNot||[]).every(m=>!m.re.test(v));
      const fb=card.querySelector('.fb');fb.innerHTML='';
      const ul=h('ul');
      q.must.forEach(m=>{const p=m.re.test(v);ul.append(h('li',null,`<span class="${p?'check':'cross'}">${p?'✔':'✖'}</span> ${m.label}`));});
      fb.append(ul);
      if(ok)fb.append(h('p','check','✔ Correto!'));
      else{fb.append(h('p','cross','✖ Incorreto.'));const d=h('details');d.append(h('summary',null,'Solução modelo'));d.append(h('pre',null,esc(q.sol||'')));fb.append(d);}
    } else {
      let mOk=true;
      card.querySelectorAll('select').forEach((s,idx)=>{s.disabled=true;const g=s.value===q.pairs[idx].r;s.style.borderColor=g?'#34d399':'#f87171';if(!g)mOk=false;});
      const fb=card.querySelector('.fb');fb.innerHTML=mOk?'<span class="check">✔ Todos os pares corretos!</span>':'<span class="cross">✖ Há pares incorretos.</span>';
      ok=mOk;
    }
    if(ok)score++;
    detail.push(ok);
    card.classList.add(ok?'exOk':'exBad');
  });
  const pct=Math.round(score/EXAM_QS.length*100);
  const[letter,msg]=gradeLetter(pct);
  const used=EXAM_TIME-examState.remaining;
  const body=document.getElementById('examBody');
  const res=h('div','result');
  res.innerHTML=`${auto?'<p class="cross">⏰ Tempo esgotado — prova entregue automaticamente!</p>':''}
  <div class="letter">${letter}</div>
  <p style="font-size:1.2rem;color:#fff">${pct}% • ${score}/${EXAM_QS.length} questões</p>
  <p class="msg">${msg}</p>
  <p style="color:#64748b;font-size:.8rem">Tempo utilizado: ${fmtTime(used)} de ${fmtTime(EXAM_TIME)}</p>`;
  const bAgain=h('button','btn primary');bAgain.textContent='🔄 Refazer prova';bAgain.onclick=startExam;
  res.append(bAgain);
  body.insertBefore(res,body.firstChild);
  body.scrollIntoView({behavior:'smooth'});
}

/* ============ NAVEGAÇÃO ============ */
const nav=document.getElementById('tabs'),content=document.getElementById('content');
const sections=[];
MODULES.forEach(m=>{
  const b=h('button','tab');b.innerHTML=`<b>M${m.num}</b> · ${m.tab}`;
  b.onclick=()=>show(sections.length);
  nav.append(b);sections.push(b);
  content.append(buildModule(m));
});
const examBtn=h('button','tab exam');examBtn.innerHTML='🏁 Prova Final';
examBtn.onclick=()=>show(sections.length);
nav.append(examBtn);sections.push(examBtn);
content.append(buildExamSection());

function show(i){
  sections.forEach((b,j)=>b.classList.toggle('active',j===i));
  content.querySelectorAll(':scope > section').forEach((s,j)=>s.style.display=j===i?'block':'none');
  window.scrollTo({top:0,behavior:'smooth'});
}
refreshScore();show(0);
</script>

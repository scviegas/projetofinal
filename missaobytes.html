/* ================= ESTADO ================= */
const state = JSON.parse(localStorage.getItem('missao-bytes') || '{"xp":0,"badges":[],"done":[]}');
const el = id => document.getElementById(id);
function save(){ localStorage.setItem('missao-bytes', JSON.stringify(state)); renderHUD(); }
function addXP(n){ state.xp += n; toast('⭐ +'+n+' XP!'); save(); }
function toast(m){ const t=el('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2500); }
function resetGame(){ if(confirm('Reiniciar toda a missão? XP e badges serão perdidos.')){
  localStorage.removeItem('missao-bytes'); location.reload(); } }
function shuffleIdx(n){ const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function transpose(s){ const t=[]; for(let i=0;i<4;i++) for(let j=0;j<4;j++) t.push(s[j*4+i]); return t; }
function gridHTML(seq,cols){ return '<div class="pixgrid g'+cols+'">'+
  seq.map(c=>'<div class="px" style="background:'+COL[c]+'"></div>').join('')+'</div>'; }
function optHTML(label,seq,cols){ return '<div class="gOpt">'+gridHTML(seq,cols)+'<span>'+label+'</span></div>'; }

/* ================= HUD / MAPA ================= */
function renderHUD(){
  el('xp').textContent = state.xp;
  el('xpbar').style.width = Math.min(100, state.xp/18)+'%';
  el('badges').innerHTML = state.badges.length ? state.badges.join(' ') : '—';
}
function rankNome(xp){
  if(xp>=1550) return '🛡️ GUARDIÃO DOS BYTES';
  if(xp>=1150) return '🛠️ Engenheiro de Serialização';
  if(xp>=550)  return '📨 Mensageiro Global';
  return '🧑‍💻 Estagiário de Redes';
}
function telaMapa(){
  el('content').innerHTML = `
  <div class="card">
    <h2>🗺️ Central do Mensageiro</h2>
    <p>Você é o <b>Mensageiro da Jala</b>. Uma mensagem crítica precisa chegar intacta a um amigo
    do outro lado do mundo — passe pelas 5 fases de treinamento e enfrente o
    <b>Boss da Adulteração</b> (baseado nos slides da Semana 2).</p>
    <p class="muted">Progresso salvo no navegador • Badges: ${state.badges.length}/6</p>
  </div>
  <div class="phase-grid">
    ${PHASES.map(p=>{
      const done = state.done.includes(p.id);
      return `<button class="phase-btn" onclick="telaIntro('${p.id}')">
        <div class="icon">${p.icon}</div>
        <div><b>${p.nome}</b></div>
        <div class="meta">${p.tema} • bônus ${p.bonus} XP ${done?'<span class="done-mark">✔ concluída</span>':''}</div>
      </button>`;}).join('')}
  </div>
  <div class="card"><h2>🏆 Ranking atual</h2><div class="final-rank">${rankNome(state.xp)}</div></div>`;
}
function telaIntro(id){
  const p = PHASES.find(x=>x.id===id);
  el('content').innerHTML = `
  <div class="card">
    <h2>${p.icon} ${p.nome}</h2>
    <p>${INTROS[id]}</p>
    <p class="muted">Tema: ${p.tema} • Bônus de fase: ${p.bonus} XP + Badge ${p.badge}</p><br>
    <button class="btn-primary" onclick="telaQuiz('${p.id}')">▶ Iniciar missão</button>
    <button class="btn-ghost" onclick="telaMapa()">← Voltar</button>
  </div>`;
}

/* ================= QUIZ (multipla escolha / rebuild) ================= */
function telaQuiz(pid, idx=0, acertos=0){
  const qs = QUIZ[pid], p = PHASES.find(x=>x.id===pid);
  if(idx >= qs.length){
    const bonus = Math.round(p.bonus * acertos / qs.length);
    state.xp += bonus;
    if(!state.done.includes(pid)) state.done.push(pid);
    if(!state.badges.includes(p.badge)) state.badges.push(p.badge);
    save();
    el('content').innerHTML = `<div class="card">
      <h2>🎉 ${p.icon} Fase concluída!</h2>
      <p>Acertos: <b>${acertos}/${qs.length}</b> → bônus <b>+${bonus} XP</b></p>
      <p>Badge conquistada: ${p.badge} <b>${p.nome.replace(/—/,'|').split('|')[1]||''}</b></p>
      <div class="final-rank">${rankNome(state.xp)}</div><br>
      <button class="btn-primary" onclick="telaMapa()">🗺️ Voltar ao mapa</button></div>`;
    return;
  }
  const q = qs[idx];
  if(q.type==='order'){ telaOrder(pid,idx,acertos,q); return; }
  const opts = q.o ? q.o.map(t=>({label:t})) : q.options;
  el('content').innerHTML = `<div class="card">
    <h2>${p.icon} ${p.nome}</h2>
    <p class="muted">Desafio ${idx+1} de ${qs.length} • Acertos: ${acertos}</p>
    <h3>${q.q}</h3>
    ${q.code?`<pre class="code">${q.code}</pre>`:''}
    ${opts.map((op,i)=>`<button class="opt" onclick="respMC('${pid}',${idx},${acertos},${i},${q.a})">${op.html?op.html:op.label}</button>`).join('')}
    <div class="feedback" id="fb"></div><div id="next"></div></div>`;
}
function respMC(pid,idx,acertos,escolha,correta){
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===correta) b.classList.add('correct');
    else if(i===escolha) b.classList.add('wrong');
  });
  const q=QUIZ[pid][idx], fb=el('fb');
  if(escolha===correta){ acertos++; addXP(20); fb.className='feedback ok'; fb.innerHTML='✅ <b>Correto!</b> '+q.e; }
  else{ fb.className='feedback err'; fb.innerHTML='❌ <b>Quase!</b> '+q.e; }
  el('next').innerHTML='<button class="btn-primary" onclick="telaQuiz(\''+pid+'\','+(idx+1)+','+acertos+')">'+
    (idx+1<QUIZ[pid].length?'Próximo desafio →':'Ver resultado 🏅')+'</button>';
}

/* ================= DESAFIO DE ORDEM ================= */
let O=null;
function telaOrder(pid,idx,acertos,q){
  O={pid,idx,acertos,q,progress:[],err:false,disp:shuffleIdx(q.items.length)};
  const p=PHASES.find(x=>x.id===pid);
  el('content').innerHTML=`<div class="card">
    <h2>${p.icon} ${p.nome}</h2>
    <p class="muted">Desafio de ordem (+40 XP se acertar de primeira) — clique na sequência correta</p>
    <h3>${q.q}</h3>
    <div class="seq" id="seqStrip"></div>
    <div>${O.disp.map(i=>`<button class="item" id="it${i}" onclick="clickOrd(${i})">${q.items[i]}</button>`).join(' ')}</div>
    <div class="feedback" id="fb"></div><div id="next"></div></div>`;
}
function clickOrd(i){
  const t=O.q.seq[O.progress.length], btn=el('it'+i);
  if(i===t){
    O.progress.push(i);
    btn.classList.add('sel'); btn.disabled=true;
    el('seqStrip').insertAdjacentHTML('beforeend','<span class="chip">'+O.q.items[i]+'</span>');
    if(O.progress.length===O.q.seq.length){
      const ok=!O.err, acertos=ok?O.acertos+1:O.acertos, st=O;
      if(ok) addXP(40);
      const fb=el('fb'); fb.className='feedback '+(ok?'ok':'err');
      fb.innerHTML=(ok?'✅ <b>Sequência perfeita! (+40 XP)</b> ':'⚠️ <b>Sequência concluída, mas com trocas (sem XP).</b> ')+st.q.e;
      el('next').innerHTML='<button class="btn-primary" onclick="telaQuiz(\''+st.pid+'\','+(st.idx+1)+','+acertos+')">Continuar →</button>';
      O=null;
    }
  }else{
    O.err=true;
    btn.classList.add('shake');
    setTimeout(()=>btn.classList.remove('shake'),400);
    el('seqStrip').innerHTML='';
    O.progress=[];
    document.querySelectorAll('.item').forEach(b=>{b.disabled=false;b.classList.remove('sel');});
    toast('❌ Ordem errada! Tente de novo.');
  }
}

/* ================= INICIALIZAÇÃO ================= */
renderHUD();
telaMapa();
</script>
